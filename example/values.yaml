# THE VALUES FILE AN ORGANISATION COMMITS BESIDE ITS OWN Application, in its OWN
# GitOps repository. Copy it there and point the Application at it.
#
# THIS FILE IS THE WHOLE PLATFORM LAYER TURNED ON. The chart's own defaults render
# NOTHING — every `create` toggle is false — so an install that copies nothing gets
# no Certificate, no Issuer and needs no CRD. This file is the other end of that:
# it is what an adopter with cert-manager installed actually sets.
#
# IT IS ALSO A TEST INPUT. `scripts/tests/test_ladder.py`,
# `scripts/tests/test_render_checks.py` and `scripts/tests/test_bootstrap.py`
# render the chart with this exact file, because a values file nobody renders is
# a values file nobody has checked.
#
# ─── what you must change ────────────────────────────────────────────────────
#
# `edgeTLS.issuerRef` — BOTH KEYS. There is no default, and the render refuses
# without them, naming the key. The edge certificate is signed by an authority
# this chart does not own: this organisation's is a hand-minted ClusterIssuer
# whose key is held outside the cluster, and yours is yours.
#
# `edgeTLS.commonName` and `edgeTLS.dnsNames` — the host your edge answers on.
# The chart ships this organisation's as a stated starting value rather than
# leaving it blank; it is not a constant.
#
# ─── what you should not change without reading first ────────────────────────
#
# The `renewBefore` values under `certificates.leaves` in the chart's own
# `values.yaml`. They are one invariant across the whole set, not ten settings.
# This file does not restate them, deliberately — it turns the set on and inherits
# the ladder, which is what keeps one source for it.
#
# ─── what you must do AFTER the first install ────────────────────────────────
#
# EXPORT THE FOUR SECRETS THE BOOTSTRAP JOBS MINT. Nothing tracks them, so nothing
# backs them up either, and a cluster deleted without an export loses the values
# for good. `README.md` carries the command beside the install command.

internalCA:
  create: true

certificates:
  create: true

edgeTLS:
  create: true
  issuerRef:
    name: yadgar-dev-ca
    kind: ClusterIssuer

# THE BOOTSTRAP JOBS. Two pre-install hooks mint the four credentials nothing
# outside the installation can supply, and neither Helm nor Argo tracks the
# Secrets they create — so an uninstall or a prune leaves them standing (ADR-0750).
# Turn this OFF if your own secret manager populates those four names instead;
# every consumer takes a file path and does not care how the file arrived.
#
# EXPORT WHAT THEY MINT. A generated credential nobody exported is a credential
# lost with the cluster. README.md carries the command beside the install command.
bootstrap:
  create: true

  adminToken:
    # NAMED HERE RATHER THAN INHERITED, although the value equals the chart's own
    # default. The parent chart refuses an install where this and the gateway's
    # `gateway.adminBootstrap.tokenSecret` disagree, so the name is a thing an
    # adopter decides rather than a thing that happens to them (ADR-0569's "a
    # value someone can see").
    secretName: admin-bootstrap-token

# ── THE PREFLIGHT: NOTHING TO SET, AND THAT IS THE DECISION ──────────────────
# NO `preflight` BLOCK APPEARS BELOW, AND ITS ABSENCE IS DELIBERATE RATHER THAN AN
# OMISSION. Every `preflight.probes.*` key is left UNSET so the tie in
# `chart/templates/_preflight.tpl` resolves it: `probes.certManager` follows the
# three `create` toggles above, all true here, so this file renders exactly ONE
# probe. Writing the key out would replace a tie that tracks the toggles with a
# constant that does not.
#
# `probes.keda` AND `probes.mariadb` RESOLVE FALSE HERE, AND THAT IS CORRECT. This
# chart renders no ScaledObject and no MariaDB CR, so a probe for either would test
# an operator nothing in this install needs. They are enabled ONE LEVEL UP, in the
# parent chart's own adopter values, where `autoscaling.enabled` and
# `database.create` are visible — a subchart cannot read a sibling's key, so an
# explicit `true` there is the only place the truth can come from.
#
# TO DROP THE DIAGNOSTIC ENTIRELY, set `preflight.enabled: false`. An explicit
# `preflight.probes.certManager: false` also works and is honoured. What is REFUSED
# is `probes.certManager: true` beside three false `create` toggles — a probe for an
# operator this install renders nothing for proves nothing and can only fail for the
# wrong reason, and the refusal names both keys.
