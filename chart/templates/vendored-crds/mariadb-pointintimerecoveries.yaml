{{/*
VENDORED CustomResourceDefinition, EXTRACTED from `mariadb-operator-crds` 26.6.0 —
the subchart `mariadb-operator` 26.6.0 pulls in behind its own `crds.enabled` — and
re-emitted as this chart's own template. Upstream source: `mariadb-operator/charts/mariadb-operator-crds/templates/crds.yaml`.

WHY THIS COPY EXISTS (ADR-0787, ADR-0792 condition 1). `mariadb-operator-crds`
26.6.0 ships its twelve CRDs with NO uninstall protection: `grep -rn
'resource-policy'` over the upstream chart returns no match, and its `values.yaml`
is a 0-byte file offering no key at all. The upstream README states the
consequence against `crds.enabled`: "This should only be set to true during the
initial deployment. If this chart manages the CRDs and is later uninstalled, all
MariaDB instances will be DELETED." The `helm.sh/resource-policy: keep` annotation
below is the protection that warning asks for.

IT CANNOT BE ADDED AT RELEASE TIME, which is what makes the copy permissible
rather than merely convenient. Resolution copies the upstream bytes faithfully —
that is the whole point of it — so no dependency resolution the release pipeline
performs can attach an annotation to another chart's object.
`mariadb-operator.crds.enabled` is false in `chart/values.yaml` for the same
reason: `platform` owns these twelve, and the upstream copies would collide.

WHAT WOULD DELETE THIS FILE (ADR-0792 condition 4, the revisit trigger).
`mariadb-operator` shipping uninstall protection for its own CRDs — a `crds.keep`
key, or the annotation in the upstream document. At that point the extraction has
no subject and these copies should be DELETED rather than re-vendored. Do not
renew them out of habit.

`scripts/tests/test_vendored_crds.py` is the drift gate ADR-0792 condition 3
requires, and it is the condition of this commit rather than a companion to it. It
renders the pin `chart/Chart.yaml` declares, strips the fields that legitimately
differ, and reddens when this document and that render disagree.

THE GUARD BELOW IS THIS FILE'S OWN. It mirrors the `condition:` of the dependency
this CRD belongs to; it is NOT `operators.create` over the directory. `dig` with
`operators.create` as the fallback reproduces helm's own semantics — helm reads
the FIRST valid path of a comma-separated `condition:` and ignores the rest — so
an unset `operators.mariadbOperator.create` defers to the register key and a set
one wins. `or` does NOT reproduce it: it is true where the dependency's condition
is false, which applies mariadb's CRDs to a cluster running no operator at all.
*/}}
