{{/*
THE THREE MACHINE-ONLY CREDENTIALS A FIRST INSTALL USED TO ASK A HUMAN FOR.

ADR-0750: a secret with NO SOURCE OUTSIDE THE INSTALLATION is generated by an
idempotent Job the chart renders, into a Secret nothing owns. Before this, a clone
and an install against an empty cluster did not come up — `valkey` and `nats` each
waited on a Secret an operator had to mint by hand out of a runbook. None of the
three is ever read by a person, so nothing is lost by nobody knowing them.

THREE ALWAYS, AND A FOURTH BEHIND ITS OWN TOGGLE. This header used to read "THREE,
NOT FOUR" and to say `iam-keys` was deliberately not here. THAT PROHIBITION IS
LIFTED AND ITS REASONING IS NOT WITHDRAWN. `iam-keys` is DATA-BEARING — every
stored name is AES-256-GCM ciphertext and every username is found through an HMAC
blind index — so a cluster whose Secret is gone but whose database survived used to
get an `iam` that STARTS HEALTHY AND CANNOT DECRYPT THE ROWS IT ALREADY HAS.
ADR-0753 never refused the fourth `create` outright. It ORDERED that `create`
behind a key-identity marker in the `iam` binary, in a change of its own, first.
The marker shipped in `iam` v0.8.43: the binary records which key set encrypted the
rows and REFUSES TO KEEP RUNNING under a different one, so the silent failure is a
loud refusal now. The fourth `create` below is that ordering satisfied. It stays
behind `bootstrap.iamKeys.create`, which DEFAULTS FALSE, and
`scripts/tests/test_bootstrap.py` asserts both arms — three minted with the toggle
off, four with it on — rather than trusting this comment.

A JOB, NOT A TEMPLATE WITH `lookup`. The alternative shape is a pre-install hook
that calls `lookup` to see whether the Secret exists and generates only if it does
not. D54 measured `lookup` returning an empty map whenever there is no cluster
connection, which is how Argo renders — so that hook would believe every Secret
absent on every sync and regenerate all three, under `selfHeal`, on a schedule.
That is the live-credential rotation ADR-0750 property 1 forbids, arriving
silently.

A HOOK, SO A FAILURE STOPS THE INSTALL. Rendered as a plain resource a failing Job
DECORATES the install: `helm install` returns success, the estate is half-up, and
the failure is a red Job somebody may or may not read. As a `pre-install,
pre-upgrade` hook Helm waits for it and ABORTS. Under Argo the same annotation
becomes a `PreSync` hook and a failed hook fails the sync — a claim about a specific
Argo version, which the plan this chart is built from records as UNPROVED and
schedules; nothing here may report it as proved.
`helm.sh/hook-delete-policy: before-hook-creation` handles the Job's immutability
on upgrade: `spec.template` and `selector` cannot be patched, so the Job is deleted
and recreated rather than the apply failing. Re-running is safe by construction —
see the 409 handling below.

NO `argocd.argoproj.io/sync-wave`, and the manifest this is moved from carries one.
Under helm a wave means nothing, and under Argo a hook's phase is what orders it.
The two Jobs share ONE weight above the RBAC triple's, because they mint disjoint
Secret names and nothing orders one against the other.

IDEMPOTENCE IS ENFORCED BY THE API SERVER. The script does NOT read first and write
second. It POSTs, and treats the 409 AlreadyExists it gets on every run after the
first as success. There is no check-then-act window because there is no check, and
`templates/bootstrap-rbac.yaml` grants `create` alone — so this Job could not
overwrite a live credential even if the script were wrong. The Secrets in a running
cluster are left byte for byte as they are, which is what makes a RESTORE ordinary:
create the Secret from a backup before installing, and the Job stands down.

THE SECRET IS NEVER TEMPLATED, AND THAT IS ADR-0750 PROPERTY 2. Because the Job
POSTs it, the Secret is in neither Helm's release manifest nor Argo's tracked set:
an uninstall does not delete it and a prune does not remove it, so the key outlives
the release that caused it. `helm template` emits hooks, so a Secret templated
anywhere in this chart would show up in the render — which is exactly how
`test_bootstrap.py` asserts this property.

NOT A PORTABILITY PROBLEM (D80). Every consumer takes a FILE PATH and knows nothing
about how the file arrived. An adopter running Vault, External Secrets, SOPS or a
cloud secret manager sets `bootstrap.create` false, populates the same three Secret
names themselves, and changes no service.

THE THREE NAMES ARE LITERALS, NOT VALUES, and that is deliberate. They are read by
the charts that MOUNT them — `valkey`, `nats` and `gateway` each name their Secret
in their own values — so a name configurable here and fixed there would be a knob
that breaks the estate rather than one that adapts it. The admin token's name IS a
value, because the parent has to make it agree with what the gateway mounts.
*/}}
{{- if .Values.bootstrap.create }}
{{- $bootstrap := .Values.bootstrap }}
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-secrets
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  # Four attempts, because the failures worth retrying are a rescheduled pod and an
  # API server that is briefly unreachable. A 403 does not become a 201 on the
  # fourth try, and the Job going Failed aborts the install — which is the correct
  # loud failure: the estate cannot come up without these Secrets, so an operator
  # should be looking at this Job rather than at a pod stuck in ContainerCreating
  # with nothing to explain it.
  backoffLimit: {{ $bootstrap.backoffLimit }}
  template:
    metadata:
      labels: { app.kubernetes.io/name: bootstrap-secrets }
    spec:
      serviceAccountName: {{ $bootstrap.serviceAccountName }}
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          # curl and a shell, pinned. The official curl project image rather than
          # a `kubectl` one: `registry.k8s.io/kubectl` is distroless with
          # `/bin/kubectl` as its entrypoint and NO SHELL, which cannot run a
          # script at all. The Kubernetes API is a REST API and this needs three
          # POSTs, so `kubectl` was never buying anything beyond a larger image.
          image: {{ $bootstrap.image }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            # `$(...)` BELOW IS THE SHELL'S, NOT KUBERNETES'. Kubernetes expands
            # `$(VAR)` inside `command` and `args`, but only where VAR names an
            # environment variable of this container, and an unresolvable
            # reference is documented to be left unchanged. This container
            # declares no environment at all, so every substitution here reaches
            # /bin/sh untouched.
            - |
              set -eu

              api="https://kubernetes.default.svc"
              sa="/var/run/secrets/kubernetes.io/serviceaccount"
              ns="$(cat "$sa/namespace")"
              token="$(cat "$sa/token")"

              # POST one Secret and classify the answer. 201 is a first run and
              # 409 is every run after it; ANYTHING ELSE IS A FAILURE and stops
              # the Job. A 403 from a mis-bound Role in particular must not be
              # read as "it already exists" — that reading reports a healthy
              # bootstrap while every consumer waits on a Secret nobody created,
              # with nothing pointing at the cause.
              #
              # The body arrives on STDIN rather than as an argument, so the
              # generated credential never enters this container's process table.
              create() {
                code="$(curl --silent --show-error \
                  --cacert "$sa/ca.crt" \
                  --header "Authorization: Bearer $token" \
                  --header "Content-Type: application/json" \
                  --data-binary @- \
                  --output /dev/null --write-out '%{http_code}' \
                  "$api/api/v1/namespaces/$ns/secrets")"
                case "$code" in
                  201) echo "$1: created" ;;
                  409) echo "$1: already exists, left untouched" ;;
                  *) echo "$1: refused with HTTP $code" >&2; exit 1 ;;
                esac
              }

              # `$2` RANDOM BYTES AS BASE64, into `value`, AND CHECKED BEFORE ANY
              # REQUEST BODY IS BUILT. NO TRAILING NEWLINE: the newline is
              # load-bearing by its absence — a `\n` on the server's copy of a
              # `requirepass` but not on the client's is a WRONGPASS with no
              # visible cause.
              #
              # THE WIDTH IS AN ARGUMENT BECAUSE THIS SCRIPT MINTS TWO KINDS OF
              # THING, and 44 characters is the exact length of both. A PASSWORD
              # is 33 bytes rather than 32, so its base64 carries no `=` padding
              # for anyone to trim. A KEY FILE is 32 bytes, because `iam` reads
              # `encryption.key` and `blind-index.key` as raw AES-256 and HMAC
              # key material and REFUSES ANY LENGTH BUT 32; its base64 is 44
              # characters with one `=` of padding. So the one check below holds
              # for both widths, and 44 is an EXACT length rather than a minimum.
              #
              # A GENERATOR CALLED AS `$(password)` INSIDE THE HEREDOC COULD NOT
              # FAIL THE RUN, and that is the whole reason this assigns first.
              # Command substitution DISCARDS the function's exit status — it
              # never becomes the `create` command's — so `set -e` cannot see it;
              # and the pipeline masks it a second time, because a pipeline
              # reports only its LAST element's status. An image whose `base64` is
              # absent then mints an EMPTY credential, the POST answers 201, and
              # the Job reports "created" and exits 0.
              #
              # AND IT WOULD BE STICKY. This Job's Role grants `create` alone and
              # a 409 is success, so every later run reports "already exists, left
              # untouched" and repairs nothing. Recovery needs the Secret DELETED
              # first, which nobody reaches for against a green Job.
              #
              # It does not fire as shipped: `curlimages/curl` is Alpine and
              # busybox provides `base64`. But `bootstrap.image` is a VALUE, and
              # this is one of the demands this script makes of whatever it names
              # — `values.yaml` lists all four beside the digest.
              mint() {
                value="$(head -c "$2" /dev/urandom | base64 | tr -d '\n')"
                if [ "${#value}" -ne 44 ]; then
                  echo "$1: generated a ${#value}-character credential, expected 44" >&2
                  exit 1
                fi
              }

              # `stringData` rather than `data`: the API server stores the bytes
              # given, so what lands is the password and nothing appended. The
              # value reaches the body as `$value` and the body reaches curl on
              # STDIN, so it still never enters this container's process table —
              # an argument would put it there.
              mint valkey-password 33
              create valkey-password <<JSON
              {"apiVersion":"v1","kind":"Secret","type":"Opaque",
               "metadata":{"name":"valkey-password"},
               "stringData":{"password":"$value"}}
              JSON

              mint nats-auth 33
              create nats-auth <<JSON
              {"apiVersion":"v1","kind":"Secret","type":"Opaque",
               "metadata":{"name":"nats-auth"},
               "stringData":{"password":"$value"}}
              JSON

              # `gateway`'s broker credential, a SEPARATE Secret from `nats-auth`
              # rather than a second key on it — this Job's Role grants `create`
              # alone, so a key added to an already-created Secret would 409
              # forever and never land.
              mint nats-auth-gateway 33
              create nats-auth-gateway <<JSON
              {"apiVersion":"v1","kind":"Secret","type":"Opaque",
               "metadata":{"name":"nats-auth-gateway"},
               "stringData":{"password":"$value"}}
              JSON
{{- if $bootstrap.iamKeys.create }}

              # THE FOURTH `create`, AND THE ONLY ONE BEHIND A TOGGLE. ADR-0753
              # ordered this behind a key-identity marker in the `iam` binary, in
              # a change of its own, first. `iam` v0.8.43 carries that marker, so
              # this block is legal now. `bootstrap.iamKeys.create` still defaults
              # FALSE, and `values.yaml` beside it records the one gap this does
              # not close — nothing ties the toggle to an `iam` that carries the
              # marker.
              #
              # ONE SECRET, TWO KEYS, AND THE PAIR IS WHAT `make secrets` MINTS.
              # `yadgarhq/deploy`'s `make secrets` creates `iam-keys` with
              # `--from-file=encryption.key=` and `--from-file=blind-index.key=`
              # and nothing else. This Job mints the same two names, so a cluster
              # bootstrapped by the chart and a cluster bootstrapped by hand
              # give `iam` the same file set. `scripts/tests/test_bootstrap.py` asserts
              # that set, by count as well as by name.
              #
              # `data` RATHER THAN `stringData`, AND THE DIFFERENCE IS NOT A STYLE
              # CHOICE. `iam` reads each file with `std::fs::read` and refuses any
              # length but 32 BYTES. `stringData` would store the 44 base64
              # CHARACTERS as the file's bytes, and `iam` would refuse to start
              # with a wrong-length error. `data` is the field the API server
              # base64-DECODES, so 32 raw bytes reach the mount. Each value is
              # therefore base64 already and must not be encoded a second time.
              #
              # TWO INDEPENDENT DRAWS, INTO TWO VARIABLES. The encryption key and
              # the blind-index key are unrelated key material, and `iam`'s own
              # fingerprint is taken over BOTH — a pair sharing one value would be
              # a weaker key set that still looked healthy. Each draw goes through
              # `mint`, so each one's failure stops the Job for the same reason
              # the other three do.
              mint iam-keys 32
              encryption_key="$value"
              mint iam-keys 32
              blind_index_key="$value"
              create iam-keys <<JSON
              {"apiVersion":"v1","kind":"Secret","type":"Opaque",
               "metadata":{"name":"iam-keys"},
               "data":{"encryption.key":"$encryption_key","blind-index.key":"$blind_index_key"}}
              JSON
{{- end }}
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
{{- end }}
