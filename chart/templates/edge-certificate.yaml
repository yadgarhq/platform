{{/*
THE EDGE LEAF, WHICH THIS CHART REQUESTS AND DOES NOT ISSUE — EXCEPT WHEN IT
FALLS BACK TO THE ONE AUTHORITY IT DOES (B3 of
plans/the-one-application-install.md, ADR-0803).

`edgeTLS.issuerRef` carries NO DEFAULT OF ITS OWN in `chart/values.yaml` — it
stays `{}`. THIS TEMPLATE fills it with `{name: internalCA.name, kind: Issuer}`
ONLY when the map is left COMPLETELY EMPTY and `internalCA.create` is true, so
the whole-estate defaults render a working edge Certificate with no issuer
override, while an adopter who states EVEN ONE of `name`/`kind` gets the
`required` guards below rather than a partial mix of their value and this
chart's fallback.

THE FALLBACK LIVES HERE AND NOT AS A DEFAULT IN `values.yaml`, and that split is
load-bearing rather than a style choice. MEASURED: helm deep-merges a values
override into a NON-EMPTY chart default key by key, so a default of
`{name: yadgar-internal-ca, kind: Issuer}` in `values.yaml` could not tell an
adopter who deliberately empties `issuerRef` apart from one who never touched
it — `issuerRef: {}` has no keys to overlay a non-empty default with, so the
default renders straight through, and `issuerRef: {name: my-cluster-ca}` alone
INHERITS `kind: Issuer` from that default rather than leaving it unset, so the
render silently signs with the wrong issuer's `kind` instead of refusing. A map
that is `{}` IN THE CHART'S OWN DEFAULT carries no such ambiguity: an override
of any shape at all is visible as a non-empty map the moment it names one key,
and `empty` reads true only when nothing was stated.

AN ADOPTER SIGNING THE EDGE WITH A DIFFERENT AUTHORITY, OR RUNNING WITH
`internalCA.create` false, STATES BOTH KEYS. A guessed issuer name is worse
than a refusal: it renders an object that never goes Ready, and the operator
meets a pending Certificate instead of a message naming the key they did not
set.

`kind` IS REQUIRED TOO, not only `name`. It decides whether cert-manager looks
the issuer up in this namespace (`Issuer`) or cluster-wide (`ClusterIssuer`),
so a name with no kind is half an address.

`get` RATHER THAN A FIELD ACCESS, so an adopter who leaves `issuerRef` at its
own empty default — with `internalCA.create` false, so no fallback applies —
meets the `required` message rather than a nil-pointer error naming a template
line.

`argocd.argoproj.io/sync-options: Prune=false` (ADR-0851), FOR THE SAME REASON
AS THE LISTENER'S THREE OBJECTS IN `gateway-listener.yaml`. This leaf has no
Helm-side replacement either. An argocd prune deletes the Certificate and so
every renewal of it: with cert-manager's default `enableCertificateOwnerRef:
false` the Secret the listener terminates on stays, and the edge fails when
that leaf expires; with it set true, the Secret goes with the Certificate and
the edge fails at once. The listener still renders either way, so no render
check sees the loss coming. `Delete=false` stays out, same as there.
*/}}
{{- if .Values.edgeTLS.create }}
{{- $edge := .Values.edgeTLS }}
{{- $issuerRef := $edge.issuerRef | default dict }}
{{- if and (empty $issuerRef) .Values.internalCA.create }}
{{- $issuerRef = dict "name" .Values.internalCA.name "kind" "Issuer" }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $edge.name }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  secretName: {{ $edge.name }}
  {{- /* `edgeTLS.commonName` and `edgeTLS.dnsNames`, else `global.hostname`
  (ADR-0808); see `_hostname.tpl` for the order. An empty `dnsNames` becomes a
  list of the one resolved hostname. */}}
  commonName: {{ include "platform.hostname" (dict "local" $edge.commonName "context" $) }}
  dnsNames:
    {{- range ($edge.dnsNames | default (list (include "platform.hostname" (dict "local" "" "context" $)))) }}
    - {{ . }}
    {{- end }}
  duration: {{ $edge.duration }}
  # 720h, THE RUNG HELD OUT OF THE INTERNAL MAP. It is part of the same ladder and
  # no internal leaf may take it. See `values.yaml`'s header.
  renewBefore: {{ $edge.renewBefore }}
  privateKey:
    algorithm: {{ $edge.privateKey.algorithm }}
    size: {{ $edge.privateKey.size }}
    rotationPolicy: {{ $edge.privateKey.rotationPolicy }}
  usages:
    {{- range $edge.usages }}
    - {{ . }}
    {{- end }}
  issuerRef:
    name: {{ required "platform: edgeTLS.issuerRef.name has no default here and must be set. edgeTLS.create is true; either name the authority that signs your edge certificate, or turn internalCA.create on and leave edgeTLS.issuerRef empty for this chart's own internal CA." (get $issuerRef "name") }}
    kind: {{ required "platform: edgeTLS.issuerRef.kind has no default here and must be set. It decides whether the issuer is looked up in this namespace (Issuer) or cluster-wide (ClusterIssuer), so a name without it is half an address — and naming only one of the two keys does not qualify for the internal-CA fallback, which applies only when the whole map is left empty." (get $issuerRef "kind") }}
    group: cert-manager.io
{{- end }}
