{{/*
VENDORED CustomResourceDefinition, EXTRACTED from `mariadb-operator-crds` 26.6.0 —
the subchart `mariadb-operator` 26.6.0 pulls in behind its own `crds.enabled` — and
re-emitted as this chart's own template. Upstream source: `mariadb-operator/charts/mariadb-operator-crds/templates/crds.yaml`.

WHY THIS COPY EXISTS (ADR-0787, ADR-0792 condition 1). `mariadb-operator-crds`
26.6.0 ships its twelve CRDs with NO uninstall protection: `grep -rn
'resource-policy'` over the upstream chart returns no match, and its `values.yaml`
is a 0-byte file offering no key at all. The upstream README states the
consequence against `crds.enabled`: "This should only be set to true during the
initial deployment. If this chart manages the CRDs and is later uninstalled, all
MariaDB instances will be DELETED." The `helm.sh/resource-policy: keep` annotation
below is the protection that warning asks for.

IT CANNOT BE ADDED AT RELEASE TIME, which is what makes the copy permissible
rather than merely convenient. Resolution copies the upstream bytes faithfully —
that is the whole point of it — so no dependency resolution the release pipeline
performs can attach an annotation to another chart's object.
`mariadb-operator.crds.enabled` is false in `chart/values.yaml` for the same
reason: `platform` owns these twelve, and the upstream copies would collide.

WHAT WOULD DELETE THIS FILE (ADR-0792 condition 4, the revisit trigger).
`mariadb-operator` shipping uninstall protection for its own CRDs — a `crds.keep`
key, or the annotation in the upstream document. At that point the extraction has
no subject and these copies should be DELETED rather than re-vendored. Do not
renew them out of habit.

`scripts/tests/test_vendored_crds.py` is the drift gate ADR-0792 condition 3
requires, and it is the condition of this commit rather than a companion to it. It
renders the pin `chart/Chart.yaml` declares, strips the fields that legitimately
differ, and reddens when this document and that render disagree.

THE GUARD BELOW IS THIS FILE'S OWN, AND IT GOES THROUGH THE SHARED HELPER. It
mirrors the `condition:` of the dependency this CRD belongs to; it is NOT
`operators.create` over the directory. `templates/_operators.tpl` holds the one
expression every site reading `operators` calls, and its header carries the whole
argument: `dig` with `operators.create` as the fallback reproduces helm's own
resolution of a comma-separated `condition:`, `or` does not, and the
`kindIs "map"` arm inside it is what stops an adopter's `operators: true` raising
a Go stack trace out of THIS file before the refusal that names the key can run
(ADR-0794).
*/}}
{{- if (include "platform.operator-create" (dict "context" $ "operator" "mariadbOperator")) }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    helm.sh/resource-policy: keep
  name: externalmariadbs.k8s.mariadb.com
spec:
  group: k8s.mariadb.com
  names:
    kind: ExternalMariaDB
    listKind: ExternalMariaDBList
    plural: externalmariadbs
    shortNames:
    - emdb
    singular: externalmariadb
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ExternalMariaDB is the Schema for the external MariaDBs API. It is used to define external MariaDB server.
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation of an object.

              Servers should convert recognized schemas to the latest internal value, and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this object represents.

              Servers may infer this from the endpoint the client submits requests to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: ExternalMariaDBSpec defines the desired state of an External MariaDB
            properties:
              connection:
                description: Connection defines a template to configure a Connection for the external MariaDB.
                properties:
                  healthCheck:
                    description: HealthCheck to be used in the Connection.
                    properties:
                      interval:
                        description: Interval used to perform health checks.
                        type: string
                      retryInterval:
                        description: RetryInterval is the interval used to perform health check retries.
                        type: string
                    type: object
                  params:
                    additionalProperties:
                      type: string
                    description: Params to be used in the Connection.
                    type: object
                  port:
                    description: Port to connect to. If not provided, it defaults to the MariaDB port or to the first MaxScale listener.
                    format: int32
                    type: integer
                  secretName:
                    description: SecretName to be used in the Connection.
                    type: string
                  secretTemplate:
                    description: SecretTemplate to be used in the Connection.
                    properties:
                      databaseKey:
                        description: DatabaseKey to be used in the Secret.
                        type: string
                      format:
                        description: Format to be used in the Secret.
                        type: string
                      hostKey:
                        description: HostKey to be used in the Secret.
                        type: string
                      key:
                        description: Key to be used in the Secret.
                        type: string
                      metadata:
                        description: Metadata to be added to the Secret object.
                        properties:
                          annotations:
                            additionalProperties:
                              type: string
                            description: Annotations to be added to children resources.
                            type: object
                          labels:
                            additionalProperties:
                              type: string
                            description: Labels to be added to children resources.
                            type: object
                        type: object
                      passwordKey:
                        description: PasswordKey to be used in the Secret.
                        type: string
                      portKey:
                        description: PortKey to be used in the Secret.
                        type: string
                      usernameKey:
                        description: UsernameKey to be used in the Secret.
                        type: string
                    type: object
                  serviceName:
                    description: ServiceName to be used in the Connection.
                    type: string
                type: object
              host:
                description: Hostname of the external MariaDB.
                type: string
              image:
                description: 'Image name to be used to perform operations on the external MariaDB, for example, for taking backups.

                  The supported format is `<image>:<tag>`. Only MariaDB official images are supported.

                  If not provided, the MariaDB image version be inferred by the operator in runtime. The default MariaDB image will be used in this case,'
                type: string
              imagePullPolicy:
                description: ImagePullPolicy is the image pull policy. One of `Always`, `Never` or `IfNotPresent`. If not defined, it defaults to `IfNotPresent`.
                enum:
                - Always
                - Never
                - IfNotPresent
                type: string
              imagePullSecrets:
                description: ImagePullSecrets is the list of pull Secrets to be used to pull the image.
                items:
                  description: 'Refer to the Kubernetes docs: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.36/#localobjectreference-v1-core.'
                  properties:
                    name:
                      default: ''
                      type: string
                  type: object
                type: array
              inheritMetadata:
                description: InheritMetadata defines the metadata to be inherited by children resources.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Annotations to be added to children resources.
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    description: Labels to be added to children resources.
                    type: object
                type: object
              passwordSecretKeyRef:
                description: PasswordSecretKeyRef is a reference to the password to connect to the external MariaDB.
                properties:
                  key:
                    type: string
                  name:
                    default: ''
                    type: string
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
              port:
