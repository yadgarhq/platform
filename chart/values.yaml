# EVERY `create` TOGGLE IN THIS FILE IS FALSE, AND THAT IS THE CHART'S CONTRACT
# RATHER THAN A STARTING POSITION (ADR-0752). The chart installs on a bare cluster
# rendering nothing and requiring no CRD. An adopter turns the layer on in their
# own values file; this organisation states every toggle explicitly false, so the
# file documents what `yadgarhq/deploy` still owns (ADR-0569's "a value someone
# can see").
#
# THE NAME IS `create` AND NOT `enabled`, deliberately. `enabled` reads as "this
# feature is on"; these say "render this object". The cost of the distinction is
# that `flip_enabled` in `yadgarhq/actions`' `scripts/d80_portability.py` — "Set
# every key named `enabled`, at any depth, to false" — cannot see a key named
# `create`, so the shared portability job does not cover these toggles. The plan
# this chart is built from files that one-line change to the shared job
# separately, and until it lands nothing may report the shared job as covering
# them.

# ── THE INTERNAL AUTHORITY ───────────────────────────────────────────────────
# Three objects, one chain: a self-signed Issuer, the CA Certificate it signs,
# and the CA Issuer that consumes that Certificate's Secret. Nothing else in this
# estate signs a pod-to-pod leaf.
internalCA:
  create: false

  # The self-signed Issuer at the root. It exists to sign exactly one object, the
  # CA Certificate below.
  selfSignedIssuerName: yadgar-internal-selfsign

  # ONE NAME FOR THREE THINGS, and that is how the authority is wired: the CA
  # Certificate, the Secret it writes and the CA Issuer that reads that Secret all
  # carry this name. `certificates.issuerRef.name` below names the same string,
  # which is what makes the leaves this authority's leaves.
  name: yadgar-internal-ca
  commonName: yadgar internal CA

  # TEN YEARS, and the key NEVER ROTATES. `rotationPolicy: Never` is the load-
  # bearing half: a CA whose key rotates invalidates every leaf it has issued, so
  # the renewal of this Certificate must re-sign with the SAME key. The one-year
  # `renewBefore` is the CA's own renewal window and is NOT a rung of the leaf
  # ladder below — `scripts/tests/test_ladder.py` scopes the ladder to the
  # Certificates that are not `isCA` for exactly that reason.
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never

# ── THE TEN INTERNAL LEAVES, AND THE LADDER ACROSS THEM ──────────────────────
# READ THIS BEFORE ADDING OR MOVING A LEAF. The `renewBefore` values below are one
# invariant, not ten settings. They are distinct and six hours apart so that AT
# MOST ONE SERVICE RESTARTS PER RENEWAL INSTANT, and a leaf renews every
# `duration - renewBefore`, so a distinct `renewBefore` is a distinct period as
# well as a distinct instant and the separations grow rather than drifting back
# together. The full argument is the header of
# `deploy/infra/internal-tls/certificates.yaml`, which these values are moved
# from unchanged.
#
# 720h IS DELIBERATELY ABSENT FROM THIS MAP. It belongs to the EDGE leaf under
# `edgeTLS` below, which a different authority issues and a different toggle
# renders. The ladder is shared across both: a step is free only if NEITHER uses
# it. THE NEXT FREE STEP IS 786h, then 792h. Never a value already in use.
#
# THE LEAVES ARE A MAP KEYED BY NAME, CARRYING THE `renewBefore` EXPLICITLY, and
# no template derives one. A range over a list of modules that computed the step
# from an index would render the same ten objects today and destroy the invariant
# the moment the list was reordered — the value would follow the position instead
# of the leaf. The template ranges over THIS map, and every rung is a line
# somebody wrote down.
certificates:
  create: false

  # WHICH AUTHORITY SIGNS THEM. `internalCA.name` above renders the Issuer this
  # names; the two agreeing is what makes the chain a chain.
  issuerRef:
    name: yadgar-internal-ca
    kind: Issuer

  # SHARED BY EVERY LEAF, because the ladder is the only thing that varies across
  # them. Ninety days, an ECDSA P-256 key, and a key that DOES rotate on renewal —
  # the opposite of the CA above, and correct for a leaf: nothing has been signed
  # with it.
  duration: 2160h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always

  leaves:
    # ── SERVING LEAVES ───────────────────────────────────────────────────────
    # `clusterLocalNames: true` adds the three namespace-qualified forms of the
    # common name to `dnsNames`. A client verifies the certificate against THE
    # HOST IT ASKED FOR rather than the address it reached, and a caller in
    # another namespace dials a longer form — a certificate naming only the short
    # one is a silent trap for the first such caller.
    #
    # `server auth` AND NOT `client auth`. Under the one authority this
    # deployment runs, the absence of the client bit is exactly what stops a
    # stolen serving certificate being replayed as a client credential. Omitting
    # the block entirely would be worse than widening it: cert-manager then issues
    # a leaf with no extended key usage, which webpki accepts in BOTH directions.
    iam-tls:
      commonName: iam
      clusterLocalNames: true
      usages: [server auth, digital signature]
      renewBefore: 726h
    task-tls:
      commonName: task
      clusterLocalNames: true
      usages: [server auth, digital signature]
      renewBefore: 732h
    iam-db-tls:
      commonName: iam-db
      clusterLocalNames: true
      usages: [server auth, digital signature]
      renewBefore: 738h
    task-db-tls:
      commonName: task-db
      clusterLocalNames: true
      usages: [server auth, digital signature]
      renewBefore: 744h
    project-db-tls:
      commonName: project-db
      clusterLocalNames: true
      usages: [server auth, digital signature]
      renewBefore: 768h
    project-tls:
      commonName: project
      clusterLocalNames: true
      usages: [server auth, digital signature]
      renewBefore: 774h

    # ── CLIENT LEAVES ────────────────────────────────────────────────────────
    # A SEPARATE LEAF FOR THE CALLING DIRECTION, with a separate key and a
    # `-caller` common name. `iam` reads `iam-tls` to answer and `iam-client-tls`
    # to call, and naming both directions on one leaf would collapse the wall that
    # replaces a second certificate authority. `clusterLocalNames` is absent:
    # nothing dials a caller, so the name is the identity and no Service form
    # belongs on it.
    gateway-client-tls:
      commonName: gateway-caller
      usages: [client auth, digital signature]
      renewBefore: 750h
    iam-client-tls:
      commonName: iam-caller
      usages: [client auth, digital signature]
      renewBefore: 756h
    task-client-tls:
      commonName: task-caller
      usages: [client auth, digital signature]
      renewBefore: 762h
    project-client-tls:
      commonName: project-caller
      usages: [client auth, digital signature]
      renewBefore: 780h

# ── THE EDGE LEAF, WHICH THIS CHART DOES NOT ISSUE ───────────────────────────
# A DIFFERENT AUTHORITY SIGNS THIS ONE, and that is the whole reason it sits
# behind its own toggle. The internal CA above is self-signed, ten years, pods
# only, and regenerates with the cluster. The authority that signs the edge is
# held outside the installation — this organisation's is a hand-minted
# ClusterIssuer whose key lives in 1Password (ADR-0580) — and an adopter names
# their own. The two are never conflated.
edgeTLS:
  create: false
  name: gateway-tls

  # NO DEFAULT, AND `required` REFUSES THE RENDER WITHOUT IT. There is no honest
  # default for somebody else's certificate authority: a guessed name renders an
  # object that never goes Ready, and the operator meets a pending Certificate
  # rather than a message naming the key they did not set. Both halves are
  # refused, because `kind` decides whether the name is looked up in this
  # namespace or cluster-wide.
  #
  #   edgeTLS:
  #     issuerRef:
  #       name: your-ca
  #       kind: ClusterIssuer
  issuerRef: {}

  # THE STARTING VALUE, NOT A CONSTANT — change it to the host your edge answers
  # on. It is a shipped default rather than a `required` because the plan this
  # chart is built from names `edgeTLS.issuerRef` as the one thing an adopter must
  # state, and because a stated choice somebody edits is how this estate ships
  # every other default (`yadgarhq/config`'s README states the same rule).
  commonName: gateway.yadgar.internal
  dnsNames:
    - gateway.yadgar.internal

  # 720h IS THE EDGE'S RUNG and it is held out of the map above, not missing from
  # it. Envoy Gateway reloads this leaf through xDS instead of restarting, so no
  # pod exits on its renewal — ADR-0588's structural ground for keeping it off the
  # ladder the internal leaves share while still leaving every value distinct.
  duration: 2160h
  renewBefore: 720h
  usages: [server auth]
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always

# ── THE EDGE LISTENER, AND THE ONE OPERATOR STRING BESIDE ITS CHECK ─────────
# THREE OBJECTS, ONE TOGGLE: the GatewayClass Envoy Gateway watches, the Gateway
# that terminates TLS on it, and the EnvoyProxy that says how the data plane it
# provisions is placed and exposed. They move together because none of the three
# is usable without the other two — a Gateway naming a class nobody created sits
# `Accepted=False` with no controller ever looking at it, which reads as a broken
# Gateway rather than a missing object.
#
# TWO API GROUPS, ONE RENDER CHECK, AND THAT IS DELIBERATE. The GatewayClass and
# the Gateway are `gateway.networking.k8s.io/v1` — the UPSTREAM Gateway API, which
# is a SPECIFICATION. Istio registers those CRDs, and so does every other
# implementation, so a check on that group is green on a cluster with no Envoy
# Gateway anywhere: it names a specification, not an operator, and could never be
# the refusal that names Envoy Gateway. The EnvoyProxy below is the object whose
# group no other implementation registers, so the one check this toggle carries
# targets THAT group and guards all three kinds.
gatewayListener:
  create: false

  # ── THE OPERATOR STRING, READ OFF THE OPERATOR AND RECORDED HERE ───────────
  # THE SAME DISCIPLINE THE mariadb PROBE'S MESSAGE SUBSTRING CARRIES, and for the
  # same reason: an operator upgrade that moved the group or the version turns the
  # check RED rather than silently weakening it. A string guessed from
  # documentation is a check that passes against a cluster it never understood.
  #
  # THREE PLAUSIBLE GROUPS ARE SERVED BY THE SAME CLUSTER AND ONLY ONE IS RIGHT:
  #
  #   gateway.envoyproxy.io/v1alpha1        Envoy Gateway's own API — THIS ONE
  #   gateway.networking.k8s.io/v1          the upstream Gateway API, a DIFFERENT
  #                                         project, registered by every
  #                                         implementation
  #   gateway.networking.x-k8s.io/v1alpha1  the upstream experimental channel
  #
  # A check written against either of the last two passes on a cluster carrying
  # the Gateway API CRDs with no Envoy Gateway installed at all, which is exactly
  # the adopter state the check exists to refuse.
  #
  # THE CHECK ITSELF PASSES THE STRING AS A LITERAL rather than reading this key,
  # because `scripts/tests/test_render_checks.py` reads the invocation's arguments
  # off the template to count and exercise the checks the chart declares, and a
  # values reference is not a string it can read. So the group lives in two files,
  # and `test_the_render_check_names_the_group_the_values_file_records` is the gate
  # that keeps them one source.
  envoyGateway:
    # MEASURED 2026-09-23 against kind-yadgar, running
    # docker.io/envoyproxy/gateway:v1.9.1.
    apiVersion: gateway.envoyproxy.io/v1alpha1
    operatorImage: docker.io/envoyproxy/gateway:v1.9.1

  # THE CLASS, AND THE CONTROLLER NAME IS NOT A CONVENTION TO GUESS AT. It is the
  # value Envoy Gateway's own chart carries as
  # `config.envoyGateway.gateway.controllerName`, taken from `helm show values` at
  # 1.9.1. A Gateway whose class names a controller nothing runs stays
  # `Accepted=False` forever.
  #
  # NO `parametersRef` ON THE CLASS, deliberately. Infrastructure configuration
  # attaches at the Gateway instead, which keeps the EnvoyProxy in the same
  # namespace as the Gateway that uses it — a cluster-scoped object reaching into
  # one namespace is easy to add and awkward to unpick.
  className: eg
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

  # THE EDGE ITSELF. ONE LISTENER, HTTPS ONLY, and no plaintext listener: a port-80
  # listener would exist only to redirect, and until something needs redirecting it
  # is a way to serve MCP over plaintext by accident.
  #
  # RENAMING THIS GATEWAY MOVES TWO ALLOW-LISTS AND NOTHING REFUSES THE MISMATCH.
  # Envoy Gateway DERIVES `gateway.envoyproxy.io/owning-gateway-name` and
  # `...-namespace` from this name and the release namespace, and stamps both onto
  # every data-plane pod it creates. The `gateway` chart's own ingress policy
  # selects those pods by those labels. Rename this and that allow-list matches no
  # pod: every external call times out while both pods stay Ready, the
  # EndpointSlice keeps both addresses, and nothing is logged.
  gatewayName: edge

  # WHAT THE EDGE ANSWERS ON. THREE PLACES MUST AGREE — this hostname, the
  # certificate's `dnsNames` under `edgeTLS` above, and any name constraint on the
  # authority that signs it — or verification fails AFTER signing succeeds, which
  # is a confusing place to find a typo.
  hostname: gateway.yadgar.internal

  # THE SECRET THE LISTENER TERMINATES ON, AND IT IS A SEPARATE KEY FROM
  # `edgeTLS.name` ON PURPOSE. An adopter may terminate on a Secret their own
  # tooling populates, with `edgeTLS.create` false and no Certificate in the render
  # at all — so the two cannot be one key. What keeps them in step when BOTH are on
  # is a gate rather than a template:
  # `test_the_listener_serves_the_secret_the_edge_certificate_writes`.
  #
  # Gateway API will not read a TLS Secret across namespaces without a
  # ReferenceGrant, so this Secret is the one the release namespace holds.
  certificateSecretName: gateway-tls

  # HOW THE PROVISIONED DATA PLANE IS PLACED AND EXPOSED. Envoy Gateway does not
  # run the data plane itself: it provisions a Deployment and a Service per
  # Gateway, and this object is the only way to influence either.
  envoyProxy:
    name: edge

    # `LoadBalancer`, WHICH IS THE ADOPTER'S CASE AND NOT THIS ORGANISATION'S.
    # This organisation's cluster is kind under rootless podman, where the host
    # cannot route to container IPs at all and `type: LoadBalancer` is unavailable
    # whatever provides it — so `yadgarhq/deploy` keeps its own NodePort 30443
    # copy with a StrategicMerge patch pinning that number, and this chart does
    # not try to express it. An adopter on a cluster with a load-balancer
    # controller wants the default; an adopter without one sets this to
    # `NodePort` and pins the port in their own values.
    serviceType: LoadBalancer

    # TWO, per the estate's invariant. A single proxy replica makes a class of
    # defect unreachable, and there is no reason for the edge to be the exception.
    replicas: 2

# ── THE ONE SHARED CACHE ─────────────────────────────────────────────────────
# ONE DEPLOYMENT, NO PERSISTENCE, NO REPLICAS, and each consumer using its own key
# namespace. NOTHING HERE SURVIVES LOSS BECAUSE NOTHING HERE NEEDS TO: compute
# caches are content-addressed, row caches key on a version and query caches on an
# epoch, so every entry recomputes. Losing this cache costs a cold start, not data
# — which is why it is a Deployment with no volume rather than a StatefulSet with
# a PVC.
#
# THE OFFICIAL IMAGE AND NOT A CHART, and that is a supply-chain measurement
# rather than a preference. The Bitnami chart was used first and removed: Bitnami
# restricted free image distribution in 2025, and verified 2026-08-30 with skopeo,
# `bitnami/valkey:9.1.1` and `:8.1` are NOT PULLABLE while `:latest` is the only
# tag that resolves. Pinning is not possible there, only unpinning. The official
# image pins cleanly, and one Deployment is all this needs.
valkey:
  create: false
  name: valkey

  # PINNED BY TAG RATHER THAN BY DIGEST, unlike the two Job images in this file,
  # and the difference is what the image does. A Job image here MINTS the estate's
  # root credentials, so a moving tag would leave that code as whatever the
  # registry last published. This one runs a cache whose whole content is
  # recomputable, and the upstream project's tags are immutable in practice. An
  # adopter with a mirrored registry moves it without forking the chart.
  image: valkey/valkey:9.1.1

  port: 6379

  # ── requirepass, AND IT IS ENFORCED BY THE SERVER ─────────────────────────
  # The password is the control that holds on EVERY CNI and every platform; the
  # ingress policy below is the second layer, not the first. Before this existed
  # anything on the pod network could read and rewrite every token bucket, epoch
  # counter and conversation token in here.
  #
  # THE SECRET IS MINTED BY THE BOOTSTRAP JOB, not by a human and not by this
  # chart's templates — `bootstrap.create` above renders the Job that creates it,
  # and neither Helm nor Argo tracks the result (ADR-0750). The name is a key here
  # because this Deployment and that Job are the two halves of one agreement, and
  # `test_the_valkey_deployment_mounts_the_secret_the_bootstrap_job_mints` is the
  # gate over it.
  #
  # `VALKEYCLI_AUTH` IS THE PROBE'S COPY, under the name `valkey-cli` itself reads.
  # Read off `valkey-cli --help` in this exact image rather than assumed from
  # Redis: the fork renamed it, and `REDISCLI_AUTH` is silently ignored.
  passwordSecret:
    name: valkey-password
    key: password

  # A CACHE THAT REFUSES WRITES WHEN FULL IS NOT A CACHE. Eviction is the correct
  # behaviour for every class of entry stored here, all of which are recomputable.
  maxmemory: 512mb
  maxmemoryPolicy: allkeys-lru

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 640Mi

# ── THE BROKER, WHICH THIS CHART DEPENDS ON RATHER THAN OWNS ────────────────
# THE ESTATE'S FIRST NON-YADGARHQ CHART DEPENDENCY. `Chart.yaml` declares `nats`
# from `https://nats-io.github.io/k8s/helm/charts` at 2.14.6 — the version
# `yadgarhq/deploy` runs today — behind `condition: nats.create`, so this key is
# read by helm itself and not by any template here. Without the condition a
# declared dependency renders UNCONDITIONALLY, and the parent's default render
# would grow by the whole NATS release on every install for every adopter.
#
# EVERYTHING BELOW `create` IS THE UPSTREAM CHART'S OWN VALUES, moved from
# `deploy/infra/nats.yaml` unchanged. This chart renders the `nats-ingress`
# NetworkPolicy itself, because that is this estate's object and not the upstream
# chart's, and nothing else here templates the broker.
#
# `<< >>` IS THE CHART'S ESCAPE, NOT NATS SYNTAX. The chart emits this config as
# JSON and quotes every scalar; a value wrapped in `<< >>` is emitted UNQUOTED,
# which is what makes `$NATS_PASSWORD` a variable the server expands rather than a
# literal fourteen-character password. Verified by rendering: the output is
# `"password": $NATS_PASSWORD`, with no quotes around it.
nats:
  create: false

  # nats-box is a shell with the NATS CLI in it — a debugging convenience, not
  # part of the system. `kubectl run` covers the same need on the rare occasion it
  # arises, without a pod running permanently to provide it.
  natsBox:
    enabled: false

  # ── AUTHENTICATION, AND EACH SERVICE GETS ITS OWN ACCOUNT ─────────────────
  # TWO ACCOUNTS: `iam` publishes the cache-invalidation events and `gateway`
  # subscribes to them. Add accounts rather than sharing one — a shared account
  # cannot have any single service's access revoked, and `gateway`'s permissions
  # could not be narrower than `iam`'s if the two shared a user.
  #
  # `gateway` IS SUBSCRIBE-ONLY and `publish: {deny: ">"}` closes every subject,
  # its own reply inbox included, on purpose: a compromised gateway cannot forge
  # the revocation it is supposed to be receiving. `iam` is the mirror —
  # publish-only on the same two subjects, with `subscribe: {deny: ">"}`.
  #
  # GETTING THIS LIST WRONG IS SILENT AT THE PUBLISHER. A permissions violation on
  # publish is an asynchronous `-ERR` from the server; the client call has already
  # returned `Ok(())` by then. So a subject dropped from this list does not fail a
  # revocation loudly — it makes every revocation late, with nothing in the
  # publisher's log to say so.
  #
  # THE MONITORING PORT IS UNAFFECTED: `config.monitor` serves plain HTTP on 8222
  # with no client authorization, so the chart's own startup, readiness and
  # liveness probes keep working. An authorization block that broke them would
  # take the broker down rather than secure it.
  config:
    merge:
      authorization:
        users:
          - user: iam
            password: << $NATS_PASSWORD >>
            permissions:
              publish:
                allow:
                  - "yadgar.iam.credential.revoked"
                  - "yadgar.iam.user.teams-changed"
              subscribe:
                deny: ">"
          - user: gateway
            password: << $NATS_PASSWORD_GATEWAY >>
            permissions:
              publish:
                deny: ">"
              subscribe:
                allow:
                  - "yadgar.iam.credential.revoked"
                  - "yadgar.iam.user.teams-changed"

  container:
    env:
      # A FILE WOULD BE BETTER AND THIS CHART OFFERS NO WAY TO ASK FOR ONE:
      # `container.env` is where it accepts a `secretKeyRef`, and the config above
      # references an environment variable by name. So the password is in this
      # container's environment. It is still out of git, out of this file and out
      # of any repository — and this pod is the one that legitimately holds the
      # credential, unlike its clients.
      #
      # BOTH SECRETS ARE MINTED BY THE BOOTSTRAP JOB, as the Valkey password is.
      # `nats-auth-gateway` is a SEPARATE Secret rather than a second key on
      # `nats-auth`: the Job's Role grants `create` alone, and a key added to an
      # existing created Secret is a `create` against a name that already exists —
      # the API server answers 409, the script reads that as "already done", and
      # the key would never materialise on a cluster that has already bootstrapped.
      NATS_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: nats-auth
            key: password
      NATS_PASSWORD_GATEWAY:
        valueFrom:
          secretKeyRef:
            name: nats-auth-gateway
            key: password

# ── THE OPERATORS, WHICH THIS CHART MAY INSTALL AND OWNS THE CRDS OF ────────
# ONE KEY GATES ALL FIVE (ADR-0787): cert-manager, KEDA, mariadb-operator, Envoy
# Gateway and Argo CD, each a `Chart.yaml` dependency rather than a fork. DEFAULT
# FALSE, and turning it on installs all five CLUSTER-WIDE from their own upstream
# charts — one instance per cluster, never one per namespace. With this false the
# platform-layer goal's prerequisite is unchanged: an adopter installs the five
# operators themselves, and the render checks above still refuse when one of
# them is absent.
#
# NO PER-OPERATOR SUB-KEY IS WRITTEN HERE, DELIBERATELY. `Chart.yaml`'s
# `condition:` for each dependency reads the per-operator path FIRST —
# `operators.<op>.create,operators.create` — and helm reads the FIRST VALID path
# in a comma-separated `condition:` and stops. An unset path is not a valid
# first path, so `operators.create` alone decides for every operator until an
# adopter states `operators.<op>.create` themselves. Writing one of the five in
# here, even as `false`, would make it a valid first path and take that operator
# out of `operators.create`'s control for every adopter who never asked to
# override it — the very mechanism this key exists to give would be the first
# thing it broke.
operators:
  create: false

# ── THE THREE SUBCHART CRD SETTINGS THE FIVE PINS REQUIRE ───────────────────
# Argo CD and Envoy Gateway need no override here: their CRDs are already
# protected at the defaults ADR-0787's census records. The other three each get
# a setting because the upstream default is wrong for this estate, not because
# it needs restating.
cert-manager:
  crds:
    # THE DEFAULT IS FALSE, measured against cert-manager v1.21.1's own
    # `values.yaml`. Left there, cert-manager installs with NO CRDs at all, and
    # every Certificate in the release then fails on a kind the API server has
    # never heard of.
    enabled: true

keda:
  crds:
    # `platform` WILL OWN THESE SIX (ADR-0787). Step 2 of
    # `plans/the-operators-toggle.md` vendors them into
    # `templates/vendored-crds/` carrying `helm.sh/resource-policy: keep`,
    # because upstream ships them with no such protection and `helm uninstall`
    # would otherwise delete them along with every ScaledObject in the cluster.
    # KEDA's own copies would collide with the vendored ones once they land, so
    # this chart's own installation of KEDA must not install them too.
    install: false

mariadb-operator:
  crds:
    # ALREADY THE DEFAULT — set explicitly because the upstream README's own
    # warning is what this false protects against: "This should only be set to
    # true during the initial deployment. If this chart manages the CRDs and is
    # later uninstalled, all MariaDB instances will be DELETED." Step 2 of
    # `plans/the-operators-toggle.md` will make `platform` own these twelve the
    # same way it will own KEDA's six, vendored with
    # `helm.sh/resource-policy: keep`. A default relied on silently is a default
    # nobody notices moving, so it is written down rather than left implicit.
    enabled: false

# ── THE BOOTSTRAP JOBS, AND THE SECRETS NOTHING OUTSIDE THE INSTALLATION CAN
#    SUPPLY ─────────────────────────────────────────────────────────────────
# ADR-0750: a secret with NO SOURCE OUTSIDE THE INSTALLATION is generated by an
# idempotent Job the chart renders, into a Secret that neither Helm nor Argo
# tracks. `valkey-password`, `nats-auth`, `nats-auth-gateway` and the
# administrative bootstrap token are all of that kind — their value is not a
# credential to some external system, it is created once and everything derives
# from it. Before this, a clone and an install against an empty cluster did not
# come up, because each of them was a step in a runbook somebody had to notice.
#
# THREE SECRETS AND A TOKEN ALWAYS, AND `iam-keys` AS AN OPT-IN FOURTH. This file
# used to say there was no `iamKeys` toggle and that adding one was the ordering
# ADR-0753 forbids. THE PROHIBITION IS LIFTED AND THE REASONING IS NOT WITHDRAWN.
# ADR-0753 never refused the fourth `create` outright — it ORDERED it behind a
# key-identity marker in the `iam` binary, in a change of its own, first. That
# marker has shipped: `iam` v0.8.43 records WHICH key set encrypted the rows and
# REFUSES TO KEEP RUNNING under a different one. So the failure the refusal
# existed to prevent — a cluster whose Secret is gone but whose database survived
# getting an `iam` that starts HEALTHY and cannot decrypt the rows it already has
# — is now a loud refusal instead of a silent one. The toggle below is that
# ordering satisfied, not that ordering ignored.
#
# WHY THE THREE NAMES ARE NOT KEYS HERE. They are read by the charts that MOUNT
# them, each of which names its Secret in its own values. A name configurable here
# and fixed there would be a knob that breaks the estate rather than one that
# adapts it. The admin token's name IS a key, because the parent chart has to make
# it agree with what the gateway mounts.
#
# WHAT AN ADOPTER WITH THEIR OWN SECRET MANAGER DOES. Leave `create` false, create
# the same four Secret names through Vault, External Secrets, SOPS or whatever
# else, and change no service: every consumer takes a FILE PATH and knows nothing
# about how the file arrived (D80). `iam-keys` is the fifth name on that list when
# `iamKeys.create` is on, and it is the one name an adopter most likely already
# holds somewhere else.
bootstrap:
  create: false

  # THE DATA-BEARING KEY, OFF BY DEFAULT AND OPT-IN ON PURPOSE (ADR-0750,
  # ADR-0753). Turn it on and the bootstrap Job mints a FOURTH Secret, `iam-keys`,
  # carrying the two key files `iam` reads at boot: `encryption.key` and
  # `blind-index.key`. Every stored name is AES-256-GCM ciphertext under the first,
  # and every username is found through an HMAC blind index under the second.
  #
  # IT DEFAULTS FALSE BECAUSE THE DEFAULT IS THE ANSWER FOR AN ESTATE THAT ALREADY
  # HAS THESE KEYS. This organisation mints them by hand, out of 1Password, in
  # `yadgarhq/deploy`'s `make secrets`, and a Job that minted a second pair beside
  # them would be the hazard rather than the convenience. An adopter installing
  # against an EMPTY database has no such pair and nothing to transcribe, which is
  # the case this toggle exists for.
  #
  # TURNING IT ON IS SAFE ONLY BECAUSE `iam` CAN NOW REFUSE A WRONG KEY, and that
  # refusal is a property of the BINARY rather than of this chart. `iam` v0.8.43
  # stores a fingerprint over both keys and refuses to keep running when the key
  # set it is given does not match the one the rows were written under.
  #
  # THE GAP THIS CHART DOES NOT CLOSE, STATED HERE RATHER THAN ONLY IN THE PLAN.
  # NOTHING TIES THIS TOGGLE TO AN `iam` THAT CARRIES THAT MARKER. An adopter who
  # sets this true while overriding `iam`'s tag BACKWARDS to a digest from before
  # v0.8.43 gets a Job-minted key and an `iam` with no marker check — which is
  # exactly the failure the marker exists to prevent, a service that starts healthy
  # and cannot decrypt its rows. It is mitigated rather than closed: the parent
  # chart pins every module together, so an adopter reaches this only by
  # deliberately overriding one module's tag backwards. The cheap fix is named so
  # nobody has to invent it — a `required`/`fail` beside this key tying it to a
  # minimum `iam` appVersion, refusing at render when the pinned `iam` is older
  # than the release that shipped the marker. It is filed, not built.
  #
  # THE SECRET'S NAME IS A LITERAL FOR THE SAME REASON THE OTHER THREE ARE. `iam`
  # mounts it under a name in its own values, so a name configurable here and fixed
  # there would be a knob that breaks the estate rather than one that adapts it.
  iamKeys:
    create: false

  # ONE IDENTITY FOR BOTH JOBS, with `create` on secrets and nothing else — see
  # `templates/bootstrap-rbac.yaml` for why a second one would narrow nothing.
  serviceAccountName: bootstrap-secrets

  # curl and a shell. A `kubectl` image is distroless with no shell and cannot run
  # a script at all, and the Kubernetes API is a REST API, so curl was always
  # sufficient. It is a VALUE rather than a literal so an adopter with a mirrored
  # registry can move it without forking the chart.
  #
  # PINNED BY DIGEST, NOT BY TAG, and this is the image in the estate where that
  # matters most: these two Jobs mint the three machine-only credentials and the
  # administrative bootstrap token, and nothing outside the installation can
  # supply any of them. A tag is a MOVING pointer — the same string resolves to
  # different bytes over time — so a tag here leaves the code that mints the
  # estate's root credentials as whatever the registry last published under that
  # name. The digest is the MANIFEST LIST's, deliberately: a per-architecture
  # digest pins one platform and leaves nodes of every other unable to pull.
  #
  # FOUR UNDECLARED DEMANDS THIS CHART MAKES OF WHATEVER THIS NAMES, written down
  # because no render and no lint can check any of them:
  #
  #   - a POSIX shell at `sh`, which is the container's `command`;
  #   - `curl`, which makes every request;
  #   - `base64`, which generates every credential. busybox provides it, and an
  #     image without it would mint EMPTY values were the length check in both
  #     scripts not there to stop the Job;
  #   - a nonroot user and group at UID/GID 100, which both Jobs name in
  #     `runAsUser` and `runAsGroup` under `runAsNonRoot: true`.
  #
  # The tag is kept beside the digest because a bare digest reads as nothing at a
  # glance. It is a COMMENT rather than the pin — changing it changes nothing.
  # curlimages/curl:8.16.0
  image: curlimages/curl@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6

  # Four attempts: a rescheduled pod and a briefly unreachable API server are
  # worth retrying, and a 403 is not — it does not become a 201 on the fourth try.
  backoffLimit: 4

  adminToken:
    # THE ONE SECRET NAME THAT IS A VALUE. The gateway mounts this Secret under a
    # name of its own (`gateway.adminBootstrap.tokenSecret`), and the parent chart
    # refuses an install where the two disagree — so a name hardcoded here would
    # leave the gateway mounting something nothing mints.
    #
    # AN OPERATOR READS THIS ONE OUT, unlike the other three. It is how the FIRST
    # administrator comes to exist on an estate that has none (ADR-0492), so the
    # export command is in `README.md` beside the install command and a gate
    # asserts it is there (ADR-0750 property 3).
    secretName: admin-bootstrap-token

# ── THE PREFLIGHT, WHICH PROVES A CONTROLLER RUNS ────────────────────────────
# THE RENDER CHECK AND THIS JOB ANSWER DIFFERENT QUESTIONS, and the estate needs
# both. `.Capabilities.APIVersions.Has` answers "is this API registered on the
# target"; it NEVER answers "is a controller running". A cluster carrying
# cert-manager's CRDs with no cert-manager pod renders, installs, and then hangs
# forever on Certificates that never go Ready, pods in `ContainerCreating` and
# nothing saying why. This Job probes each operator by an ACTION only that
# operator's controller performs, waits a bounded time, cleans up, and ASSERTS the
# number of operators it probed against the number of probes these values enable.
#
# TWO JOBS, ONE BLOCK, AND THE PHASE IS WHAT SEPARATES THEM. The PRE-INSTALL Job
# carries the probes whose objects exist before the install acts — cert-manager,
# KEDA and mariadb-operator. The POST-INSTALL Job carries Envoy Gateway alone,
# because a pre-install Envoy Gateway probe cannot go red: `Accepted=True` on a
# GatewayClass is a condition already persisted in etcd and stays there with the
# controller at zero replicas, and on a fresh install the class this chart renders
# does not exist yet anyway. Both Jobs read this one block, each has its OWN
# ServiceAccount, Role and RoleBinding, and `preflight.envoyGateway` below holds
# what belongs to the second one alone.
#
# `enabled` IS TRUE, AND IT IS THE ONE EXCEPTION TO THIS FILE'S DEFAULT-FALSE
# CONVENTION. It renders built-in kinds only — Jobs, ServiceAccounts, Roles and
# RoleBindings — so it costs the portability gate nothing, and a diagnostic that
# is off by default is the silent hang it exists to prevent.
#
# AND IT STILL RENDERS NOTHING AT THESE DEFAULTS. Every probe below is TIED to the
# toggle that renders what it probes, every one of those toggles is false here, so
# every probe resolves false — and when every probe resolves false NEITHER JOB
# RENDERS AT ALL. A Job reporting `probed 0 operators` is the "a check that cannot
# fail because it examined nothing" form this chart refuses to ship.
preflight:
  enabled: true

  # ITS OWN IDENTITY, NOT THE BOOTSTRAP TRIPLE'S. A different verb set on
  # different kinds: `create`, `get` and `delete` on the probe objects, where the
  # bootstrap Role carries `create` on secrets alone. One triple for both would be
  # the union of two permissions, held by both Jobs.
  #
  # THE POST-INSTALL JOB DOES NOT SHARE IT EITHER, for the same reason and on the
  # same terms: it holds `create`, `get` and `delete` on GATEWAYS and this one
  # holds none, so a shared identity would be the union again — the pre-install
  # Job gaining the ability to create a Gateway it never touches. Its name is
  # `preflight.envoyGateway.serviceAccountName` below.
  serviceAccountName: preflight

  # curl and a shell, pinned by digest, and NOT read from `bootstrap.image`. The
  # two toggles are independent — this Job renders with `bootstrap.create` false —
  # so a preflight reading the bootstrap's key would break the moment somebody
  # moved it.
  #
  # FOUR UNDECLARED DEMANDS THIS SCRIPT MAKES OF WHATEVER THIS NAMES, written down
  # because no render and no lint can check any of them:
  #
  #   - a POSIX shell at `sh`, which is the container's `command`;
  #   - `curl`, which makes every request;
  #   - `grep` and `sed`, which read the conditions off a response body. NOT
  #     `base64` — this Job generates no credential and mints nothing;
  #   - a nonroot user and group at UID/GID 100, named in `runAsUser` and
  #     `runAsGroup` under `runAsNonRoot: true`.
  #
  # The tag is kept beside the digest because a bare digest reads as nothing at a
  # glance. It is a COMMENT rather than the pin — changing it changes nothing.
  # curlimages/curl:8.16.0
  image: curlimages/curl@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6

  # AND BOTH PROBE JOBS OVERRIDE THIS IMAGE'S OWN `User-Agent`. The API server
  # pretty-prints for any client whose agent begins with `curl`, and `grep` above
  # is a LINE matcher over a body the scripts split on the literal `},{` — so the
  # default agent of the very image this key names is what made both probes fail
  # against a healthy cluster. Each template sets `USER_AGENT` and asks for
  # `pretty=false`, and records the measurement there. It is a LITERAL in the two
  # templates rather than a key here: its whole job is to NOT begin with `curl`
  # and to NOT contain `mozilla`, so a key would only be a weakening direction.

  # ZERO RETRIES, and that is the opposite of the bootstrap Jobs' four. A retry is
  # worth taking when the failure is transient and the work is idempotent; here the
  # failure is "the operator is not running", which does not become "it is running"
  # on the second attempt. Four attempts would only multiply the bound below by
  # four before the install is allowed to fail.
  backoffLimit: 0

  # HOW LONG EACH PROBE WAITS FOR ITS CONTROLLER, and how often it looks. A
  # CEILING RATHER THAN A MEASUREMENT: no measurement of a cold controller's first
  # reconcile on this estate exists, so this is chosen loose enough that a healthy
  # cluster never meets it and short enough that a dead one does not hang an
  # install.
  timeoutSeconds: 120
  pollSeconds: 3

  # THE FIXED NAMES THE PROBES CREATE UNDER. Fixed rather than random so a Job
  # killed between create and cleanup — a node eviction, an `OOMKilled` — leaks at
  # most ONE object of each name, and the next run deletes it rather than
  # colliding with it. The script deletes any object of these names and waits for
  # it to be gone BEFORE creating its own.
  probeName: preflight-probe

  # ── WHICH OPERATORS ARE PROBED, AND WHY NO KEY IS SET HERE ─────────────────
  # EVERY KEY UNDER `probes` IS DELIBERATELY UNSET, and the map is empty rather
  # than absent so a reader meets the decision. A probe's default is TIED to the
  # toggle that renders what it probes, and helm's `values.yaml` holds static YAML
  # — a default cannot read another key — so the tie lives in
  # `templates/_preflight.tpl` and an unset key is what lets it resolve.
  #
  #   probes.certManager   unset -> internalCA.create OR certificates.create OR
  #                                 edgeTLS.create
  #   probes.envoyGateway  unset -> gatewayListener.create, which renders the
  #                                 GatewayClass the probe Gateway binds to. This
  #                                 one enables the POST-INSTALL Job.
  #   probes.keda          unset -> FALSE. This chart renders no ScaledObject, and
  #                                 a subchart cannot read the module charts'
  #                                 `autoscaling.enabled`.
  #   probes.mariadb       unset -> FALSE. This chart renders no MariaDB CR, and a
  #                                 subchart cannot read the `-db` charts'
  #                                 `database.create`.
  #
  # THE TWO OVERRIDE DIRECTIONS ARE NOT SYMMETRIC. An explicit `false` is ALWAYS
  # honoured: losing a diagnostic is a choice an adopter is entitled to make, and
  # it cannot produce the failure the tie exists to prevent. An explicit `true`
  # splits. For `keda` and `mariadb` it is REQUIRED and it is the only way to
  # enable those probes at all. For `certManager` and `envoyGateway` it is REFUSED
  # when their own toggle is false, because a probe for an operator whose objects
  # this install renders none of proves nothing and can only fail for the wrong
  # reason — the refusal names both keys. `probes.envoyGateway: true` beside
  # `gatewayListener.create: false` is the case that forced the rule: the probe
  # Gateway would bind to a GatewayClass this install never made, the apply would
  # succeed and the hook would then fail, which is a clean install followed by a
  # failed release.
  #
  # AND THE UNSET TEST IS `hasKey`, NEVER SPRIG'S `default`. `default` treats
  # `false` AS EMPTY — it returns its fallback for `false` exactly as it does for
  # an absent key — so a `default` chain cannot tell an unset key from an explicit
  # `false` and the honoured-`false` direction silently would not exist.
  probes: {}

  # ── THE OPERATOR STRINGS, READ OFF THE OPERATORS AND RECORDED HERE ─────────
  # EACH STRING IS READ OFF THE OPERATOR AT THE VERSION THE ESTATE PINS AND
  # RECORDED BESIDE THE PROBE THAT USES IT, so an operator upgrade that moved a
  # group or reworded a message turns the probe RED rather than silently
  # weakening it. A string guessed from documentation is a probe that passes
  # against a cluster it never understood.
  certManager:
    # Read off cert-manager as the estate pins it.
    apiVersion: cert-manager.io/v1

  # ── THE POST-INSTALL PROBE, AND EVERYTHING THAT IS ITS ALONE ───────────────
  # ONE PROBE, ONE JOB, ON THE OTHER SIDE OF THE INSTALL. The Job this block
  # configures creates a FRESH Gateway bound to the class `gatewayListener`
  # renders, waits for Envoy Gateway to PROGRAM it, and deletes it. It is a
  # `post-install, post-upgrade` hook because a pre-install one could not work:
  # the class does not exist before the install, and `Accepted=True` on a
  # GatewayClass is a condition already persisted in etcd that stays there with
  # the controller at zero replicas.
  #
  # THE GROUP BELOW IS THE UPSTREAM GATEWAY API'S, NOT ENVOY GATEWAY'S, and the
  # difference is the trap this estate has already recorded once. A Gateway is
  # `gateway.networking.k8s.io/v1` — a SPECIFICATION every implementation
  # registers, Istio included — so this string names the API the probe POSTs to
  # and NOTHING about which operator answers. What names the operator is the
  # CLASS: `gatewayListener.className` is served by
  # `gatewayListener.controllerName`, which is Envoy Gateway's own. The render
  # check that refuses a cluster with no Envoy Gateway is the separate one on
  # `gateway.envoyproxy.io/v1alpha1`, recorded under `gatewayListener` above.
  #
  # WHY THE CONDITION NAME IS NOT A KEY HERE, AND WHY ITS MESSAGE IS. The two are
  # different kinds of thing, and this block holds one of each.
  #
  # WHICH CONDITION TO DEMAND IS A DESIGN DECISION, so the probe waits for
  # `Programmed` and the template carries that word as a LITERAL. `Accepted=True`
  # means the controller validated the Gateway against its class;
  # `Programmed=True` means the data plane for it exists, and a controller that
  # accepts and never programs is the half-dead case this probe is for. A key
  # would make the weaker condition a values edit nothing catches; as a literal,
  # weakening it is a template change
  # `test_the_probe_waits_for_programmed_and_never_for_accepted` refuses.
  #
  # THE MESSAGE TEXT IS AN OPERATOR STRING, so `programmedMessage` below is a key
  # and sits with the other operator strings this file records. It is not a choice
  # between two conditions; it is wording read off the operator, which an upgrade
  # can reword and a reader cannot guess. A literal would hide it in the template
  # where the strings it belongs beside are not. Its own weakening direction —
  # an EMPTY value, which `grep -F` matches against every line — is closed by
  # behaviour rather than by a literal: `test_the_probe_refuses_a_body_carrying_
  # only_the_listeners_programmed` runs the RENDERED matcher against a body and
  # requires a refusal, which an empty needle cannot produce.
  envoyGateway:
    # MEASURED 2026-09-24 against kind-yadgar, running
    # docker.io/envoyproxy/gateway:v1.9.1: `gateways.gateway.networking.k8s.io`
    # serves `v1` and `v1beta1`, and the live `edge` Gateway carries
    # `Programmed=True` with the message "Address assigned to the Gateway, 2/2
    # envoy replicas available". Recorded here so an upgrade that moved the
    # served version turns the probe RED rather than silently weakening it.
    apiVersion: gateway.networking.k8s.io/v1
    operatorImage: docker.io/envoyproxy/gateway:v1.9.1

    # ── THE MESSAGE THE OBJECT-LEVEL `Programmed` CARRIES ──────────────────
    # WHY A MESSAGE IS REQUIRED AT ALL, AND NOT `Programmed=True` ALONE. A
    # Gateway's status carries TWO conditions named `Programmed` — the OBJECT's,
    # which means an address was assigned and the proxy replicas are available,
    # and each LISTENER's, which means its configuration was translated and sent
    # to the data plane. Measured on kind-yadgar 2026-09-24: `Programmed` appears
    # FOUR times in one Gateway's status. The matcher greps the whole response, so
    # `Programmed=True` on its own is satisfied by EITHER.
    #
    # THAT IS NOT A HYPOTHETICAL SPLIT. `gatewayListener.envoyProxy.serviceType`
    # above defaults to `LoadBalancer`, and neither `example/values.yaml` nor the
    # parent chart's adopter values restate it. On a cluster with no
    # load-balancer controller no address is ever assigned, so the OBJECT's
    # `Programmed` goes False with reason `AddressNotAssigned` — and the probe
    # inherits that same EnvoyProxy, so it inherits that same failure. A probe
    # keyed on `Programmed=True` alone would then report SUCCESS off the
    # listener's condition while the real `edge` Gateway stalls, which is the
    # diagnostic failing to fire on exactly the cluster it was installed for.
    #
    # THE PREFIX ONLY, NEVER THE `2/2 replicas` TAIL, which varies with the
    # replica count and would make this string a second place the count is
    # written. This is the same rule `mariadb.validationMessage` follows: require
    # the operator's OWN wording, so an upgrade that rewords it turns the probe
    # RED rather than silently weakening it.
    #
    # STIPULATED, NOT MEASURED, and stated as such: that v1.9.1 sets the
    # LISTENER's `Programmed=True` while address assignment fails is the reading
    # this key is aimed at, and it was not reproduced — doing so needs a Gateway
    # created on a cluster with no load-balancer controller, which no read-only
    # observation can stand in for.
    programmedMessage: Address assigned to the Gateway

    # ITS OWN IDENTITY, NOT THE PRE-INSTALL PREFLIGHT'S. `create`, `get` and
    # `delete` on GATEWAYS, where that Role holds none — sharing one would give
    # each Job the other's permission.
    serviceAccountName: envoy-gateway-probe

    # THE FIXED NAME THE PROBE GATEWAY IS CREATED UNDER. Fixed rather than random
    # so a Job killed between create and cleanup leaks at most ONE Gateway, and
    # the next run deletes it rather than colliding with it. A Gateway is not
    # inert — it is provisioned proxy infrastructure — which is why the script
    # deletes any object of this name and waits for it to be gone BEFORE creating
    # its own.
    probeName: envoy-gateway-probe

    # ITS OWN BOUND, AND NOT `preflight.timeoutSeconds`. A CEILING RATHER THAN A
    # MEASUREMENT, chosen loose: programming a Gateway provisions a Deployment
    # and a Service and waits for replicas to become available, which is a
    # different wait from a cert-manager reconcile, and no measurement of a cold
    # one on this estate exists. `preflight.pollSeconds` is shared, because how
    # often a status is read has nothing to do with which status it is.
    #
    # THIS BOUND AND HELM'S `--timeout` ARE ONE CONSTRAINT WITH TWO KNOBS, and a
    # Job whose bound outlives helm's patience reports nothing. Measured on both
    # pins — helm 3.18.4 and 4.3.0 — `--timeout` defaults to `5m0s` and is
    # documented as "time to wait for any individual Kubernetes operation (like
    # Jobs for hooks)". Helm's clock starts when the hook Job is CREATED, so it
    # covers pod scheduling and image pull before this script's own clock starts.
    #
    # AND THE SCRIPT'S WORST CASE IS TWICE THIS NUMBER, not once. `create()` calls
    # `remove()` first, and `remove()` loops to this same bound before `await()`
    # begins its own — so two bounded loops compose, plus the request time of the
    # calls themselves, which no value here bounds.
    #
    # SO THE INSTALL MUST BE GIVEN A BUDGET, and `README.md` and
    # `example/values.yaml` both state it. At 300 here the composed bound is 600s,
    # and the documented `--timeout 15m` leaves 300s over it for scheduling, image
    # pull and request time — a stated CEILING, not a measurement, because this
    # estate has measured none of the three. The number is NOT lowered instead:
    # `Programmed` includes replica availability, so a cold cluster may genuinely
    # need this long, and a bound cut to fit helm's default would reintroduce
    # red-on-healthy. `test_the_documented_install_budget_covers_the_probes_bound`
    # is what keeps the two from diverging in silence.
    timeoutSeconds: 300

  keda:
    # Read off KEDA as the estate pins it.
    apiVersion: keda.sh/v1alpha1

  mariadb:
    # MEASURED 2026-09-23 against kind-yadgar, running
    # ghcr.io/mariadb-operator/mariadb-operator:26.6.0.
    apiVersion: k8s.mariadb.com/v1alpha1
    operatorImage: ghcr.io/mariadb-operator/mariadb-operator:26.6.0

    # WHY THIS PROBE SUBMITS AN INVALID OBJECT RATHER THAN A VALID ONE. A probe
    # MariaDB instance is a StatefulSet with a volume, which is far too heavy for
    # a preflight. So the probe submits a CR that is invalid in a way the
    # operator's OWN validation names, as a server-side dry run, and requires the
    # rejection to be the operator's.
    #
    # A REJECTION ALONE CANNOT DISCRIMINATE, which is the whole reason three
    # strings live here instead of one. With the operator at zero replicas and
    # `failurePolicy: Fail`, the API SERVER also rejects the request — it cannot
    # reach the webhook — so the healthy cluster and the dead one both answer with
    # a non-2xx and a probe requiring "a rejection" reads green on both.

    # THE REFUSAL THAT PROVES THE OPERATOR'S ADMISSION PATH IS LIVE. Measured:
    #
    #   admission webhook "vmariadb-v1alpha1.kb.io" denied the request:
    #     spec.storage: Invalid value: {}: either storage size or
    #     volumeClaimTemplate must be provided
    #
    # AND THE WEBHOOK'S NAME IS NOT IN THE VALUE, for two reasons that agree.
    #
    # IT COULD NOT MATCH. The lines above are how `kubectl` PRINTS that message,
    # and that is not what is on the wire. The API server builds the prefix with
    # `%q` and puts the result in `metav1.Status.Message`, which is a JSON string,
    # so every `"` reaches `curl` as `\"`. This probe greps the RAW body, and
    # `grep -F` for a literal `"` cannot match `\"`. A value carrying the quoted
    # name therefore misses on a HEALTHY cluster: the Job exits 1, `backoffLimit:
    # 0` forbids a retry, and the `pre-install` hook aborts the install naming a
    # string comparison — which is the fail-for-the-wrong-reason class this whole
    # probe exists to prevent. That value shipped once.
    # `test_every_mariadb_string_can_match_an_api_server_body` is the gate that
    # would have caught it, and it checks each string against a body built the way
    # the API server builds one rather than against the script.
    #
    # AND IT CARRIES NOTHING ANYWAY. `denied the request` is the load-bearing
    # half: the API server's own unreachable-webhook message ALSO names
    # `vmariadb-v1alpha1.kb.io`, so the name alone discriminates nothing.
    #
    # WHAT DISCRIMINATES IS THE ORDER. `denied the request` on its own would also
    # match a refusal from some other webhook, and it never sees one, because the
    # unreachable reading is checked FIRST and the validation reading follows.
    # That ordering is load-bearing for this value's correctness rather than only
    # for the message a failure prints, and
    # `test_the_mariadb_arms_read_the_unreachable_webhook_first` asserts it.
    deniedBy: denied the request

    # THE OPERATOR'S OWN VALIDATION TEXT, AND NOT THE CRD SCHEMA'S. A second
    # refusal exists at this version — `An odd number of MariaDB instances
    # (mariadb.spec.replicas) is required` — and it comes from CRD SCHEMA
    # validation, which the API server performs with no operator running at all.
    # Keying the probe on that one would pass on exactly the cluster this probe
    # exists to catch: the CRDs applied, the operator absent or crash-looping.
    validationMessage: either storage size or volumeClaimTemplate must be provided

    # THE FAILURE THE PROBE NAMES EXPLICITLY, rather than letting it fall out of
    # the two readings above. A rejection carrying this is the API server saying
    # it could not reach the webhook, which is the operator being ABSENT — and a
    # probe that reported it as "the message did not match" would name a string
    # comparison where the answer is "mariadb-operator is not running".
    unreachableWebhook: failed calling webhook
