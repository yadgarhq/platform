{{/*
EVERY RENDER CHECK THIS CHART DECLARES, IN ONE FILE, AND THE FILE RENDERS NOTHING.

TWO KINDS OF CHECK LIVE HERE. A CAPABILITY check reads
`.Capabilities.APIVersions.Has` through `platform.require-api` and refuses when the
target does not carry an API group this render needs. A VALUES check reads the
release's own values and nothing else. TWENTY-SEVEN of the second kind live below — the
two arms of the `operators` shape refusal, two branches each of the two register-key
arms, the per-operator create arm, the `prometheus.forceNamespace` arm, then the
mixed-release refusal and the type arm of its toggle list, then the two NATS/valkey
TLS arms, the two NATS contract arms, the three broker credential-rotation arms
(ADR-0924), the broker merge-key arm (yaadgaar 169), the unquoted-values arm
(yaadgaar 546), the object merge arm (yaadgaar 553), the patch arm (yaadgaar 544,
545), the leaf usages arm (yaadgaar 279), and last the one-line values arm,
the whole-number arm (yaadgaar 541),
the edge usages arm and the rendered certificates arm (yaadgaar 534; the last
reads the rendered Certificates rather than values) — and everything that makes a capability
check awkward — `--api-versions`, the offline-render rule, the default-false rule —
does not apply to any of them. Their red and green cases are BARE renders, and that
is the design rather than an omission. `scripts/tests/test_render_checks.py` owns
the mixed-release pair and the count of all twenty-seven;
`scripts/tests/test_operators_shape.py` owns what the shape and register arms do;
`scripts/tests/test_force_namespace.py` owns what the forceNamespace arm does;
`scripts/tests/test_nats_valkey_tls.py` owns what the four TLS arms do.
`scripts/tests/test_certificate_usages.py` owns what the leaf usages arm and the
three yaadgaar 534 arms do. `scripts/tests/test_nats_merge_keys.py` and
`scripts/tests/test_nats_unquoted_values.py` own the yaadgaar 169 and 546 arms;
`scripts/tests/test_nats_merge_routes.py` and `scripts/tests/test_nats_patch_paths.py`
own the yaadgaar 553 and 544/545 arms.

ONE CHECK PER OPERATOR, NOT ONE PER KIND. The self-signed Issuer, the CA
Certificate, the CA Issuer, the thirteen internal leaves and the edge leaf all come from
`cert-manager.io/v1`, and one operator provides that whole group — so they share a
check. The Gateway listener is the same shape one level along: it renders three
kinds from TWO groups behind ONE toggle, and carries ONE check.
`scripts/tests/test_render_checks.py` counts the checks DECLARED here and asserts
that number, so a check deleted from this file reddens the suite on the count
rather than letting it quietly exercise one fewer.

THE FILENAME DOES NOT BEGIN WITH AN UNDERSCORE, AND THAT IS LOAD-BEARING. helm
treats `templates/_*` as partials and never renders them, so a `fail` that lived
only in `_require_api.tpl` would never fire. The definition is a partial; the
CALL has to sit in a rendered template. Do not tidy the two into one file.

THE CONDITION IS THE OR OF EVERY TOGGLE THAT RENDERS A `cert-manager.io/v1`
OBJECT. Each of the three defaults false, so a render that asks for nothing is
never refused for a cluster it was never going to touch.
*/}}

{{/*
AN `operators` KEY NOTHING CAN READ, REFUSED BY NAME — IN TWO ARMS, BECAUSE THE
TWO CASES ARE VISIBLE FROM DIFFERENT PLACES (ADR-0794).

WHAT AN ADOPTER WRITES. `operators: true` is what somebody writes who thinks the
toggle IS the block rather than a key inside it; `operators: false` is what
somebody writes who read "default false" and wanted to be explicit; and a bare
`operators:` with nothing under it is YAML `null`. Before this refusal existed
the first two got a Go stack trace out of whichever of the nineteen sites
reading the key helm reached first — `templates/vendored-crds/` renders before
this file, because helm executes the deepest template path first.

AND NONE OF THESE SHAPES IS MERELY UNREADABLE. THEY ARE DANGEROUS, and in the
one direction nobody expects. Each of the five operators is declared
`condition: operators.<op>.create,operators.create`, and HELM LEAVES A DEPENDENCY
ENABLED WHEN NO PATH OF A MULTI-PATH `condition:` RESOLVES — measured, not read.
So a value in any of these shapes does NOT turn the operators off: it installs
all of them. Since ADR-0873 (ledger 1337) `templates/_operators.tpl` reads a
present non-map block as ON too, so the CRDs this chart vendored follow the
operators in; before it, the helper skipped them and KEDA went in with none of
its own CRDs at exit 0. The CRDs no longer depend on these arms. The arms stay
because an adopter who wrote `operators: false` still gets the operators, and
going quiet would turn that loud failure into the silent one ADR-0794 forbids.

THE TEST IS `kindIs "map"` ON THE RAW VALUE, NEVER ON THE RESULT OF A `default`.
Sprig's `default` substitutes only on an EMPTY value, so `default dict false` is
`dict` and a kind test after it permits `false`, `0`, `""`, `[]` and an absent
key — five of the eight shapes, and the five most likely to be written.

── ARM ONE: AN ABSENT KEY, REFUSED WHEREVER THIS CHART RUNS ────────────────────

`hasKey` COMES FIRST AND DRIVES THE BRANCH, because `kindOf` answers `invalid`
for an absent key and for an explicit `null` alike and cannot tell them apart.
ADR-0794 prefers `hasKey` for that reason; here it is load-bearing for a case
that ADR did not anticipate.

AN ABSENT `operators` IS UNAMBIGUOUS HERE, and that is what makes this arm
unconditional. `chart/values.yaml` SHIPS `operators.create: false`, so the key is
present in every render this chart was given as written. Helm deletes a key whose
value is null — and it deletes it WITHOUT putting the chart's own default back —
so the key can only be missing because somebody wrote `operators: null`, or wrote
`operators:` with nothing under it.

AND THIS ARM IS THE ONLY THING IN THE ESTATE THAT CAN SEE THAT CASE. Measured
2026-09-26 on helm v4.3.0, `platform.operators: null` against `yadgarhq/chart`:

  platform.operators omitted   -> 32 objects, 0 from the operator subcharts
  platform.operators {create: false} -> 32 objects, 0 from the operator subcharts
  platform.operators null      -> 197 objects, 165 FROM THE OPERATOR SUBCHARTS,
                                  0 vendored CRDs, EXIT 0
  platform.operators {create: true}  -> exit 1, the parent refuses the path

The parent cannot refuse the third row. Helm resolves a dependency's `condition:`
against the RAW user values, where the key is null, so the five operators go in;
by the time any template runs the key has been deleted, and the parent measures
`hasKey` FALSE — indistinguishable from an adopter who never wrote the key at
all, which is every other adopter. The information exists only here, in the one
chart whose own defaults guarantee the key. So this arm refuses regardless of
whether this chart is the root or a subchart: deferring it defers to nobody.

── ARM TWO: A PRESENT NON-MAP, REFUSED ONLY WHEN THIS CHART IS THE ROOT ────────

`yadgarhq/chart` pins this chart and carries its own refusal for this case, in
`chart/templates/_validate.tpl`, naming the path the adopter actually typed:
`platform.operators`. It CAN see a present non-map — `true`, `false`, `0`, `""`,
`[]` and `[a]` all survive coalescing — so the diagnosis belongs there.

AND THE SUBCHART'S MESSAGE ALWAYS WINS, which is why this arm must stand down —
measured on helm v3.20.2 and v4.3.0, 2026-09-26: when a subchart and its parent
both abort, helm executes the deepest template path first, so a parent `fail` can
never pre-empt a child's. Refusing here unconditionally would make that parent
clause dead code AND make its own test pass against THIS message, which is a gate
that would stay green with the thing it tests deleted. ADR-0794's own rejected
alternatives put it directly: the child's guard "puts the diagnosis in the wrong
chart".

A STANDALONE `helm install platform` STILL GETS A KEY NAME rather than a stack
trace, which is what this arm is for.

`.Template.BasePath` IS THE DISCRIMINATOR AND IT IS MEASURED ON BOTH PINS. As
the root chart it is `platform/templates`; under a parent it is
`<parent>/charts/platform/templates`. `contains "/charts/"` separates the two,
identically on helm v3.20.2 and v4.3.0.

THE RESIDUAL, STATED RATHER THAN HIDDEN: a parent that pins this chart and
carries NO refusal of its own gets the silent fail-open for the six present
non-map shapes — and, since the register arms below stand down as a subchart
too, for every present non-bool `operators.create` and `nats.create` as well.
For the `operators` shapes the operators go in WITH their vendored CRDs and the
prometheus Namespace since ADR-0873; what stays silent is that they go in at all.
Beside estate toggles, such a parent now installs the operators and the estate in
one release, with the CRDs: the mixed-release guard counts only a mapping
`operators`, so it does not refuse that case.
`yadgarhq/chart` is the only parent this estate ships and it carries refusals for
both ranges. `test_a_parent_with_no_refusal_is_the_residual_this_chart_documents`
measures the whole hole rather than asserting it away, and it carries a row from
each range so widening the code without widening that test goes red.

BOTH ARMS ARE DECLARED FIRST, BEFORE THE MIXED-RELEASE REFUSAL AND BEFORE THE
CAPABILITY CHECKS, and the order is load-bearing for the same reason theirs is:
`fail` aborts at the FIRST failing check, and a shape these arms name also
reaches the ones below them.
*/}}
{{- if not (hasKey .Values "operators") }}
{{- fail (join "" (list
      "platform: the operators key has been deleted from this release's values, and this chart ships it. "
      "`operators: null` — or a bare `operators:` with nothing under it — makes helm REMOVE the key rather than "
      "read it, and the chart's own `operators.create: false` goes with it. "
      "Each of the five operators is a dependency declared `condition: operators.<name>.create,operators.create`, "
      "and helm leaves a dependency ENABLED when no path of a multi-path condition resolves — so this does not "
      "turn the operators off, it installs all of them, along with every CustomResourceDefinition this chart "
      "vendored for them. "
      "Write `operators:` as a mapping: `create: false` to leave the operators out, `create: true` to install them "
      "in a release of their own (ADR-0787). To accept the chart's default, omit the key entirely.")) }}
{{- else if not (contains "/charts/" .Template.BasePath) }}
{{- if not (kindIs "map" .Values.operators) }}
{{- fail (printf (join "" (list
      "platform: operators is a %s rather than a mapping, so no operator key can be read out of it. "
      "Each of the five operators is a dependency declared `condition: operators.<name>.create,operators.create`, "
      "and helm leaves a dependency ENABLED when no path of a multi-path condition resolves — "
      "so a value in this shape does not turn the operators off, it installs all of them, along with every "
      "CustomResourceDefinition this chart vendored for them. "
      "Write `operators:` as a mapping: `create: false` to leave the operators out, `create: true` to install them "
      "in a release of their own (ADR-0787)."))
      (kindOf .Values.operators)) }}
{{- end }}
{{- end }}{{/* end of the two operators-shape arms */}}

{{/*
THE REGISTER KEYS THEMSELVES, ONE LEVEL DOWN — AND THE TWO ARMS ABOVE STOPPED
ONE LEVEL TOO HIGH (ADR-0794, WIDENED).

THE ARMS ABOVE REFUSE EIGHT SHAPES OF THE `operators` BLOCK. Not one of them is
a shape of the key helm's `condition:` actually reads. `operators` written as a
MAPPING, with `create` unusable inside it, walked through both of them at exit 0
and installed all five operators cluster-wide. MEASURED against `yadgarhq/chart`
at 5d23f59 with `platform` 0.1.11, on helm v3.20.2 and v4.3.0 alike, 2026-09-26:

  platform.operators.create: false   ->  32 objects,   0 from the operator subcharts
  platform.operators.create: <null>  -> 197 objects, 165 FROM THE OPERATOR SUBCHARTS,
                                        0 vendored CRDs, EXIT 0, NO WARNING

NINE OF THE TEN VALUES AN ADOPTER CAN WRITE INSTALL ALL FIVE, which is why the
shape test is `kindIs "bool"` and not merely `hasKey`. `create: {}` is a PRESENT
key that installs everything, and helm does not warn about it; `create: "no"` —
which reads as OFF to a human — installs everything too, because sprig's `dig`
finds a non-empty string and calls it true. `hasKey` is what SPLITS the two arms
below, because a deleted key and an explicit `null` both answer `invalid` to
`kindOf` and cannot be told apart by the value (ADR-0794's own rule about the
two).

PATH COUNT IS NOT WHAT PUTS A KEY IN THIS CLASS, and that correction is the
reason this block covers `nats` as well as `operators`. ADR-0794 reasons about
the MULTI-path `condition:` the five operators carry. `nats` carries a SINGLE
path, `condition: nats.create`, and fails open in the same direction for the
same reason: helm leaves a dependency ENABLED when the path its condition names
does not resolve, and it does not care how many paths were on offer. THE CLASS
IS: a key any `condition:` reads, that some chart in the tree DECLARES — because
helm deletes a null on a declared key without putting the default back, and
leaves an undeclared one present and unreadable.
`test_every_condition_path_in_chart_yaml_has_a_guarded_register_key` reads the
conditions off `Chart.yaml` rather than trusting this paragraph, so a seventh
dependency arrives with its register key guarded or reddens the suite.

THE SPLIT BETWEEN THE TWO BRANCHES IS THE PARENT'S MEASURED COVERAGE, NOT A
GUESS, and it is the same division of labour arms one and two already draw.
Measured against `yadgarhq/chart` at 5d23f59 with `platform` 0.1.11 — that is,
against the parent standing ALONE, before these arms existed — on helm v4.3.0:

  platform.operators.create: "true" / "yes" / "no" / 0 / 1 / [] / "" / {}
                                  -> EXIT 1, the PARENT refuses, naming the key
                                     and `rather than a boolean`
  platform.operators.create: <null> -> EXIT 0, 197 objects, 165 from the subcharts
  platform.nats.create: "yes" / 0 / {}  -> EXIT 1, the PARENT refuses
  platform.nats.create: <null>    -> EXIT 0, the broker in, nats-ingress in (was: none, until yaadgaar 359)
  platform.nats: <null>           -> EXIT 0, the broker in on upstream defaults

SO THE PRESENT-NON-BOOL BRANCH IS ROOT-ONLY, for arm two's reason exactly: the
parent already refuses every one of those shapes, by a message that names the
path the adopter actually typed, and a subchart `fail` would SHADOW it — helm
executes the deepest template path first, so a parent `fail` can never pre-empt a
child's. Refusing here unconditionally would make `yadgarhq/chart`'s own clause
dead code and make its test pass against THIS message.
`test_the_parent_is_the_one_that_names_a_non_bool_register_key` is the gate.

AND IT TAKES ARM TWO'S RESIDUAL WITH IT, WIDENED. A third-party parent carrying
no refusal of its own now gets the silent fail-open for these shapes as well as
for arm two's six, which is stated here and measured there rather than left for
the next reader to work out from the branch condition.
THE BROKER'S HALF OF THAT RESIDUAL IS CLOSED (yaadgaar 359): `ingress-policies.yaml`
reads `nats.create` off only on the bool `false`, as helm does, so a present non-bool
under a bare parent still gets the broker AND its nats-ingress policy.
`test_a_non_bool_broker_switch_under_a_bare_parent_keeps_the_policy` is the gate.

AND THE DELETED BRANCH IS UNCONDITIONAL, because the parent is STRUCTURALLY blind
to it. Not blind in arm one's way — a parent probe reads `hasKey
$platform.operators "create"` FALSE for this shape and TRUE for `operators: {}`,
for the key omitted and for a per-operator sub-key, so the information is there.
It is that the parent's own guard ranges over `create` toggles it can FIND, and a
deleted key is not one. The three rows above at EXIT 0 are that hole measured.
`yadgarhq/chart`'s own row for these shapes asserts that THIS message is the one
that arrives, so the two repositories cannot drift into both refusing without a
test going red.

THE SUB-KEYS ARE NOT IN THIS ARM'S CLASS: `values.yaml` declares no
`operators.<op>`, so helm does not delete a null written there. They get the
per-operator create arm below (ledger 1252).

A PRESENT NON-MAP `nats` NEEDS NO ARM, MEASURED: `nats: true` and `nats: []` are
refused by HELM ITSELF, `type mismatch on nats`, before any template runs. The
`operators` block has no subchart of its own to be coalesced against, which is
why it gets no such protection and needs arms one and two.
*/}}
{{- if kindIs "map" .Values.operators }}
{{- if not (hasKey .Values.operators "create") }}
{{- fail (join "" (list
      "platform: operators.create has been deleted from this release's values, and this chart ships it. "
      "Writing `create:` with nothing after it — or `create: null` — makes helm REMOVE the key rather than "
      "read it, and the chart's own `operators.create: false` is not put back. "
      "Each of the five operators is a dependency declared `condition: operators.<name>.create,operators.create`, "
      "and helm leaves a dependency ENABLED when no path of a condition resolves — so this does not turn the "
      "operators off, it installs cert-manager, KEDA, mariadb-operator, Envoy Gateway and Argo CD CLUSTER-WIDE, "
      "along with every CustomResourceDefinition this chart vendored for them. "
      "Write `operators.create: false` to leave the operators out, or `operators.create: true` to install them "
      "in a release of their own (ADR-0787). To accept the chart's default, omit the key entirely.")) }}
{{- else if not (contains "/charts/" .Template.BasePath) }}
{{- if not (kindIs "bool" (index .Values.operators "create")) }}
{{- fail (printf (join "" (list
      "platform: operators.create is a %s rather than true or false, which is not a value helm can resolve a "
      "dependency condition from. "
      "Each of the five operators is a dependency declared `condition: operators.<name>.create,operators.create`, "
      "and helm leaves a dependency ENABLED when no path of a condition resolves — so a value in this shape does "
      "not turn the operators off, it installs cert-manager, KEDA, mariadb-operator, Envoy Gateway and Argo CD "
      "CLUSTER-WIDE, along with every CustomResourceDefinition this chart vendored for them. "
      "Write `operators.create: false` to leave the operators out, or `operators.create: true` to install them "
      "in a release of their own (ADR-0787)."))
      (kindOf (index .Values.operators "create"))) }}
{{- end }}
{{- end }}
{{- end }}{{/* end of the operators register-key arm */}}

{{/*
THE PER-OPERATOR SUB-KEY, REFUSED WHEN IT IS PRESENT AND NOT A BOOL (ledger 1252).

Each operator is declared `condition: operators.<op>.create,operators.create`.
helm uses the FIRST path that holds a bool and SKIPS any other — so
`keda: {create: "false"}` does not turn KEDA off, it hands the decision to
`operators.create`, which is never what somebody who typed the sub-key meant.
`templates/_operators.tpl` now resolves the sub-key exactly as helm does, so the
vendored CRDs follow the operator either way; this arm makes the typo LOUD.
MEASURED on helm v4.3.0, 2026-10-03, before the helper changed:

  operators: {create: false, keda: {create: "false"}}  -> EXIT 0, 6 vendored
                                                          KEDA CRDs, no KEDA

`create: null` IS A PRESENT KEY HERE, unlike the register key's: `values.yaml`
declares no per-operator sub-key, so helm leaves the null in place and `kindOf`
reads `invalid`, printed as `null`. A sub-block that is null, a scalar, or a
map with no `create` is NOT refused: helm's condition cannot read a path there,
falls through to the register key, and the helper does the same.

ROOT ONLY, for the register arms' reason: helm executes the subchart's templates
first, so a refusal here would shadow any parent that names the key itself, and
under a parent the helper already matches helm.

THE LIST IS A LITERAL, AND IT IS GATED AGAINST `Chart.yaml`. `.Chart.Dependencies`
cannot stand in for it, measured on helm v4.3.0: helm DROPS a disabled dependency
from that list before any template runs, so with `operators.create: false` the
very operator whose sub-key is mistyped is the one missing from it.
`test_the_sub_key_arm_ranges_over_every_two_path_operator` compares this list
with the conditions `Chart.yaml` declares, and
`test_a_non_bool_sub_key_is_refused_at_the_root_by_name` is what it does. The
variable is not `$operator`, so the mixed-release guard's own list stays the
first `range $operator` in this file, which `test_render_checks.py` reads.
*/}}
{{- if and (kindIs "map" .Values.operators) (not (contains "/charts/" .Template.BasePath)) }}
{{- range $subKeyOperator := (list "argoCd" "certManager" "envoyGateway" "keda" "mariadbOperator" "prometheus") }}
{{- $block := index $.Values.operators $subKeyOperator }}
{{- if and (kindIs "map" $block) (hasKey $block "create") (not (kindIs "bool" (index $block "create"))) }}
{{- $kind := kindOf (index $block "create") }}
{{- if eq $kind "invalid" }}{{ $kind = "null" }}{{ end }}
{{- fail (printf (join "" (list
      "platform: operators.%s.create is a %s rather than true or false. "
      "Its dependency is declared `condition: operators.%s.create,operators.create`, and helm uses the first "
      "path that holds a bool — so helm skips it and operators.create decides whether that operator is "
      "installed, which is not what a value written here means. "
      "Write `operators.%s.create: true` or `false`, unquoted, or delete the key to let `operators.create` decide."))
      $subKeyOperator $kind $subKeyOperator $subKeyOperator) }}
{{- end }}
{{- end }}
{{- end }}{{/* end of the per-operator create arm */}}

{{- if kindIs "map" .Values.nats }}
{{- if not (hasKey .Values.nats "create") }}
{{- fail (join "" (list
      "platform: nats.create has been deleted from this release's values, and this chart ships it. "
      "Writing `nats:` with nothing under it — or `nats: null` — makes helm REMOVE THE WHOLE BLOCK rather than "
      "read it, and this chart's `nats.create: false`, its authorization users and every other broker setting "
      "beside them go with it. "
      "The broker is a dependency declared `condition: nats.create`, and helm leaves a dependency ENABLED when "
      "the path its condition names does not resolve — so this does not turn the broker off, it installs one on "
      "the upstream chart's OWN defaults, with none of the settings above and with no nats-ingress "
      "NetworkPolicy in front of it. "
      "Write `nats.create: false` to leave the broker out, or `nats.create: true` to install it. "
      "To accept the chart's default, omit the key entirely.")) }}
{{- else if not (contains "/charts/" .Template.BasePath) }}
{{- if not (kindIs "bool" (index .Values.nats "create")) }}
{{- /* `kindOf` answers Go's `invalid` for a nil; the adopter wrote `null`, and the
sibling arms already say so (yaadgaar 369). */ -}}
{{- $natsCreateKind := kindOf (index .Values.nats "create") }}
{{- if eq $natsCreateKind "invalid" }}{{ $natsCreateKind = "null" }}{{ end }}
{{- fail (printf (join "" (list
      "platform: nats.create is a %s rather than true or false, which is not a value helm can resolve a "
      "dependency condition from. "
      "The broker is a dependency declared `condition: nats.create`, and helm leaves a dependency ENABLED when "
      "the path its condition names does not resolve — so a value in this shape does not turn the broker off, "
      "it installs one, and this chart's own nats-ingress NetworkPolicy follows helm and renders with it (ADR-0873). "
      "Write `nats.create: false` to leave the broker out, or `nats.create: true` to install it."))
      $natsCreateKind) }}
{{- end }}
{{- end }}
{{- end }}{{/* end of the nats register-key arm */}}

{{/*
THE MIXED RELEASE, REFUSED HERE RATHER THAN HALF-WAY THROUGH AN APPLY (ADR-0787,
`plans/the-operators-toggle.md`).

`operators.create: true` names a release that installs the five operators and
NOTHING ELSE. A release that installs an operator AND renders an object of a kind
that operator provides cannot work, and the reason needs no cluster to check:
`.Capabilities.APIVersions.Has` is answered from discovery before any template
renders, so it can never see a CRD the same release is about to create. helm is
also understood to resolve the kind of every object in a release before it applies
anything, which would fail such a release mid-apply — that second mechanism is READ
rather than measured, and nothing here rests on it.

SO THE ADOPTER GETS TWO RELEASES: the operators in one, the estate in the next.
Without this check the mixed shape is refused anyway, by the cert-manager check
below, with a message telling the adopter to install cert-manager while cert-manager
sits in the same release. This check exists to say what is actually wrong.

IT IS DECLARED FIRST, AND THE ORDER IS LOAD-BEARING. `fail` aborts the whole render
at the FIRST failing check, and every mixed shape trips a capability check too. Move
this check below them and its refusal never reaches the adopter — the capability
refusal does, and the diagnosis is lost.
`test_the_values_check_is_declared_BEFORE_the_capability_checks` is the gate.

IT REFUSES A CASE THAT IS SOMETIMES LEGAL, AND THAT IS ACCEPTED. On a cluster that
already carries the CRDs, a mixed release would apply fine. Refusing it anyway is
what makes one values file behave the same on every cluster.

THE FIRST CONJUNCT IS NOT `operators.create`, AND THE DIFFERENCE IS A HOLE. Each
dependency's `condition:` is `operators.<op>.create,operators.create`, and helm
reads the FIRST VALID path and stops — so an adopter who sets
`operators.certManager.create: true` alone installs cert-manager with the register
key still false. `templates/_operators.tpl` — the operator's own `create` when it
is a bool inside a map, the register key otherwise — is that same resolution, which
is why the guard below uses it (ledger 1252: a truthy `dig` was not). `or .Values.operators.keda.create
.Values.operators.create` does NOT reproduce it, and reading `operators.create`
alone misses the sub-key shape entirely.
`test_a_guard_reading_only_the_register_key_misses_the_sub_key_case` constructs that
wrong guard and watches the sub-key shape stop being refused.

THAT RESOLUTION NOW LIVES IN `templates/_operators.tpl`, AND SO DOES THE KEY NAME
THIS REFUSAL PRINTS. The helper is the shared one the plan asked for: the same
expression the eighteen vendored CRDs guard on, returning the key that turned the
operator on rather than a bare boolean, so the name below is derived where the
resolution is rather than beside it. It carries the type arm too, which is why
nothing here dereferences `operators` before its shape is known.

A NON-MAP `operators` IS NOT COUNTED HERE, although the helper resolves it ON
(ADR-0873). At the root arm two refuses that shape by name before this guard
matters; under a parent, `yadgarhq/chart` refuses it by the path the adopter
typed, and a mixed-release `fail` here would run first and shadow that refusal,
because `yadgarhq/chart` turns estate toggles on by default.
`test_the_parent_still_names_a_non_map_block_beside_the_estates_toggles` is the
gate.

A NON-BOOL REGISTER KEY IS NOT COUNTED EITHER (yaadgaar 367, ledger 1359), for the
same reason and with the same residual. The helper resolves a present non-bool
`operators.create` ON, and `yadgarhq/chart` refuses it by the path the adopter
typed (`platform.operators.create is a <kind> rather than a boolean`) while turning
estate toggles on by default, so counting it here would run first and shadow that
refusal. At the root arm one refuses the shape before this guard matters. UNDER A
BARE PARENT with no refusal of its own, a non-bool register key beside an estate
toggle is therefore no longer refused as a mixed release, and helm installs the
operators and the estate in one release (the failure ADR-0787 names, mid-apply).
Only the register key is skipped: a per-operator sub-key is returned by the helper
only when it is a bool. The helper is NOT changed, because the vendored CRDs must
keep following helm (ADR-0873).
`test_the_parent_still_names_a_non_bool_register_key_beside_the_estates_toggles` is
the gate.

THE SECOND CONJUNCT IS EVERY OTHER `create` TOGGLE THIS CHART CARRIES, not only the
ones that render a CRD-backed kind. The rule being enforced is the release SHAPE —
operators alone, then everything else — and a rule stated over a subset is a rule an
adopter has to learn the exceptions to. `bootstrap.iamKeys.create` is absent because
it is nested: `templates/bootstrap-secrets.yaml` renders its block only inside the
`bootstrap.create` guard that opens the file, so the OR below already covers it.

BOTH LISTS ARE GATED AGAINST THEIR SOURCES rather than kept in step by attention —
against `Chart.yaml`'s dependencies and against `values.yaml`'s own keys. The plan's
shared helper NOW EXISTS — `templates/_operators.tpl`, called from here and from
all eighteen vendored-CRD guards of its step 2 — so the resolution is stated once;
these two gates keep the LISTS in step, which the helper says nothing about.
*/}}
{{- $operatorKeysOn := list }}
{{- range $operator := (list "argoCd" "certManager" "envoyGateway" "keda" "mariadbOperator" "prometheus") }}
{{- $key := (include "platform.operator-create" (dict "context" $ "operator" $operator)) }}
{{- if and $key (kindIs "map" $.Values.operators) (or (ne $key "operators.create") (kindIs "bool" (index $.Values.operators "create"))) }}
{{- $operatorKeysOn = append $operatorKeysOn $key }}
{{- end }}
{{- end }}
{{- $otherKeysOn := list }}
{{/*
`index` AND NOT `dig` ON THIS SIDE, and it is not a style choice: `dig` takes a
`map[string]interface{}` and the ROOT `.Values` is helm's own `chartutil.Values`
type, so `dig <key> "create" false $.Values` dies with `interface conversion:
interface {} is common.Values` — measured on helm v4.3.0, 2026-09-25. The operator
side above goes through `templates/_operators.tpl`, which uses `index` as well since
ledger 1252: `dig` read the sub-key by truthiness, and helm's condition does not.
*/}}
{{/*
THE TYPE ARM, AND IT IS THE OPERATOR SIDE'S (ledger 1121, F5). A toggle read by
truthiness alone counts `create: "false"` as ON — measured, it was refused here
as having "asked for the objects" — and counts `0` or `{}` as off with no word.
So a `create` that is present and not a bool is refused BY NAME at the root.
ROOT ONLY, for the register arms' reason: `yadgarhq/chart` refuses every
non-bool `platform.<name>.create` itself, and helm runs the subchart's templates
first, so a refusal here would shadow the parent's. Under a parent a truthy
non-bool is still COUNTED as on, as the object templates read it, so a parent
with no refusal of its own still gets the mixed-release refusal. `kindIs "map"` on
the block first, so a non-map block reaches the template that reads it rather
than an index error here.

WHICH REASON EACH TOGGLE GETS (F4). `$crdBacked` is the toggles whose objects
are of a kind a CustomResourceDefinition serves — cert-manager's for three,
Envoy Gateway's and the Gateway API's for `gatewayListener`. `bootstrap`, `nats`
and `valkey` render only built-in kinds, so a CRD cannot be why they are
refused; they are refused for the release SHAPE alone. The refusal states each
reason over the toggles it is true of. `test_render_checks.py` measures the list
against the render rather than trusting this paragraph.
*/}}
{{- $crdBacked := (list "certificates" "edgeTLS" "gatewayListener" "internalCA") }}
{{- $crdKeysOn := list }}
{{- $shapeKeysOn := list }}
{{- range $toggle := (list "bootstrap" "certificates" "edgeTLS" "gatewayListener" "internalCA" "nats" "valkey") }}
{{- $block := index $.Values $toggle }}
{{- if kindIs "map" $block }}
{{- $create := index $block "create" }}
{{- $on := false }}
{{- if kindIs "bool" $create }}
{{- $on = $create }}
{{- else if and (hasKey $block "create") (not (contains "/charts/" $.Template.BasePath)) }}
{{- fail (printf (join "" (list
      "platform: %s.create is a %s rather than true or false, so this chart cannot read it as a toggle. "
      "A quoted \"false\" reads as ON to a template and a 0 or {} as off, so the objects it guards would render or not "
      "by accident of the type. Write %s.create: true or false, unquoted."))
      $toggle (kindOf $create) $toggle) }}
{{- else if $create }}
{{- /* UNDER A PARENT, a truthy non-bool is COUNTED AS ON, the way the object
templates read it, so the mixed release stays refused under a parent that does
not name the key itself (ledger 1121 review). Skipping it here let
`certificates.create: "false"` beside the operators render at exit 0. */}}
{{- $on = true }}
{{- end }}
{{- if $on }}
{{- $otherKeysOn = append $otherKeysOn (printf "%s.create" $toggle) }}
{{- if has $toggle $crdBacked }}
{{- $crdKeysOn = append $crdKeysOn (printf "%s.create" $toggle) }}
{{- else }}
{{- $shapeKeysOn = append $shapeKeysOn (printf "%s.create" $toggle) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if and $operatorKeysOn $otherKeysOn }}
{{- $reasons := list }}
{{- if $crdKeysOn }}
{{- $reasons = append $reasons (printf (join "" (list
      "%s %s objects whose kind needs a CustomResourceDefinition, which has to be registered on the target before the release that needs it renders, "
      "and a CustomResourceDefinition this very release is installing is not registered — so this would fail part-way through the apply, "
      "with the operators in and the objects not."))
      (join ", " $crdKeysOn) (ternary "renders" "render" (eq (len $crdKeysOn) 1))) }}
{{- end }}
{{- if $shapeKeysOn }}
{{- $reasons = append $reasons (printf (join "" (list
      "%s %s no CRD-backed kind, and %s refused for the release shape alone (ADR-0787): "
      "the operators go in a release of their own, so one values file behaves the same on every cluster."))
      (join ", " $shapeKeysOn) (ternary "renders" "render" (eq (len $shapeKeysOn) 1)) (ternary "it is" "they are" (eq (len $shapeKeysOn) 1))) }}
{{- end }}
{{- fail (printf (join "" (list
      "platform: this release installs operators AND renders the estate's own objects, and one release cannot do both. "
      "%s asked for the operators; %s asked for the objects. "
      "%s "
      "Install the operators in a release of their own, with every other create toggle false, then install the estate against the cluster that release leaves behind."))
      (join ", " (uniq $operatorKeysOn)) (join ", " $otherKeysOn) (join " " $reasons)) }}
{{- end }}

{{/*
`prometheus.forceNamespace`, REFUSED WHEN IT NAMES NO NAMESPACE AND PROMETHEUS IS
ON (plan K-3, ledger 1340).

The key sits inside `prometheus`, an upstream section `values.schema.json` leaves
open, so no schema can refuse it; this arm is its guard. It puts every namespaced
Prometheus object in `observability`, where the seven module charts' default
`autoscaling.prometheusAddress` points, and `templates/prometheus-namespace.yaml`
renders that Namespace off it. MEASURED on helm v4.3.0 and v3.18.4, 2026-10-08,
with the operator on: `forceNamespace: ""` or `null` rendered EXIT 0, as the root
and under a bare parent alike, with the server in the release's own namespace and
no `observability` Namespace.

THE CONDITION IS THE HELPER, so the arm runs exactly when helm installs the
prometheus subchart. A non-string never reaches it: the upstream chart's own
schema types the key and refuses `5`, `[a]` and `{}` first, naming it. The kind
branch stays for the day that schema drops the type.

IT RUNS WHEREVER THIS CHART RUNS, FOR A MAPPING `operators`: no parent refuses
this key, so it is not root-only. A non-map block is arm two's diagnosis at the
root and the parent's under one, so the arm stands down for it. AND IT SITS AFTER
THE MIXED-RELEASE GUARD: a release that asks for the operators and the estate's
objects together cannot work whatever this key says, so that refusal arrives
first. `scripts/tests/test_force_namespace.py` is the gate.
*/}}
{{- /* the prometheus.forceNamespace arm (ledger 1340) */}}
{{- $prometheusKey := include "platform.operator-create" (dict "context" $ "operator" "prometheus") }}
{{- if and $prometheusKey (kindIs "map" .Values.operators) }}
{{- $problem := "" }}
{{- $present := and (kindIs "map" .Values.prometheus) (hasKey .Values.prometheus "forceNamespace") }}
{{- $forceNamespace := "" }}
{{- if $present }}
{{- $forceNamespace = index .Values.prometheus "forceNamespace" }}
{{- end }}
{{- if or (not $present) (kindIs "invalid" $forceNamespace) }}
{{- $problem = "is null or has been deleted, so it names no namespace" }}
{{- else if not (kindIs "string" $forceNamespace) }}
{{- $problem = printf "is a %s rather than a namespace name" (kindOf $forceNamespace) }}
{{- else if eq $forceNamespace "" }}
{{- $problem = "is an empty string" }}
{{- end }}
{{- if $problem }}
{{- fail (printf (join "" (list
      "platform: prometheus.forceNamespace %s, and %s turns the bundled Prometheus on. "
      "Every namespaced Prometheus object would land in the release's own namespace rather than the one the module "
      "charts' autoscaling.prometheusAddress queries, and no later step refuses that. "
      "Write prometheus.forceNamespace: observability, the namespace every module chart queries by default, or set "
      "operators.prometheus.create: false and point each module's autoscaling.prometheusAddress at a Prometheus of "
      "your own."))
      $problem $prometheusKey) }}
{{- end }}
{{- end }}{{/* end of the prometheus.forceNamespace arm */}}

{{/*
THE NATS AND VALKEY TLS KEYS: THE SHAPE OF BOTH, BOTH FULLY RENDERED NOW. B-L1
declared `nats.tls.{enabled,clientAuth}` and `valkey.tls.{enabled,clientAuth,
plaintext}` and refused every value that would turn either server's TLS on.
B-N2 rendered NATS's contract (below) and lifted its half of that refusal;
this version (B-V2) renders valkey's (`templates/valkey.yaml`,
`templates/ingress-policies.yaml`) and lifts the other half. Nothing is
refused as "not rendered yet" any more, so the `$tlsUnrendered` list the two
expands used to share — and the one `fail` that read it — is deleted here
rather than kept as a check nothing can ever trip.

THE SHAPE CHECK REMAINS, for both servers, because the schema closes the key
set and nothing else (ADR-0847): a non-map block, a non-bool switch, and a
`clientAuth` that is not a quoted string (YAML reads a bare `off` as false —
the B-U5E convention) or not one of the values its server has. NATS has no
optional client-certificate mode (`verify` is require-and-verify only;
ADR-0854), so its set is `off | required`; valkey's is `off | optional |
required` — a shape BOTH contracts below still enforce, because each reads
`clientAuth` by exact string. The parent names these keys too
(`yadgarhq/chart` B-U6 Part 3), but only to compare platform against its
clients, never to validate a key's own shape — so nothing here shadows a
parent refusal.

THE LOOP VARIABLE IS NOT `$operator` OR `$toggle`, so the mixed-release guard's
two lists above stay the first `range` of each name in this file, which
`test_render_checks.py` reads.
*/}}
{{- $tlsShape := list }}
{{- range $tlsServer := (list "nats" "valkey") }}
{{- $server := index $.Values $tlsServer }}
{{- if and (kindIs "map" $server) (hasKey $server "tls") }}
{{- $tls := index $server "tls" }}
{{- if not (kindIs "map" $tls) }}
{{- $kind := kindOf $tls }}
{{- if eq $kind "invalid" }}{{ $kind = "null" }}{{ end }}
{{- $tlsShape = append $tlsShape (printf "`%s.tls` is a %s rather than a mapping: write `enabled`, `clientAuth`%s under it" $tlsServer $kind (ternary " and `plaintext`" "" (eq $tlsServer "valkey"))) }}
{{- else }}
{{- range $switch := (ternary (list "enabled" "plaintext") (list "enabled") (eq $tlsServer "valkey")) }}
{{- if hasKey $tls $switch }}
{{- $value := index $tls $switch }}
{{- if not (kindIs "bool" $value) }}
{{- $kind := kindOf $value }}
{{- if eq $kind "invalid" }}{{ $kind = "null" }}{{ end }}
{{- $tlsShape = append $tlsShape (printf "`%s.tls.%s` is a %s rather than true or false: write it unquoted" $tlsServer $switch $kind) }}
{{- end }}
{{- end }}
{{- end }}
{{- if hasKey $tls "clientAuth" }}
{{- $mode := index $tls "clientAuth" }}
{{- if not (kindIs "string" $mode) }}
{{- $tlsShape = append $tlsShape (printf "`%s.tls.clientAuth` must be a quoted string, and it is a %s. YAML reads a bare off as false: write `clientAuth: \"off\"`" $tlsServer (ternary "null" (kindOf $mode) (eq (kindOf $mode) "invalid"))) }}
{{- else if eq $tlsServer "nats" }}
{{- if not (has $mode (list "off" "required")) }}
{{- $tlsShape = append $tlsShape (printf "`nats.tls.clientAuth` must be `off` or `required`, and it is %q. NATS has no optional client-certificate mode: its `verify` requires and verifies (ADR-0854)" $mode) }}
{{- end }}
{{- else if not (has $mode (list "off" "optional" "required")) }}
{{- $tlsShape = append $tlsShape (printf "`%s.tls.clientAuth` must be `off`, `optional` or `required`, and it is %q" $tlsServer $mode) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if $tlsShape }}
{{- fail (printf "platform: %s." (join "; " $tlsShape)) }}
{{- end }}

{{/*
NATS'S SERVER TLS CONTRACT (B-N2, ledger 925, ADR-0852): THE PLATFORM KEYS ARE
REQUIRED, AND THEY MUST AGREE WITH THE UPSTREAM KEYS THAT DO THE WORK.

TWO SOURCES, ON PURPOSE. The upstream nats chart (2.14.6) renders the listener
from `nats.config.nats.tls.{enabled, secretName}` (mounted at
`nats.config.nats.tls.dir`, default `/etc/nats-certs/nats`), client verification
from `nats.config.nats.tls.merge.{verify, ca_file}`, and the transport step's
mixed listener from the top-level `nats.config.merge.allow_non_tls`. A parent
template cannot write a subchart's values, and the parent always sees the
subchart's own default `false` for `nats.config.nats.tls.enabled` — measured:
`helm template --set nats.create=true` reads it as a bool `false` with no
override. So ADR-0845's "absent refuses" can live only on a platform-owned key:
`nats.tls.enabled` and `nats.tls.clientAuth` ("off" | "required"; NATS has no
optional mode, ADR-0854). The adopter writes both sources; this check makes them
say the same thing.

BOTH ARMS RUN WHILE HELM INSTALLS THE BROKER. With the broker out — the
operator Applications pin this chart with `nats.create` false — nothing reads
these keys and nothing is required. The shape arm above still validates any key
that is present.

`$natsCreate` IS OFF ONLY ON THE BOOL `false`, the reading `ingress-policies.yaml`
uses (ADR-0873, yaadgaar 359). helm leaves `condition: nats.create` ENABLED for
any value that is not a bool, so under a bare parent `nats.create: "yes"`, `0`
or `{}` installs the broker. A gate that read only a bool `true` skipped every
broker arm for those values, and a port of `"4222\nallow_non_tls: true"` then put
`allow_non_tls: true` into nats.conf at rc=0 (yaadgaar 552). At the root the
register-key arm above refuses a non-bool first, and under `yadgarhq/chart` the
parent does, so this reading changes no render the estate makes.

ARM ONE, ABSENCE. Either platform key absent refuses, naming each, with the off
posture to write.

ARM TWO, AGREEMENT. Every disagreement is collected and refused in ONE sentence:
  - `nats.tls.enabled` equals the TRUTHINESS of `nats.config.nats.tls.enabled`,
    because the upstream template reads it with `if .enabled`;
  - TLS on needs `secretName: nats-tls`, the serving leaf this chart issues;
  - `clientAuth: "required"` needs TLS on, `merge.verify` a bool `true`, and
    `merge.ca_file` exactly `<dir>/ca.crt` — the CA cert-manager writes beside
    the leaf, and never the image's public bundle. The reloader watches that
    file (`nats.reloaderConfig` matches every `ca_file`), so CA renewal reloads;
  - `clientAuth: "off"` with `verify` set is a disagreement the other way;
  - `clientAuth: "required"` with `allow_non_tls` true refuses: a plaintext
    client never reaches the handshake, so `verify` never sees it;
  - `nats.config.monitor.tls.enabled` is never set, `nats.config.merge` sets no
    monitor listener, and no key under `nats.config` ends in `$include`
    (yaadgaar 169): the chart derives the monitor's HTTPS from the client
    listener itself, through its own `nats.config.patch` entry;
  - `nats.tlsCA.enabled` must stay false: it writes a second `ca_file` from
    another source;
  - while TLS is on, `nats.config.patch` must be exactly the chart's own entry
    (`$natsMonitorPatch`) and `nats.config.nats.tls.patch` must be empty: a
    JSON patch runs after `merge` (`nats.loadMergePatch`) and can rewrite any
    of the above after this check has read it;
  - `nats.config.merge.tls` refuses at any posture: `nats.loadMergePatch`
    mergeOverwrites `nats.config.merge` over the WHOLE rendered config, so a
    `tls` block there replaces the `nats.config.nats.tls` keys read above;
  - while TLS is on, `nats.podTemplate.configChecksumAnnotation` must be a bool
    `true` (next paragraph).

`nats.podTemplate.configChecksumAnnotation` is on in `values.yaml`, so every
change to these keys rolls the broker: `allow_non_tls` is not hot-reloadable
(nats-server's reload rejects the whole change), and a roll is the only way it
takes effect. The reloader stays on for leaf renewal.
*/}}
{{- /* THE `$tplYaml` LITERALS `values.yaml` HANDS THE UPSTREAM CHART (yaadgaar 169).
Each reads `config.nats.tls.enabled` after every values file is merged:
`$natsMonitorPatch` is the `nats.config.patch` entry that moves the monitor to
`https_port` with TLS on; `$natsStartupScheme` and `$natsReadinessScheme` are the
`nats.container.patch` entries that move those probes to HTTPS; `$natsLiveness`
is the liveness probe's command. Each is a copy of its `values.yaml` text, which
`test_the_tplyaml_literals_match_values_yaml` pins byte for byte, so the arms
below can tell the chart's own entries from an adopter's. */ -}}
{{- $natsMonitorPatch := `{{- if and .Values.config.nats.tls.enabled (not .Values.config.monitor.tls.enabled) }}{op: move, from: /http_port, path: /https_port}{{- else }}{op: test, path: /pid_file, value: /var/run/nats/nats.pid}{{- end }}` }}
{{- $natsStartupScheme := `{{- if .Values.config.nats.tls.enabled }}{op: add, path: /startupProbe/httpGet/scheme, value: HTTPS}{{- else }}{op: test, path: /name, value: nats}{{- end }}` }}
{{- $natsReadinessScheme := `{{- if .Values.config.nats.tls.enabled }}{op: add, path: /readinessProbe/httpGet/scheme, value: HTTPS}{{- else }}{op: test, path: /name, value: nats}{{- end }}` }}
{{- $natsLiveness := `{{- $tls := not (empty .Values.config.nats.tls.enabled) }}{{ printf "sha256sum -c -s /var/run/nats/auth.sha256 && wget %s-q -O /dev/null '%s://127.0.0.1:8222/healthz?js-enabled-only=true'" (ternary "--no-check-certificate " "" $tls) (ternary "https" "http" $tls) | toJson }}` }}
{{- $natsCreate := and (kindIs "map" .Values.nats) (not (and (kindIs "bool" (index .Values.nats "create")) (not (index .Values.nats "create")))) }}
{{- if $natsCreate }}
{{- $natsTls := index .Values.nats "tls" | default dict }}
{{- $natsAbsent := list }}
{{- range $key := (list "enabled" "clientAuth") }}
{{- if not (hasKey $natsTls $key) }}
{{- $natsAbsent = append $natsAbsent (printf "`nats.tls.%s`" $key) }}
{{- end }}
{{- end }}
{{- if $natsAbsent }}
{{- fail (printf (join "" (list
      "platform: nats.create is true and %s %s absent. "
      "The broker's TLS switch and its client-certificate mode have no default (ADR-0845, ADR-0854): "
      "the upstream `nats.config.nats.tls.enabled` always reads as the subchart's own false here, so only these keys can say what you run. "
      "Write `nats.tls.enabled: false` and `nats.tls.clientAuth: \"off\"` for a plaintext broker, or the TLS posture you run."))
      (join " and " $natsAbsent) (ternary "is" "are" (eq (len $natsAbsent) 1))) }}
{{- end }}
{{- $natsEnabled := index $natsTls "enabled" }}
{{- $natsMode := index $natsTls "clientAuth" }}
{{- $up := dig "config" "nats" "tls" dict .Values.nats }}
{{- $upEnabled := not (empty (index $up "enabled")) }}
{{- $upMerge := index $up "merge" | default dict }}
{{- $verify := index $upMerge "verify" }}
{{- $caFile := index $upMerge "ca_file" | default "" }}
{{- $expectedCaFile := printf "%s/ca.crt" (trimSuffix "/" ((index $up "dir") | default "/etc/nats-certs/nats")) }}
{{- /* `nats.config.merge` is mergeOverwritten over the whole rendered config, and
nats-server reads every top-level key through `switch strings.ToLower(k)`
(server/opts.go v2.14.6:1143), so `TLS` or `Allow_Non_TLS` there is the same
setting as the lowercase key. Every read of this map below is by lowercased key. */ -}}
{{- $natsMerge := dig "config" "merge" dict .Values.nats }}
{{- $allowNonTls := list }}
{{- range $key, $value := $natsMerge }}
{{- if and (eq (lower $key) "allow_non_tls") (not (empty $value)) }}
{{- $allowNonTls = append $allowNonTls $key }}
{{- end }}
{{- end }}
{{- $natsDisagree := list }}
{{- if ne $natsEnabled $upEnabled }}
{{- $natsDisagree = append $natsDisagree (printf "`nats.tls.enabled` is %t and `nats.config.nats.tls.enabled` is %t: the platform switch and the upstream key that renders the listener must agree" $natsEnabled $upEnabled) }}
{{- end }}
{{- if and $natsEnabled (ne (toString (index $up "secretName" | default "")) "nats-tls") }}
{{- $natsDisagree = append $natsDisagree (printf "`nats.config.nats.tls.secretName` is %q: it must be \"nats-tls\", the serving leaf this chart issues" (toString (index $up "secretName" | default ""))) }}
{{- end }}
{{- if eq $natsMode "required" }}
{{- if not $natsEnabled }}
{{- $natsDisagree = append $natsDisagree "`nats.tls.clientAuth` is \"required\" and `nats.tls.enabled` is false: client verification needs the TLS listener (ADR-0854)" }}
{{- end }}
{{- if not (and (kindIs "bool" $verify) $verify) }}
{{- $natsDisagree = append $natsDisagree "`nats.tls.clientAuth` is \"required\" and `nats.config.nats.tls.merge.verify` is not true: write `verify: true`, unquoted" }}
{{- end }}
{{- if ne (toString $caFile) $expectedCaFile }}
{{- $natsDisagree = append $natsDisagree (printf "`nats.config.nats.tls.merge.ca_file` is %q rather than %q: the broker verifies clients against the internal CA cert-manager writes beside its leaf, never a public bundle" (toString $caFile) $expectedCaFile) }}
{{- end }}
{{- range $key := $allowNonTls }}
{{- $natsDisagree = append $natsDisagree (printf "`nats.tls.clientAuth` is \"required\" and `nats.config.merge.%s` is true: a plaintext client never reaches the TLS handshake, so `verify` cannot refuse it" $key) }}
{{- end }}
{{- else if not (empty $verify) }}
{{- $natsDisagree = append $natsDisagree "`nats.tls.clientAuth` is \"off\" and `nats.config.nats.tls.merge.verify` is true: the platform mode and the upstream key must agree" }}
{{- end }}
{{- /* THE MONITOR FOLLOWS THE CLIENT LISTENER (yaadgaar 169, ADR-0852), AND THE CHART
DOES IT. `values.yaml`'s own `nats.config.patch` entry moves `/http_port` to
`/https_port` whenever `nats.config.nats.tls.enabled` is on, and its
`nats.container.patch` entries move the probes with it, so no adopter key exists.
`nats.config.monitor.tls.enabled` set truthy is therefore REFUSED at every
posture: with TLS off it asks nats-server for an HTTPS monitor with no
certificate to serve, and with TLS on it makes the upstream chart render the
monitor by a route this chart does not own (the chart's `move` stands down when
it is set, so this refusal is what an adopter sees).
Its `false` is the subchart's own default and reads the same as unset.

THE MONITOR CANNOT BE SET ANOTHER WAY. `nats.config.merge` refuses at every
posture any top-level monitor alias nats-server reads (opts.go v2.14.6:1271-1293,
lowercased). That is not every route: the upstream `nats.formatConfig` turns a
key ending in `$include` into an `include` directive, which loads another
file that can re-set the monitor, `allow_non_tls` or `tls` after every read
here (measured at rc=0 with TLS on). So any key ending in `$include`, at any
depth under `nats.config`, refuses too. It is read off the JSON of the whole
subtree, where every key is a quoted string followed by a colon. Neither list is
every route on its own: a `<< >>` raw string can carry the same directives, and
the raw-text arm below refuses it. */ -}}
{{- if not (empty (index (dig "config" "monitor" "tls" dict .Values.nats) "enabled")) }}
{{- $natsDisagree = append $natsDisagree "`nats.config.monitor.tls.enabled` is set: the chart serves the monitor over HTTPS exactly when `nats.config.nats.tls.enabled` is on, through its own `nats.config.patch` entry (ADR-0852). Remove the key" }}
{{- end }}
{{- /* RAW TEXT IS THE OTHER ROUTE (yaadgaar 169, measured against nats-server
2.14.6). The upstream `nats.formatConfig` copies a `"<< X >>"` string, key or
value, into nats.conf UNQUOTED, and nats-server reads `;`-separated directives in
that text: `debug: "<< false; allow_non_tls: true >>"` rendered rc=0 and the
broker started with TLS "available" instead of "required", and the same trick
reaches an `include`. The upstream regex `"<<\s+(.*?)\s+>>"` also matches ACROSS
a key and its value on one pretty-JSON line, so a key holding `<<` and a value
holding `>>` is the same hole split in two (measured). So every string under
`nats.config`, at any depth, key or value, that holds `<<` OR `>>` refuses
unless it is exactly one of the chart's own raw strings (`$natsRawStrings`, the two password references
`values.yaml` writes; `test_the_raw_string_allowlist_matches_values_yaml` pins the
list). The strings are read off `toRawJson`, which does not escape `<` and `>`. */ -}}
{{- $natsRawStrings := list "\"<< $NATS_PASSWORD >>\"" "\"<< $NATS_PASSWORD_GATEWAY >>\"" }}
{{- range $found := regexFindAll `"(?:[^"\\]|\\.)*"` (toRawJson (dig "config" dict .Values.nats)) -1 }}
{{- if and (or (contains "<<" $found) (contains ">>" $found)) (not (has $found $natsRawStrings)) }}
{{- $natsDisagree = append $natsDisagree (printf "`nats.config` holds the string %s: the upstream chart copies a `<< >>` string into nats.conf as raw text, where `;` starts another directive that can re-set `allow_non_tls`, `tls`, the monitor or an `include` after this check read them. Only the chart's own password references may use it" $found) }}
{{- end }}
{{- end }}
{{- /* AN ADOPTER'S `$tplYaml` IS RESOLVED AFTER EVERY CHECK HERE (yaadgaar 169). The
upstream chart templates any `$tplYaml` or `$tplYamlSpread` map in its values
with `tpl` inside `nats.defaultValues`, so its output never reaches this chart:
a `printf` can assemble a `<< >>` raw string or an `$include` key that the arms
above would have refused (both measured at rc=0, and nats-server obeyed them). So
every such key, at any depth under `nats.config`, refuses. The one exception is
the chart's own `nats.config.patch` entry, matched by its exact value: when
`nats.config.patch` is exactly that list, one occurrence is the chart's. */ -}}
{{- $tplKeys := len (regexFindAll `"\$tplYaml(?:Spread)?":` (toRawJson (dig "config" dict .Values.nats)) -1) }}
{{- $ownTplKeys := ternary 1 0 (eq (toJson (dig "config" "patch" list .Values.nats)) (toJson (list (dict "$tplYaml" $natsMonitorPatch)))) }}
{{- if gt $tplKeys $ownTplKeys }}
{{- $natsDisagree = append $natsDisagree (printf "`nats.config` holds %d `$tplYaml` or `$tplYamlSpread` key(s) that are not the chart's own: the upstream chart resolves them after this check, so they can build a raw string or an `include` it never sees. Write the value plainly" (sub $tplKeys $ownTplKeys)) }}
{{- end }}
{{- range $found := regexFindAll `"(?:[^"\\]|\\.)*\$include":` (toJson (dig "config" dict .Values.nats)) -1 }}
{{- $natsDisagree = append $natsDisagree (printf "`nats.config` holds the key %s: the upstream chart turns a key ending in `$include` into an `include` directive, which can re-set the monitor, `allow_non_tls` or `tls` after this check read them. Remove it" (trimSuffix ":" $found)) }}
{{- end }}
{{- range $key := keys $natsMerge | sortAlpha }}
{{- if has (lower $key) (list "http" "https" "http_port" "monitor_port" "https_port" "http_base_path") }}
{{- $natsDisagree = append $natsDisagree (printf "`nats.config.merge` sets the key %s, a monitor listener outside `nats.config.monitor`: it could serve the monitor over plain HTTP, or move it from the port the probes check. Remove it" (toJson $key)) }}
{{- end }}
{{- end }}
{{- if not (empty (dig "tlsCA" "enabled" false .Values.nats)) }}
{{- $natsDisagree = append $natsDisagree "`nats.tlsCA.enabled` is true: it writes a second `ca_file` from another source; this chart reads the CA through `nats.config.nats.tls.merge.ca_file`" }}
{{- end }}
{{- /* THE SIDE LISTENERS (yaadgaar 325, ADR-0852). The upstream chart has four more
listeners, each off by default and each with its own `tls` block that
`nats.config.nats.tls.merge.verify` does not reach: an enabled one accepts a client
with no certificate. Under "required" they are REFUSED OUTRIGHT, not offered a TLS
block of their own (Max's ruling): no consumer exists, and ADR-0852 is satisfied by
their absence. `nats.config.merge` is mergeOverwritten over the whole rendered
config, so a listener block written there is the same hole by another key, and it
is read the way nats-server reads it: lowercased (opts.go v2.14.6:1143), with the
server's own aliases — :1301 `case "gateway":`, :1306 `case "leaf", "leafnodes":`,
:1786 `case "websocket", "ws":`, :1791 `case "mqtt":`. The `enabled` keys are the
upstream CHART's, which it reads by exact name, so they stay exact. Both lists are
literals: `test_the_side_listener_list_matches_the_upstream_chart` gates the first
against the vendored chart's `config:` keys, and
`test_the_template_carries_both_listener_lists` pins both to the test's constants.
The cluster route listener (6222) and the monitor are NOT here; route TLS is task
1519's. */ -}}
{{- if eq $natsMode "required" }}
{{- range $listener := (list "websocket" "mqtt" "leafnodes" "gateway") }}
{{- if not (empty (dig "config" $listener "enabled" false $.Values.nats)) }}
{{- $natsDisagree = append $natsDisagree (printf "`nats.config.%s.enabled` is true and `nats.tls.clientAuth` is \"required\": that listener does not verify client certificates, so it is a way past mutual TLS (ADR-0852). Turn it off" $listener) }}
{{- end }}
{{- end }}
{{- range $key, $_ := $natsMerge }}
{{- if has (lower $key) (list "websocket" "ws" "mqtt" "leafnodes" "leaf" "gateway") }}
{{- $natsDisagree = append $natsDisagree (printf "`nats.config.merge.%s` adds a listener while `nats.tls.clientAuth` is \"required\": that listener does not verify client certificates (ADR-0852). Remove the block" $key) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $key, $_ := $natsMerge }}
{{- if eq (lower $key) "tls" }}
{{- $natsDisagree = append $natsDisagree (printf "`nats.config.merge.%s` overrides the `nats.config.nats.tls` keys this check reads; write them under `nats.config.nats.tls.merge`" $key) }}
{{- end }}
{{- end }}
{{- /* THE CLIENT TLS BLOCK IS READ THE WAY nats-server READS IT (yaadgaar 490).
`parseTLS` lowercases every key of a TLS block (server/opts.go v2.14.6 :5115,
:5128), so `Verify: false` beside `verify: true` is one setting written twice,
and the server keeps whichever its unordered map loop reaches last. The reads
above are by exact lowercase key, so every key here that is not lowercase is
refused: what is left is exactly what they read. */ -}}
{{- range $key, $_ := $upMerge }}
{{- if ne $key (lower $key) }}
{{- $natsDisagree = append $natsDisagree (printf "`nats.config.nats.tls.merge.%s` is not lowercase: nats-server lowercases every key of a TLS block, so it is the same setting as `%s` and could override what this check read. Write it lowercase" $key (lower $key)) }}
{{- end }}
{{- end }}
{{- if $natsEnabled }}
{{- /* THE CONFIGMAP ITSELF (yaadgaar 489). The upstream chart renders `nats.conf`
into a ConfigMap through `nats.loadMergePatch`: `nats.configMap.merge` is
mergeOverwritten over the WHOLE object and `nats.configMap.patch` runs after it,
so either can take the rendered `nats.conf` away from the broker. `data` and
`binaryData` replace it outright. `metadata.name` renames the object, so a
ConfigMap added under `nats.extraResources` can take the name the pod mounts.
`kind: Secret` turns it into an object the pod's ConfigMap volume does not read.
So the merge is an ALLOWLIST, matched by exact key: `metadata.labels` and
`metadata.annotations`, and nothing else. */ -}}
{{- range $key, $value := (dig "configMap" "merge" dict .Values.nats) }}
{{- if ne $key "metadata" }}
{{- $natsDisagree = append $natsDisagree (printf "`nats.configMap.merge.%s` is set while `nats.tls.enabled` is true: only `metadata.labels` and `metadata.annotations` may be merged into the ConfigMap that carries `nats.conf`, so the broker runs the TLS settings this check read" $key) }}
{{- else if not (kindIs "map" $value) }}
{{- $natsDisagree = append $natsDisagree (printf "`nats.configMap.merge.metadata` is not a map (it is %s) while `nats.tls.enabled` is true: only its `labels` and `annotations` may be merged" (kindOf $value)) }}
{{- else }}
{{- range $metaKey, $_ := $value }}
{{- if not (has $metaKey (list "labels" "annotations")) }}
{{- $natsDisagree = append $natsDisagree (printf "`nats.configMap.merge.metadata.%s` is set while `nats.tls.enabled` is true: only `metadata.labels` and `metadata.annotations` may be merged into the ConfigMap that carries `nats.conf`, so the broker runs the TLS settings this check read" $metaKey) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if not (empty (dig "configMap" "patch" list .Values.nats)) }}
{{- $natsDisagree = append $natsDisagree "`nats.configMap.patch` is not empty while `nats.tls.enabled` is true: a JSON patch on the ConfigMap can rewrite the rendered `nats.conf` this check read" }}
{{- end }}
{{- $checksum := dig "podTemplate" "configChecksumAnnotation" false .Values.nats }}
{{- if not (and (kindIs "bool" $checksum) $checksum) }}
{{- $natsDisagree = append $natsDisagree "`nats.podTemplate.configChecksumAnnotation` is not true while `nats.tls.enabled` is true: `allow_non_tls` is not hot-reloadable, so without the roll a step that changes it leaves the old listener running while the values say otherwise" }}
{{- end }}
{{- if ne (toJson (dig "config" "patch" list .Values.nats)) (toJson (list (dict "$tplYaml" $natsMonitorPatch))) }}
{{- $natsDisagree = append $natsDisagree "`nats.config.patch` is not the chart's own entry while `nats.tls.enabled` is true: a JSON patch runs after `merge` and can rewrite the TLS settings this check read, and the chart's entry is what moves the monitor to HTTPS. Leave it unset" }}
{{- end }}
{{- if not (empty (index $up "patch")) }}
{{- $natsDisagree = append $natsDisagree "`nats.config.nats.tls.patch` is not empty while `nats.tls.enabled` is true: a JSON patch runs after `merge` and can rewrite the TLS settings this check read" }}
{{- end }}
{{- end }}
{{- if $natsDisagree }}
{{- fail (printf "platform: the NATS TLS keys disagree: %s." (join "; " $natsDisagree)) }}
{{- end }}
{{- end }}{{/* end of the NATS contract arms */}}

{{/*
THE BROKER'S CREDENTIAL ROTATION (ADR-0924, ledger 1440): REFUSE WHAT WOULD
SILENTLY BREAK IT. `values.yaml` mounts both passwords as directories, runs a
shell wrapper that hashes them, and swaps the liveness probe for one that
re-checks that hash beside `/healthz`. Three adopter moves break that at run
time, two of them silently, so each refuses here instead. All three run only
while `nats.create` is true.

ARM ONE, THE IMAGE. The wrapper needs `/bin/sh`, `sha256sum` and `wget`. The
upstream `nats` image ships them only in its alpine flavour; the default flavour
is `scratch`-based and the container would fail to start. The reference is
resolved as the upstream `nats.image` helper resolves it: `fullImageName`, else
`repository@digest`, else `repository:tag`. A digest-only pin hides the
flavour, because the helper drops the tag, so it refuses too; pin an alpine
digest through `fullImageName` instead.

ARM TWO, THE MONITOR. The probe is fixed at `127.0.0.1:8222`. With
`config.monitor.enabled` false the upstream chart renders NO liveness probe at
all, so a rotation never restarts the broker. Measured on helm 3.18.4, that
case never reaches this arm: helm renders the subchart first, and the chart's
own `remove /livenessProbe/httpGet` refuses there ("key livenessProbe does not
exist"). The arm stays for a renderer that orders templates otherwise. Another
port makes the probe fail for ever and restart the broker in a loop. An adopter's
`config.monitor.tls.enabled` is refused by the NATS TLS contract above, not here
(yaadgaar 169): the chart serves the monitor over HTTPS itself whenever the
client listener has TLS, and the probe's scheme follows the same key.

ARM THREE, THE PATCH LISTS. Helm replaces a list across values files, so an
adopter `container.patch` or `podTemplate.patch` drops the chart's entries. A
lost mount fails at startup; a lost probe swap leaves the upstream `/healthz`
probe, and a rotation then never restarts the broker. The check reads the
entries by `op`, `path` and volume name, and the probe's command by its whole
value: it must be the chart's own `$tplYaml` command (`$natsLiveness`), because a
copied plain-http command would fail for ever once the monitor serves HTTPS. The
two entries that move the startup and readiness probes to HTTPS
(`$natsStartupScheme`, `$natsReadinessScheme`) must be there too, for the same
reason. `test_the_tplyaml_literals_match_values_yaml` pins all of them.
*/}}
{{- if $natsCreate }}
{{- $rotation := list }}
{{- $image := dig "container" "image" dict .Values.nats }}
{{- $imageRef := "" }}
{{- if $image.fullImageName }}
{{- $imageRef = toString $image.fullImageName }}
{{- else if $image.digest }}
{{- $imageRef = printf "%s@%s" (toString $image.repository) (toString $image.digest) }}
{{- else }}
{{- $imageRef = printf "%s:%s" (toString $image.repository) (toString $image.tag) }}
{{- end }}
{{- /* THE FLAVOUR IS THE TAG'S, AND ONLY THE TAG'S (yaadgaar 366). `contains`
over the whole reference let `alpine/nats:2.14.6` or a registry named for alpine
vouch for a scratch tag. The tag is what follows the last `:` of the last path
segment, with any `@digest` dropped first, so a registry port is never read as one;
it must END in `alpine`, bare or after a `-`, optionally with an alpine version. */ -}}
{{- $imageName := regexReplaceAll "@.*$" $imageRef "" }}
{{- $lastSegment := regexReplaceAll "^.*/" $imageName "" }}
{{- $imageTag := ternary (regexReplaceAll "^[^:]*:" $lastSegment "") "" (contains ":" $lastSegment) }}
{{- if not (regexMatch "(^|-)alpine[0-9.]*$" $imageTag) }}
{{- fail (printf (join "" (list
      "platform: the broker image resolves to %q, whose tag does not name the alpine flavour. "
      "The credential-rotation wrapper (ADR-0924) runs in the nats container and needs a shell; the default nats image is scratch-based and has none. "
      "Use an alpine tag such as `2.14.6-alpine`, or pin a digest as `fullImageName: nats:2.14.6-alpine@sha256:...` — a digest-only pin drops the tag, so its flavour cannot be checked."))
      $imageRef) }}
{{- end }}
{{- $monitor := dig "config" "monitor" dict .Values.nats }}
{{- if not (dig "enabled" true $monitor) }}
{{- $rotation = append $rotation "`nats.config.monitor.enabled` is false, so the upstream chart renders no liveness probe and a rotated password never restarts the broker" }}
{{- end }}
{{- if ne (toString (dig "port" 8222 $monitor)) "8222" }}
{{- $rotation = append $rotation (printf "`nats.config.monitor.port` is %v, and the probe checks 127.0.0.1:8222" (dig "port" 8222 $monitor)) }}
{{- end }}
{{- if $rotation }}
{{- fail (printf "platform: the broker's liveness probe cannot work as configured: %s. The probe re-checks the password hash beside `/healthz` (ADR-0924); without it a credential rotation never restarts the broker." (join "; " $rotation)) }}
{{- end }}
{{- $lost := list }}
{{- $containerPatch := dig "container" "patch" list .Values.nats }}
{{- $podPatch := dig "podTemplate" "patch" list .Values.nats }}
{{- range $volume := (list "nats-auth-iam" "nats-auth-gateway") }}
{{- $mounted := false }}
{{- range $op := $containerPatch }}
{{- if and (kindIs "map" $op) (eq (toString $op.op) "add") (eq (toString $op.path) "/volumeMounts/-") (eq (toString (dig "name" "" ($op.value | default dict))) $volume) }}
{{- $mounted = true }}
{{- end }}
{{- end }}
{{- if not $mounted }}
{{- $lost = append $lost (printf "`nats.container.patch` does not mount %s" $volume) }}
{{- end }}
{{- $declared := false }}
{{- range $op := $podPatch }}
{{- if and (kindIs "map" $op) (eq (toString $op.op) "add") (eq (toString $op.path) "/spec/volumes/-") (eq (toString (dig "name" "" ($op.value | default dict))) $volume) }}
{{- $declared = true }}
{{- end }}
{{- end }}
{{- if not $declared }}
{{- $lost = append $lost (printf "`nats.podTemplate.patch` does not declare the volume %s" $volume) }}
{{- end }}
{{- end }}
{{- $removesHttpGet := false }}
{{- $addsExec := false }}
{{- range $op := $containerPatch }}
{{- if and (kindIs "map" $op) (eq (toString $op.op) "remove") (eq (toString $op.path) "/livenessProbe/httpGet") }}
{{- $removesHttpGet = true }}
{{- end }}
{{- if and (kindIs "map" $op) (eq (toString $op.op) "add") (eq (toString $op.path) "/livenessProbe/exec") (eq (toJson $op.value) (toJson (dict "command" (list "/bin/sh" "-c" (dict "$tplYaml" $natsLiveness))))) }}
{{- $addsExec = true }}
{{- end }}
{{- end }}
{{- if not (and $removesHttpGet $addsExec) }}
{{- $lost = append $lost "`nats.container.patch` does not swap the liveness probe for the hash-checking exec probe" }}
{{- end }}
{{- range $scheme := list (list "startup" $natsStartupScheme) (list "readiness" $natsReadinessScheme) }}
{{- $kept := false }}
{{- range $op := $containerPatch }}
{{- if eq (toJson $op) (toJson (dict "$tplYaml" (index $scheme 1))) }}
{{- $kept = true }}
{{- end }}
{{- end }}
{{- if not $kept }}
{{- $lost = append $lost (printf "`nats.container.patch` does not carry the chart's entry that moves the %s probe to HTTPS with TLS on" (index $scheme 0)) }}
{{- end }}
{{- end }}
{{- if $lost }}
{{- fail (printf "platform: the broker's credential-rotation wiring is incomplete: %s. Helm replaces a patch list whole, so copy the chart's own entries from its `values.yaml` into yours (ADR-0924)." (join "; " $lost)) }}
{{- end }}
{{- end }}{{/* end of the broker credential-rotation arms */}}

{{/*
THE BROKER'S MERGE KEYS (yaadgaar 169, ruled by Max 2026-11-02): THE WRAPPER AND
THE VOLUMES ARE THE CHART'S. The upstream chart mergeOverwrites
`nats.container.merge`, `nats.podTemplate.merge` and `nats.statefulSet.merge`
over the objects it renders, AFTER its own helpers have run, and a merge
REPLACES a list whole. So a merge key can undo every arm above without touching
a key those arms read. All three arms run while `nats.create` is true, at every
TLS posture.

ARM ONE, `nats.container.merge.command` AND `.args` ARE THE CHART'S OWN.
`values.yaml` puts the credential-rotation wrapper (ADR-0924) there, so the keys
cannot be refused outright: that would refuse every broker render. They must
equal the chart's own values, compared as JSON. `$natsWrapper` is a literal
copy of the wrapper, and `test_the_wrapper_literal_matches_values_yaml` pins it
to `values.yaml`, so the two cannot drift. Any other `command` or `args` starts
a broker that never hashes the passwords, or never reads `nats.conf`.

ARM TWO, THE REST OF `nats.container.merge` IS AN ALLOWLIST, by exact key
(Kubernetes field names are case-sensitive): `resources`, `securityContext`,
`terminationMessagePath` and `terminationMessagePolicy`. Each is harmless to
the arms above or fails loudly. Everything else is refused, and these are why:
`image` replaces the image after the `nats.image` helper, so it is past the
alpine arm; `volumeMounts` replaces the `config`, `pid`, `nats-tls` and
password mounts; `livenessProbe` drops the hash check; `env`, `envFrom`,
`ports`, `lifecycle` and the rest have their own upstream keys or belong to the
chart.

ARM THREE, NO VOLUMES THROUGH THE OTHER TWO MERGES. `nats.podTemplate.merge.spec`
must not set `volumes`, which replaces the pod's volumes, or `containers`,
`initContainers` and `ephemeralContainers`, which replace the lists that carry
the mounts. `nats.statefulSet.merge.spec` must not set `template`, the whole
pod template (`nats.podTemplate.merge` is the key for it), or
`volumeClaimTemplates`. The chart's own volumes and mounts go through the patch
keys, which the rotation arm above reads, so this refuses nothing the chart
writes.
*/}}
{{- if $natsCreate }}
{{- $natsWrapper := `set -eu
sha256sum /var/run/secrets/nats-auth/iam/password /var/run/secrets/nats-auth/gateway/password > /var/run/nats/auth.sha256
cr="$(printf '\r')"
nl="$(printf '\nx')"
nl="${nl%x}"
trimmed() {
  v="$(cat "$1")"
  while :; do
    case "$v" in
      *"$cr"|*"$nl") v="${v%?}" ;;
      *) break ;;
    esac
  done
  printf '%s' "$v"
}
NATS_PASSWORD="$(trimmed "/var/run/secrets/nats-auth/iam/password")"
NATS_PASSWORD_GATEWAY="$(trimmed "/var/run/secrets/nats-auth/gateway/password")"
[ -n "$NATS_PASSWORD" ] || { echo "nats: /var/run/secrets/nats-auth/iam/password is empty; refusing to start" >&2; exit 1; }
[ -n "$NATS_PASSWORD_GATEWAY" ] || { echo "nats: /var/run/secrets/nats-auth/gateway/password is empty; refusing to start" >&2; exit 1; }
export NATS_PASSWORD NATS_PASSWORD_GATEWAY
exec nats-server --config /etc/nats-config/nats.conf
` }}
{{- $mergeRefused := list }}
{{- $containerMerge := dig "container" "merge" dict .Values.nats }}
{{- if not (kindIs "map" $containerMerge) }}
{{- $mergeRefused = append $mergeRefused (printf "`nats.container.merge` is not a map (it is %s)" (kindOf $containerMerge)) }}
{{- else }}
{{- if ne (toJson (index $containerMerge "command")) (toJson (list "/bin/sh" "-c")) }}
{{- $mergeRefused = append $mergeRefused (printf "`nats.container.merge.command` is %s, not the chart's own [\"/bin/sh\",\"-c\"]: it runs the credential-rotation wrapper (ADR-0924)" (toJson (index $containerMerge "command"))) }}
{{- end }}
{{- if ne (toJson (index $containerMerge "args")) (toJson (list $natsWrapper)) }}
{{- $mergeRefused = append $mergeRefused "`nats.container.merge.args` is not the chart's own credential-rotation wrapper (ADR-0924): leave it unset, so the chart's `values.yaml` supplies it" }}
{{- end }}
{{- range $key := keys $containerMerge | sortAlpha }}
{{- if not (has $key (list "command" "args" "resources" "securityContext" "terminationMessagePath" "terminationMessagePolicy")) }}
{{- $mergeRefused = append $mergeRefused (printf "`nats.container.merge` sets the key %s: only `resources`, `securityContext`, `terminationMessagePath` and `terminationMessagePolicy` may be merged into the broker container, because a merge runs after the chart's own helpers and replaces a list whole" (toJson $key)) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $source := list (list "podTemplate" (list "volumes" "containers" "initContainers" "ephemeralContainers")) (list "statefulSet" (list "template" "volumeClaimTemplates")) }}
{{- $merge := dig (index $source 0) "merge" dict $.Values.nats }}
{{- if not (kindIs "map" $merge) }}
{{- $mergeRefused = append $mergeRefused (printf "`nats.%s.merge` is not a map (it is %s)" (index $source 0) (kindOf $merge)) }}
{{- else if hasKey $merge "spec" }}
{{- $spec := index $merge "spec" }}
{{- if not (kindIs "map" $spec) }}
{{- $mergeRefused = append $mergeRefused (printf "`nats.%s.merge.spec` is not a map (it is %s)" (index $source 0) (kindOf $spec)) }}
{{- else }}
{{- range $key := index $source 1 }}
{{- if hasKey $spec $key }}
{{- $mergeRefused = append $mergeRefused (printf "`nats.%s.merge.spec.%s` is set: a merge replaces that list whole, so it takes away the chart's own volumes or mounts" (index $source 0) $key) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if $mergeRefused }}
{{- fail (printf "platform: the broker's merge keys override what the chart owns: %s. Put a volume or a mount through the chart's patch keys, after the chart's own entries (ADR-0924, ADR-0852)." (join "; " $mergeRefused)) }}
{{- end }}
{{- end }}{{/* end of the broker merge-key arms */}}

{{/*
THE SCALARS THE UPSTREAM NATS CHART PRINTS UNQUOTED (yaadgaar 546), AND EACH IS
AN ALLOWLIST OF ITS KIND.

The upstream chart (2.14.6) renders `nats.conf`, the StatefulSet, its pod and
every other object it ships from `files/**.yaml` through `tpl` and then
`fromYaml`, and it prints many values raw: `port: {{ .port }}`. A newline in
such a value ends the scalar and writes a sibling key, which `fromYaml` parses
as the chart's own: `nats.config.nats.port: "4222\nallow_non_tls: true"`
rendered rc=0 with TLS required and put `"allow_non_tls": true` into nats.conf,
past every key-based arm above. YAML flow syntax (`{allow_non_tls: true}`)
re-types a value with no newline at all. `jetstream.yaml` wraps the three sizes
in its own `<< >>`, so `maxSize: "1Gi; allow_non_tls: true"` reached nats.conf as
raw text, where `;` starts another directive. And `nats.reloaderConfig` prints
every `cert_file`, `key_file` and `ca_file` of the rendered config raw into the
reloader's arguments, so those keys are judged at any depth under `nats.config`.

So a control-character refusal is not enough, and each value is held to an
ALLOWLIST instead: a whole number in its range (the whole-number arm's idiom),
a bool, a DNS-1123 name or label, an absolute path, a file name, an image
reference, tag, digest or pull policy, or a storage size, which must be a
string because helm reads a number as a float and the chart prints one of a
million or more as `1.073741824e+09` (measured). An absent value (null,
or an empty string) passes, because the upstream chart fills it from a default
of its own; a bool and a whole number have upstream defaults and must be
present. `kindIs` comes before `regexMatch`, which would otherwise stop on a Go
type error rather than this message.

`scripts/tests/test_nats_unquoted_values.py` owns what this arm does. Its
`SWEEP` is the list of every unquoted print in the vendored chart, by file and
line, with the paths this arm judges for it or the reason none can reach it;
the sweep re-runs over the vendored archive, so a chart bump that adds or moves
a print reddens it, and every path it names must appear in this arm. The
`reloader.image.*` prints are judged here too (yaadgaar 544): the reloader's
image goes through the same `nats.image` helper. A JSON patch and an adopter
`$tplYaml` are the patch arm's, below. Runs while `nats.create` is true, after
the arms above, so an image or a monitor port they refuse names itself there.
*/}}
{{- if $natsCreate }}
{{- $unquoted := list }}
{{- range $rule := list
      (list "nats.config.nats.port" 1 65535)
      (list "nats.config.monitor.port" 1 65535)
      (list "nats.config.profiling.port" 1 65535)
      (list "nats.config.leafnodes.port" 1 65535)
      (list "nats.config.websocket.port" 1 65535)
      (list "nats.config.mqtt.port" 1 65535)
      (list "nats.config.cluster.port" 1 65535)
      (list "nats.config.gateway.port" 1 65535)
      (list "nats.promExporter.port" 1 65535)
      (list "nats.config.cluster.replicas" 1 -1)
      (list "nats.podTemplate.terminationGracePeriodSeconds" 0 -1) }}
{{- $path := index $rule 0 }}
{{- $minimum := index $rule 1 }}
{{- $maximum := index $rule 2 }}
{{- $value := $.Values }}
{{- range $key := splitList "." $path }}
{{- if kindIs "map" $value }}{{ $value = index $value $key }}{{ else }}{{ $value = index (dict) "absent" }}{{ end }}
{{- end }}
{{- $whole := or (kindIs "int" $value) (kindIs "int64" $value)
      (and (kindIs "float64" $value) (eq (float64 (int64 $value)) $value))
      (and (kindIs "string" $value) (regexMatch `^(0|[1-9][0-9]{0,17})$` $value)) }}
{{- $range := ternary (printf "%d or more" $minimum) (printf "%d..%d" $minimum $maximum) (lt $maximum 0) }}
{{- if not $whole }}
{{- $unquoted = append $unquoted (printf "`%s` is %s, not a whole number in %s" $path (toJson $value) $range) }}
{{- else if or (lt (int64 $value) (int64 $minimum)) (and (ge $maximum 0) (gt (int64 $value) (int64 $maximum))) }}
{{- $unquoted = append $unquoted (printf "`%s` is %d, outside %s" $path (int64 $value) $range) }}
{{- end }}
{{- end }}
{{- $kinds := dict
      "name" `^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$`
      "label" `^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$`
      "host" `^[A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?(\.[A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?)*$`
      "path" `^/[A-Za-z0-9._/-]*$`
      "file" `^[A-Za-z0-9._][A-Za-z0-9._/-]*$`
      "image" `^[A-Za-z0-9]([A-Za-z0-9._/:@-]*[A-Za-z0-9])?$`
      "tag" `^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$`
      "digest" `^[a-z0-9]+([+._-][a-z0-9]+)*:[A-Fa-f0-9]{32,}$`
      "pullPolicy" `^(Always|IfNotPresent|Never)$`
      "size" `^(0|[1-9][0-9]{0,17})([KMGTPEkmgtpe](i?[Bb])?|[KMGTPEkmgtpe]i)?$` }}
{{- $described := dict
      "bool" "a bool (`true` or `false`, unquoted)"
      "name" "a DNS-1123 name (lowercase letters, digits, `-` and `.`)"
      "label" "a DNS-1123 label (lowercase letters, digits and `-`, at most 63)"
      "host" "a host name or an IPv4 address"
      "path" "an absolute path of letters, digits, `.`, `_`, `-` and `/`"
      "file" "a file name of letters, digits, `.`, `_`, `-` and `/`"
      "image" "an image reference of letters, digits, `.`, `_`, `-`, `/`, `:` and `@`"
      "tag" "an image tag (letters, digits, `_`, `.` and `-`, at most 128)"
      "digest" "an image digest such as `sha256:` and its hex"
      "pullPolicy" "`Always`, `IfNotPresent` or `Never`"
      "size" "a quoted size such as `\"10Gi\"`, `\"512M\"` or `\"1073741824\"` (a number of a million or more prints as `1.073741824e+09`)" }}
{{- range $rule := list
      (list "nats.config.cluster.noAdvertise" "bool")
      (list "nats.config.jetstream.memoryStore.maxSize" "size")
      (list "nats.config.jetstream.fileStore.maxSize" "size")
      (list "nats.config.jetstream.fileStore.pvc.size" "size")
      (list "nats.config.jetstream.fileStore.dir" "path")
      (list "nats.config.resolver.dir" "path")
      (list "nats.config.nats.tls.dir" "path") (list "nats.config.nats.tls.cert" "file") (list "nats.config.nats.tls.key" "file")
      (list "nats.config.leafnodes.tls.dir" "path") (list "nats.config.leafnodes.tls.cert" "file") (list "nats.config.leafnodes.tls.key" "file")
      (list "nats.config.websocket.tls.dir" "path") (list "nats.config.websocket.tls.cert" "file") (list "nats.config.websocket.tls.key" "file")
      (list "nats.config.mqtt.tls.dir" "path") (list "nats.config.mqtt.tls.cert" "file") (list "nats.config.mqtt.tls.key" "file")
      (list "nats.config.cluster.tls.dir" "path") (list "nats.config.cluster.tls.cert" "file") (list "nats.config.cluster.tls.key" "file")
      (list "nats.config.gateway.tls.dir" "path") (list "nats.config.gateway.tls.cert" "file") (list "nats.config.gateway.tls.key" "file")
      (list "nats.tlsCA.dir" "path") (list "nats.tlsCA.key" "file")
      (list "nats.configMap.name" "name")
      (list "nats.headlessService.name" "name")
      (list "nats.service.name" "name")
      (list "nats.statefulSet.name" "name")
      (list "nats.serviceAccount.name" "name")
      (list "nats.podDisruptionBudget.name" "name")
      (list "nats.promExporter.podMonitor.name" "name")
      (list "nats.config.websocket.ingress.name" "name")
      (list "nats.config.jetstream.fileStore.pvc.name" "name")
      (list "nats.config.resolver.pvc.name" "name")
      (list "nats.natsBox.contentsSecret.name" "name")
      (list "nats.natsBox.contextsSecret.name" "name")
      (list "nats.natsBox.deployment.name" "name")
      (list "nats.natsBox.serviceAccount.name" "name")
      (list "nats.config.cluster.routeURLs.k8sClusterDomain" "name")
      (list "nats.nameOverride" "label")
      (list "nats.fullnameOverride" "label")
      (list "nats.namespaceOverride" "label")
      (list "nats.promExporter.monitorDomain" "host")
      (list "nats.container.image.repository" "image") (list "nats.container.image.registry" "image")
      (list "nats.container.image.fullImageName" "image") (list "nats.container.image.tag" "tag")
      (list "nats.container.image.digest" "digest") (list "nats.container.image.pullPolicy" "pullPolicy")
      (list "nats.promExporter.image.repository" "image") (list "nats.promExporter.image.registry" "image")
      (list "nats.promExporter.image.fullImageName" "image") (list "nats.promExporter.image.tag" "tag")
      (list "nats.promExporter.image.digest" "digest") (list "nats.promExporter.image.pullPolicy" "pullPolicy")
      (list "nats.natsBox.container.image.repository" "image") (list "nats.natsBox.container.image.registry" "image")
      (list "nats.natsBox.container.image.fullImageName" "image") (list "nats.natsBox.container.image.tag" "tag")
      (list "nats.natsBox.container.image.digest" "digest") (list "nats.natsBox.container.image.pullPolicy" "pullPolicy")
      (list "nats.reloader.image.repository" "image") (list "nats.reloader.image.registry" "image")
      (list "nats.reloader.image.fullImageName" "image") (list "nats.reloader.image.tag" "tag")
      (list "nats.reloader.image.digest" "digest") (list "nats.reloader.image.pullPolicy" "pullPolicy")
      (list "global.image.registry" "image") (list "global.image.pullPolicy" "pullPolicy")
      (list "nats.global.image.registry" "image") (list "nats.global.image.pullPolicy" "pullPolicy") }}
{{- $path := index $rule 0 }}
{{- $kind := index $rule 1 }}
{{- $value := $.Values }}
{{- range $key := splitList "." $path }}
{{- if kindIs "map" $value }}{{ $value = index $value $key }}{{ else }}{{ $value = index (dict) "absent" }}{{ end }}
{{- end }}
{{- if eq $kind "bool" }}
{{- if not (kindIs "bool" $value) }}
{{- $unquoted = append $unquoted (printf "`%s` is %s, not %s" $path (toJson $value) (index $described $kind)) }}
{{- end }}
{{- else if or (kindIs "invalid" $value) (and (kindIs "string" $value) (eq $value "")) }}
{{- /* absent: the upstream chart fills it from its own default */ -}}
{{- else if not (and (kindIs "string" $value) (regexMatch (index $kinds $kind) $value)) }}
{{- $unquoted = append $unquoted (printf "`%s` is %s, not %s" $path (toJson $value) (index $described $kind)) }}
{{- end }}
{{- end }}
{{- $contexts := $.Values }}
{{- range $key := splitList "." "nats.natsBox.contexts" }}
{{- if kindIs "map" $contexts }}{{ $contexts = index $contexts $key }}{{ else }}{{ $contexts = index (dict) "absent" }}{{ end }}
{{- end }}
{{- if kindIs "map" $contexts }}
{{- range $key, $_ := $contexts }}
{{- if not (regexMatch `^[-._a-zA-Z0-9]+$` $key) }}
{{- $unquoted = append $unquoted (printf "`nats.natsBox.contexts` key %s is not a Secret key (letters, digits, `-`, `.` and `_`)" (toJson $key)) }}
{{- end }}
{{- end }}
{{- else if not (kindIs "invalid" $contexts) }}
{{- $unquoted = append $unquoted (printf "`nats.natsBox.contexts` is %s, not a map" (kindOf $contexts)) }}
{{- end }}
{{- /* cert_file|key_file|ca_file AT ANY DEPTH. `nats.reloaderConfig` matches each
key by exact name and prints its value raw, so each must be a string that is an
absolute path. They are read off `toRawJson`, where a key is a quoted string
followed by a colon: every such key, and those of them whose value is a string,
are counted, and a difference is a key whose value is not a string. */ -}}
{{- $configJson := toRawJson (dig "config" dict .Values.nats) }}
{{- $fileKeys := regexFindAll `"(?:cert_file|key_file|ca_file)":` $configJson -1 }}
{{- $fileStrings := regexFindAll `"(?:cert_file|key_file|ca_file)":"(?:[^"\\]|\\.)*"` $configJson -1 }}
{{- if ne (len $fileKeys) (len $fileStrings) }}
{{- $unquoted = append $unquoted "`nats.config` holds a `cert_file`, `key_file` or `ca_file` that is not a string" }}
{{- end }}
{{- range $found := $fileStrings }}
{{- range $key, $file := fromJson (printf "{%s}" $found) }}
{{- if not (regexMatch (index $kinds "path") $file) }}
{{- $unquoted = append $unquoted (printf "`nats.config` holds a `%s` of %s, not %s" $key (toJson $file) (index $described "path")) }}
{{- end }}
{{- end }}
{{- end }}
{{- if $unquoted }}
{{- fail (printf "platform: a value the upstream nats chart prints unquoted is not of its kind: %s. The chart prints each one raw into YAML it parses back, so a newline, a `;` inside its own `<< >>` or YAML flow syntax writes a key of its own into nats.conf or the broker's objects, past every check here (yaadgaar 546)." (join "; " $unquoted)) }}
{{- end }}
{{- end }}{{/* end of the unquoted-values arm */}}

{{/*
THE BROKER'S REMAINING MERGE ROUTES (yaadgaar 553): EACH IS AN ALLOWLIST.

The upstream chart (2.14.6) runs `nats.loadMergePatch` for every object it
renders: it mergeOverwrites the object's `merge` over the rendered object, then
applies its `patch`. The patch arm below refuses every adopter patch, and the
merge-key arms above hold `container`, `podTemplate` and `statefulSet` to their
lists, but every other merge reached the object unread. MEASURED rc=0 on main
abdbcbb with TLS required: `nats.promExporter.enabled: true` with
`merge.command` and a `volumeMounts` entry for `nats-auth-iam` mounted the broker
password into a container that runs any command, in a pod with
`shareProcessNamespace: true`. A `service.merge.spec` can retype the Service or
change its selector, a PVC merge can add a `dataSource`, and a Secret merge can
add `data`.

TWO SHAPES, by what the merge lands on, matched by exact key (Kubernetes field
names are case-sensitive):
  - A CONTAINER (`promExporter`, `natsBox.container`): the allowlist
    `nats.container.merge` uses, `resources`, `securityContext`,
    `terminationMessagePath` and `terminationMessagePolicy`.
  - AN OBJECT (every other site below, the nats-box pod template included):
    `metadata.labels` and `metadata.annotations` only, the allowlist
    `nats.configMap.merge` uses. A label or an annotation changes no field
    another check reads.
`nats.natsBox.contexts.<name>.merge` must be empty, by any name: it rewrites a
nats CLI context, which carries the URL and the credentials.

JUDGED WHATEVER THE OBJECT'S OWN `enabled` SAYS, as the patch arm judges every
patch: a merge waiting for a later `enabled: true` is the same route. The
`nats.conf` block merges (`config.<block>.merge` and `config.<block>.tls.merge`)
are NOT judged here: they write nats.conf rather than an object, and
`test_every_upstream_merge_is_judged_or_listed` names them as the open residual.
`test_the_arm_judges_every_object_merge` pins this list to the vendored chart.

Runs while `nats.create` is true, before the patch arm, so a `$tplYaml` inside
an allowed key still refuses there.
*/}}
{{- if $natsCreate }}
{{- $routeRefused := list }}
{{- $containerKeys := list "resources" "securityContext" "terminationMessagePath" "terminationMessagePolicy" }}
{{- range $rule := list
      (list "promExporter.merge" "container")
      (list "natsBox.container.merge" "container")
      (list "promExporter.podMonitor.merge" "object")
      (list "service.merge" "object")
      (list "headlessService.merge" "object")
      (list "serviceAccount.merge" "object")
      (list "podDisruptionBudget.merge" "object")
      (list "config.websocket.ingress.merge" "object")
      (list "config.jetstream.fileStore.pvc.merge" "object")
      (list "config.resolver.pvc.merge" "object")
      (list "natsBox.deployment.merge" "object")
      (list "natsBox.podTemplate.merge" "object")
      (list "natsBox.contextsSecret.merge" "object")
      (list "natsBox.contentsSecret.merge" "object")
      (list "natsBox.serviceAccount.merge" "object") }}
{{- $path := index $rule 0 }}
{{- $value := $.Values.nats }}
{{- range $key := splitList "." $path }}
{{- if kindIs "map" $value }}{{ $value = index $value $key }}{{ else }}{{ $value = index (dict) "absent" }}{{ end }}
{{- end }}
{{- if not (kindIs "invalid" $value) }}
{{- if not (kindIs "map" $value) }}
{{- $routeRefused = append $routeRefused (printf "`nats.%s` is not a map (it is %s)" $path (kindOf $value)) }}
{{- else if eq (index $rule 1) "container" }}
{{- range $key := keys $value | sortAlpha }}
{{- if not (has $key $containerKeys) }}
{{- $routeRefused = append $routeRefused (printf "`nats.%s` sets the key %s: only `resources`, `securityContext`, `terminationMessagePath` and `terminationMessagePolicy` may be merged into a container" $path (toJson $key)) }}
{{- end }}
{{- end }}
{{- else }}
{{- range $key := keys $value | sortAlpha }}
{{- if ne $key "metadata" }}
{{- $routeRefused = append $routeRefused (printf "`nats.%s` sets the key %s: only `metadata.labels` and `metadata.annotations` may be merged into this object" $path (toJson $key)) }}
{{- end }}
{{- end }}
{{- $metadata := index $value "metadata" }}
{{- if not (kindIs "invalid" $metadata) }}
{{- if not (kindIs "map" $metadata) }}
{{- $routeRefused = append $routeRefused (printf "`nats.%s.metadata` is not a map (it is %s)" $path (kindOf $metadata)) }}
{{- else }}
{{- range $key := keys $metadata | sortAlpha }}
{{- if not (has $key (list "labels" "annotations")) }}
{{- $routeRefused = append $routeRefused (printf "`nats.%s.metadata` sets the key %s: only `labels` and `annotations` may be merged" $path (toJson $key)) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $contexts := dig "natsBox" "contexts" dict .Values.nats }}
{{- if kindIs "map" $contexts }}
{{- range $name, $context := $contexts }}
{{- if and (kindIs "map" $context) (not (empty (index $context "merge"))) }}
{{- $routeRefused = append $routeRefused (printf "`nats.natsBox.contexts.%s.merge` is set" $name) }}
{{- end }}
{{- end }}
{{- end }}
{{- if $routeRefused }}
{{- fail (printf "platform: the broker's merge keys reach past what the chart checks: %s. A merge runs after the upstream chart has rendered the object and replaces what it names, so only the keys listed may be merged (yaadgaar 553)." (join "; " $routeRefused)) }}
{{- end }}
{{- end }}{{/* end of the object merge arm */}}

{{/*
THE BROKER'S JSON PATCHES (yaadgaar 544), ITS `$tplYaml` (yaadgaar 545) AND ITS
RELOADER: EACH IS THE CHART'S OWN.

The upstream chart (2.14.6) runs `nats.loadMergePatch` for every object it
renders and for every block of `nats.conf` (`files/config/config.yaml` lines
17, 28, 38, 48, 58, 68, 100 and 110): it mergeOverwrites the block's `merge`,
then applies its `patch`, a JSON patch. A patch PATH is a key written as a
string value, so no key-based arm above reads it. Measured at rc=0 with TLS
required before this arm: `nats.config.jetstream.patch` adding `/x$include` put
`include /dev/null; allow_non_tls: true;` into nats.conf; the same block adding
`/cert_file` with a newline put `- /etc/evil.conf` into the reloader's
arguments (`nats.reloaderConfig`); `nats.container.patch` with
`{op: replace, path: /args/0}` after the chart's own entries replaced the
credential-rotation wrapper (ADR-0924).

ARM ONE, EVERY PATCH LIST IS THE CHART'S OWN OR EMPTY, at both TLS postures.
`nats.config.patch`, `nats.container.patch` and `nats.podTemplate.patch` must
equal the chart's own lists, compared as JSON; every other patch the upstream
chart applies must be empty, the nats-box contexts included (by any name). NO
ALLOWLIST OF ADOPTER OPS IS OFFERED, and that is the fail-closed choice: a patch
is a route past the key-based arms that exist, and no adopter op has been shown
to need one. It does cost adopters something: a JSON patch can `remove` a field
or edit one list element in place, and a merge cannot. Most merge sites
(`service`, `headlessService`, `promExporter`, the PVCs, `natsBox.*` and more)
have no arm of their own, so this closes the patch route there and leaves the
merge route as it was. The literals below are built from the
`$tplYaml` literals above. `test_nats_patch_paths.py`'s `shipped` and
`chart-lists-copied` cases pin them to `values.yaml`: a drift on either side
refuses the chart's own render. `test_the_arm_judges_every_patch_the_upstream_chart_applies`
pins the path list to the vendored chart's `values.yaml`, so a chart bump that
adds a patch reddens it.

ARM TWO, THE RELOADER. `nats.reloader.merge` is held to the allowlist
`nats.container.merge` uses, minus `command` and `args` (the reloader has its
own and the chart owns them). `nats.reloader.natsVolumeMountPrefixes` must be
the upstream default `["/etc/"]`: a wider prefix copies the password mounts into
the reloader. A `null` there is refused too (yaadgaar 553): helm deletes the key
and the subchart default with it, so the reloader keeps only its `pid` mount,
loses `/etc/nats-config` and `/etc/nats-certs`, and never reloads a renewed
leaf. `nats.reloader.enabled` must be the bool `true`, for the same reason: the
reloader is what picks up a renewed leaf. `nats.reloader.env` must be empty: the
chart sets none, and an env entry can read any Secret in the namespace into a
container that shares the broker's process namespace. `nats.reloader.image.*` is
judged by the unquoted-values arm above.

ARM THREE, NO ADOPTER `$tplYaml`. The upstream chart resolves every
`$tplYaml` / `$tplYamlSpread` map in its values (`nats.defaultValues`, over the
whole subchart `.Values`, `global` included) after every check here has read
them, so such a key at any depth under `nats` or `global` refuses. The
exception is the chart's own four, counted at most once each and only where the
chart writes them: the one in `nats.config.patch` and the three in
`nats.container.patch`. The NATS TLS contract arm above refuses one under
`nats.config` first, in its own words.

Runs while `nats.create` is true, LAST of the broker arms, so a rotation-wiring
loss, a merge key or an unquoted value names itself first.
*/}}
{{- if $natsCreate }}
{{- $ownLiveness := dict "op" "add" "path" "/livenessProbe/exec" "value" (dict "command" (list "/bin/sh" "-c" (dict "$tplYaml" $natsLiveness))) }}
{{- $ownStartup := dict "$tplYaml" $natsStartupScheme }}
{{- $ownReadiness := dict "$tplYaml" $natsReadinessScheme }}
{{- $ownMonitor := dict "$tplYaml" $natsMonitorPatch }}
{{- $ownContainerPatch := list
      (dict "op" "add" "path" "/volumeMounts/-" "value" (dict "name" "nats-auth-iam" "mountPath" "/var/run/secrets/nats-auth/iam" "readOnly" true))
      (dict "op" "add" "path" "/volumeMounts/-" "value" (dict "name" "nats-auth-gateway" "mountPath" "/var/run/secrets/nats-auth/gateway" "readOnly" true))
      (dict "op" "remove" "path" "/livenessProbe/httpGet")
      $ownLiveness $ownStartup $ownReadiness }}
{{- $ownPodPatch := list
      (dict "op" "add" "path" "/spec/volumes/-" "value" (dict "name" "nats-auth-iam" "secret" (dict "secretName" "nats-auth" "items" (list (dict "key" "password" "path" "password")))))
      (dict "op" "add" "path" "/spec/volumes/-" "value" (dict "name" "nats-auth-gateway" "secret" (dict "secretName" "nats-auth-gateway" "items" (list (dict "key" "password" "path" "password"))))) }}
{{- $patchRefused := list }}
{{- range $rule := list
      (list "config.patch" (list $ownMonitor))
      (list "container.patch" $ownContainerPatch)
      (list "podTemplate.patch" $ownPodPatch)
      (list "config.nats.tls.patch" (list))
      (list "config.leafnodes.patch" (list)) (list "config.leafnodes.tls.patch" (list))
      (list "config.websocket.patch" (list)) (list "config.websocket.tls.patch" (list)) (list "config.websocket.ingress.patch" (list))
      (list "config.mqtt.patch" (list)) (list "config.mqtt.tls.patch" (list))
      (list "config.cluster.patch" (list)) (list "config.cluster.tls.patch" (list))
      (list "config.gateway.patch" (list)) (list "config.gateway.tls.patch" (list))
      (list "config.jetstream.patch" (list)) (list "config.jetstream.fileStore.pvc.patch" (list))
      (list "config.resolver.patch" (list)) (list "config.resolver.pvc.patch" (list))
      (list "statefulSet.patch" (list))
      (list "reloader.patch" (list))
      (list "promExporter.patch" (list)) (list "promExporter.podMonitor.patch" (list))
      (list "service.patch" (list))
      (list "headlessService.patch" (list))
      (list "configMap.patch" (list))
      (list "serviceAccount.patch" (list))
      (list "podDisruptionBudget.patch" (list))
      (list "natsBox.container.patch" (list)) (list "natsBox.deployment.patch" (list)) (list "natsBox.podTemplate.patch" (list))
      (list "natsBox.contextsSecret.patch" (list)) (list "natsBox.contentsSecret.patch" (list)) (list "natsBox.serviceAccount.patch" (list)) }}
{{- $path := index $rule 0 }}
{{- $own := index $rule 1 }}
{{- $value := $.Values.nats }}
{{- range $key := splitList "." $path }}
{{- if kindIs "map" $value }}{{ $value = index $value $key }}{{ else }}{{ $value = index (dict) "absent" }}{{ end }}
{{- end }}
{{- if $own }}
{{- if ne (toJson $value) (toJson $own) }}
{{- $patchRefused = append $patchRefused (printf "`nats.%s` is not the chart's own list: leave it unset, so the chart's `values.yaml` supplies it" $path) }}
{{- end }}
{{- else if not (empty $value) }}
{{- $patchRefused = append $patchRefused (printf "`nats.%s` is set" $path) }}
{{- end }}
{{- end }}
{{- $contexts := dig "natsBox" "contexts" dict .Values.nats }}
{{- if kindIs "map" $contexts }}
{{- range $name, $context := $contexts }}
{{- if and (kindIs "map" $context) (not (empty (index $context "patch"))) }}
{{- $patchRefused = append $patchRefused (printf "`nats.natsBox.contexts.%s.patch` is set" $name) }}
{{- end }}
{{- end }}
{{- end }}
{{- $reloaderMerge := dig "reloader" "merge" dict .Values.nats }}
{{- if not (kindIs "map" $reloaderMerge) }}
{{- $patchRefused = append $patchRefused (printf "`nats.reloader.merge` is not a map (it is %s)" (kindOf $reloaderMerge)) }}
{{- else }}
{{- range $key := keys $reloaderMerge | sortAlpha }}
{{- if not (has $key (list "resources" "securityContext" "terminationMessagePath" "terminationMessagePolicy")) }}
{{- $patchRefused = append $patchRefused (printf "`nats.reloader.merge` sets the key %s: only `resources`, `securityContext`, `terminationMessagePath` and `terminationMessagePolicy` may be merged into the reloader, because a merge runs after the upstream chart has written its arguments and mounts" (toJson $key)) }}
{{- end }}
{{- end }}
{{- end }}
{{- $reloader := index .Values.nats "reloader" | default dict }}
{{- $prefixes := index (dict) "absent" }}
{{- if kindIs "map" $reloader }}{{ $prefixes = index $reloader "natsVolumeMountPrefixes" }}{{ end }}
{{- if kindIs "invalid" $prefixes }}
{{- $patchRefused = append $patchRefused "`nats.reloader.natsVolumeMountPrefixes` is null: helm deletes the key and the upstream default [\"/etc/\"] with it, so the reloader loses the config and certificate mounts and never reloads a renewed leaf. Delete the line instead" }}
{{- else if ne (toJson $prefixes) (toJson (list "/etc/")) }}
{{- $patchRefused = append $patchRefused (printf "`nats.reloader.natsVolumeMountPrefixes` is %s, not the upstream [\"/etc/\"]: a wider prefix copies the broker's password mounts into the reloader" (toJson $prefixes)) }}
{{- end }}
{{- $reloaderEnabled := index (dict) "absent" }}
{{- if kindIs "map" $reloader }}{{ $reloaderEnabled = index $reloader "enabled" }}{{ end }}
{{- if not (and (kindIs "bool" $reloaderEnabled) $reloaderEnabled) }}
{{- $patchRefused = append $patchRefused (printf "`nats.reloader.enabled` is %s, not the bool true: the reloader is what loads a renewed TLS leaf into the running broker" (ternary "null" (toJson $reloaderEnabled) (kindIs "invalid" $reloaderEnabled))) }}
{{- end }}
{{- $reloaderEnv := index (dict) "absent" }}
{{- if kindIs "map" $reloader }}{{ $reloaderEnv = index $reloader "env" }}{{ end }}
{{- if not (empty $reloaderEnv) }}
{{- $patchRefused = append $patchRefused "`nats.reloader.env` is set: the chart sets no reloader environment, and an entry can read a Secret into a container that shares the broker's process namespace" }}
{{- end }}
{{- /* Helm copies the parent's `global` into `nats.global` as well, so the two
are counted apart and the larger counts once: a key in both is one key. */ -}}
{{- $tplPattern := `"\$tplYaml(?:Spread)?":` }}
{{- $tplKeys := len (regexFindAll $tplPattern (toRawJson (omit .Values.nats "global")) -1) }}
{{- $tplKeys = add $tplKeys (max (len (regexFindAll $tplPattern (toRawJson (index .Values.nats "global" | default dict)) -1)) (len (regexFindAll $tplPattern (toRawJson (.Values.global | default dict)) -1))) }}
{{- $ownTplKeys := 0 }}
{{- range $own := list (list "config" $ownMonitor 1) (list "container" $ownLiveness 1) (list "container" $ownStartup 1) (list "container" $ownReadiness 1) }}
{{- $found := false }}
{{- $list := dig (index $own 0) "patch" list $.Values.nats }}
{{- if kindIs "slice" $list }}
{{- range $entry := $list }}
{{- if eq (toJson $entry) (toJson (index $own 1)) }}{{ $found = true }}{{ end }}
{{- end }}
{{- end }}
{{- if $found }}{{ $ownTplKeys = add $ownTplKeys (index $own 2) }}{{ end }}
{{- end }}
{{- if gt $tplKeys $ownTplKeys }}
{{- $patchRefused = append $patchRefused (printf "`nats` and `global` hold %d `$tplYaml` or `$tplYamlSpread` key(s) that are not the chart's own: the upstream chart resolves them after every check here, so they can build a patch, a mount, an argument or a raw string none of them sees. Write the value plainly" (sub $tplKeys $ownTplKeys)) }}
{{- end }}
{{- if $patchRefused }}
{{- fail (printf "platform: the broker's JSON patches, `$tplYaml` or reloader keys are not the chart's own: %s. A JSON patch path, a `$tplYaml` and a reloader key are each a route past every check here (yaadgaar 544, 545): put a value through its merge key, which the checks read, and leave the chart's own lists as `values.yaml` writes them." (join "; " $patchRefused)) }}
{{- end }}
{{- end }}{{/* end of the patch arm */}}

{{/*
VALKEY'S OWN GUARD (B-V2, ADR-0852), MIRRORING NATS'S ABSENCE ARM ABOVE.
`valkey.tls.enabled`, `valkey.tls.clientAuth` and `valkey.tls.plaintext` are
this chart's own keys, REQUIRED WITH NO DEFAULT while `valkey.create` is true
(ADR-0845, ADR-0854) — exactly like `nats.tls`, so neither key is written in
`values.yaml`. Each of the three absent refuses, naming it, with the off
posture to write. ABSENT MEANS MISSING *OR* EXPLICITLY `null`: a key present
with a `null` value still has `hasKey` answer true, so this checks the KIND of
the value too — `kindOf` on a nil interface is `"invalid"` — rather than
trusting `hasKey` alone the way the NATS arm above does, because a `null`
override says exactly as little about the posture as a missing key.

`enabled: false` together with `plaintext: false` is refused too, once all
three are present: it leaves the cache with no network listener at all, the
unix socket aside.
*/}}
{{- $valkeyCreate := and (kindIs "map" .Values.valkey) (kindIs "bool" (index .Values.valkey "create")) (index .Values.valkey "create") }}
{{- if $valkeyCreate }}
{{- $valkeyTls := index .Values.valkey "tls" | default dict }}
{{- $valkeyAbsent := list }}
{{- range $key := (list "enabled" "clientAuth" "plaintext") }}
{{- $present := and (hasKey $valkeyTls $key) (ne (kindOf (index $valkeyTls $key)) "invalid") }}
{{- if not $present }}
{{- $valkeyAbsent = append $valkeyAbsent (printf "`valkey.tls.%s`" $key) }}
{{- end }}
{{- end }}
{{- if $valkeyAbsent }}
{{- fail (printf (join "" (list
      "platform: valkey.create is true and %s %s absent (missing, or explicitly null). "
      "The cache's TLS switch, its client-certificate mode and its plaintext switch have no default (ADR-0845, ADR-0854): "
      "only these keys say what you run, so all three must be written explicitly. "
      "Write `valkey.tls.enabled: false`, `valkey.tls.clientAuth: \"off\"` and `valkey.tls.plaintext: true` for a plaintext cache, or the TLS posture you run."))
      (join " and " $valkeyAbsent) (ternary "is" "are" (eq (len $valkeyAbsent) 1))) }}
{{- end }}
{{- $valkeyEnabled := index $valkeyTls "enabled" }}
{{- $valkeyPlaintext := index $valkeyTls "plaintext" }}
{{- if and (kindIs "bool" $valkeyEnabled) (kindIs "bool" $valkeyPlaintext) (not $valkeyEnabled) (not $valkeyPlaintext) }}
{{- fail "platform: valkey.tls.enabled: false and valkey.tls.plaintext: false together leave the cache with no network listener at all but the unix socket: turn one on." }}
{{- end }}
{{- end }}{{/* end of the valkey contract arms */}}

{{/*
EVERY INTERNAL LEAF NAMES EXACTLY ONE DIRECTION (yaadgaar 279, ADR-0852).

`templates/certificates.yaml` renders each `certificates.leaves.<name>.usages`
verbatim. One authority signs every leaf here and every server requires a
client leaf, so the extended key usage is the only thing that stops a stolen
serving leaf being presented as a client, or the reverse. A leaf that names
NEITHER `server auth` nor `client auth` is issued with no extended key usage,
which webpki accepts in BOTH directions; one naming BOTH is the same hole by
another route; `any` (anyExtendedKeyUsage) grants both whatever else is named.
`scripts/tests/test_certificate_usages.py` holds the same rule over this
repository's own values; this arm holds it over an adopter's. A `usages` that is
not a list is refused here and not in the schema, because types live here
(ADR-0847). Matching is exact: cert-manager's enum is lowercase.

EVERY ELEMENT IS A STRING FROM CERT-MANAGER'S ENUM. The `has` checks below match
whole elements, so an element that is not one of the enum's values could carry
a second item: `"digital signature\n    - client auth"` used to render as two
list items, the second a direction these checks never saw. `certificates.yaml`
now YAML-encodes the list as well, so such a string stays one scalar.

UNCONDITIONAL, ROOT AND SUBCHART: no parent carries an equivalent, so standing
down would defer to nobody (ADR-0794). Every leaf is judged before the one
`fail`, so all of them are named at once.
*/}}
{{- /* CERT-MANAGER v1.21.1's `KeyUsage` ENUM, all twenty-three values, copied from
the vendored `charts/cert-manager-v1.21.1.tgz`,
`templates/crd-cert-manager.io_certificates.yaml` lines 710-733
(`spec.usages.items.enum`). Declared outside the arm's `if` because the edge
usages arm below reads it too, and a template variable lives only inside the
block that declares it. */ -}}
{{- $keyUsages := list
      "signing" "digital signature" "content commitment" "key encipherment"
      "key agreement" "data encipherment" "cert sign" "crl sign" "encipher only"
      "decipher only" "any" "server auth" "client auth" "code signing"
      "email protection" "s/mime" "ipsec end system" "ipsec tunnel" "ipsec user"
      "timestamping" "ocsp signing" "microsoft sgc" "netscape sgc" }}
{{- if .Values.certificates.create }}
{{- $leafUsages := list }}
{{- range $name, $leaf := .Values.certificates.leaves }}
{{- $usages := index dict "usages" }}
{{- if kindIs "map" $leaf }}{{ $usages = index $leaf "usages" }}{{ end }}
{{- if not (kindIs "slice" $usages) }}
{{- $kind := kindOf $usages }}
{{- if eq $kind "invalid" }}{{ $kind = "absent or null" }}{{ end }}
{{- $leafUsages = append $leafUsages (printf "`certificates.leaves.%s.usages` is not a list (it is %s)" $name $kind) }}
{{- else }}
{{- range $index, $usage := $usages }}
{{- if not (kindIs "string" $usage) }}
{{- $elementKind := kindOf $usage }}
{{- if eq $elementKind "invalid" }}{{ $elementKind = "null" }}{{ end }}
{{- $leafUsages = append $leafUsages (printf "`certificates.leaves.%s.usages` element %d is not a string (it is %s)" $name $index $elementKind) }}
{{- else if not (has $usage $keyUsages) }}
{{- $leafUsages = append $leafUsages (printf "`certificates.leaves.%s.usages` element %d, %q, is not a cert-manager KeyUsage" $name $index $usage) }}
{{- end }}
{{- end }}
{{- $serves := has "server auth" $usages }}
{{- $dials := has "client auth" $usages }}
{{- if has "any" $usages }}
{{- $leafUsages = append $leafUsages (printf "`certificates.leaves.%s.usages` names `any`, which every verifier accepts in both directions" $name) }}
{{- end }}
{{- if and $serves $dials }}
{{- $leafUsages = append $leafUsages (printf "`certificates.leaves.%s.usages` names both `server auth` and `client auth`, so the leaf works in both directions" $name) }}
{{- else if not (or $serves $dials) }}
{{- $leafUsages = append $leafUsages (printf "`certificates.leaves.%s.usages` names neither `server auth` nor `client auth` (it is %v), so cert-manager issues it with no extended key usage, which is accepted in both directions" $name $usages) }}
{{- end }}
{{- end }}
{{- end }}
{{- if $leafUsages }}
{{- fail (printf "platform: a certificates.leaves entry does not name exactly one direction: %s. Name exactly one of `server auth` (a leaf that answers) or `client auth` (a leaf that dials), beside `digital signature` (ADR-0852)." (join "; " $leafUsages)) }}
{{- end }}
{{- end }}{{/* end of the leaf usages arm */}}

{{/*
EVERY VALUE THIS CHART PRINTS IS ONE LINE OF TEXT (yaadgaar 534, 537 and 541,
ADR-0852).

`certificates.yaml`, `edge-certificate.yaml`, `internal-ca.yaml` and the
Gateway listener printed their values raw, so a newline ended the scalar and
wrote a sibling key into `spec` — or, with a line starting `---`, a whole new
document. Helm keeps the last of two equal keys, so `isCA: true` landed on a
leaf the internal CA signs: a sub-CA that can mint any leaf in the estate. The
templates now YAML-encode every one of these values; this arm refuses the
payload outright, so it never reaches them.

WHAT IS JUDGED. The names — each leaf's `commonName` and the edge's resolved
`commonName` and `dnsNames` — must also be strings. Every other value is judged
only when it is a string, since a number (`privateKey.size`) carries no line:
each leaf's map key and `renewBefore`, `certificates.duration`,
`certificates.privateKey.*`, `certificates.issuerRef.*`, the edge's `name`,
`duration`, `renewBefore`, `privateKey.*` and `issuerRef.*`, every
`internalCA` key the CA templates print, and the Gateway's resolved
`gatewayListener.hostname`. Since yaadgaar 541 also every other value a template
prints where `toYaml` cannot go — a shell script, a JSON body, a `squote`d
string — and the eight numbers printed through `int`, which the whole-number arm
below also holds to a range; the list is below, and
`scripts/tests/test_raw_prints.py` is the lint gate that keeps every print in
`templates/` encoded or on its allowlist.

A CONTROL CHARACTER IS ANY OF `\p{Cc}`, `\p{Zl}` OR `\p{Zp}`. YAML 1.1, which
helm parses, breaks a line at NEL (U+0085), U+2028 and U+2029 as well as at
`\n` and `\r`, and no DNS name or common name carries any of them.

THE EDGE IS JUDGED ON WHAT IT RESOLVES TO, not on the two keys alone: an empty
`edgeTLS.commonName` or `edgeTLS.dnsNames` falls back to `global.hostname`
(ADR-0808), which reached the same lines.

A name that is not a string is refused here rather than in the schema, because
types live here (ADR-0847), and `kindIs` comes before `regexMatch`, which would
otherwise stop on a Go type error rather than this message. UNCONDITIONAL, ROOT
AND SUBCHART, for the leaf usages arm's reason. Every name is judged before the
one `fail`.
*/}}
{{- $controlCharacter := `[\p{Cc}\p{Zl}\p{Zp}]` }}
{{- $badNames := list }}
{{- if .Values.certificates.create }}
{{- range $name, $leaf := .Values.certificates.leaves }}
{{- $commonName := "" }}
{{- if kindIs "map" $leaf }}{{ $commonName = index $leaf "commonName" }}{{ end }}
{{- if not (kindIs "string" $commonName) }}
{{- $badNames = append $badNames (printf "`certificates.leaves.%s.commonName` is not a string (it is %s)" $name (kindOf $commonName)) }}
{{- else if regexMatch $controlCharacter $commonName }}
{{- $badNames = append $badNames (printf "`certificates.leaves.%s.commonName` carries a control character (%q); it is also every one of that leaf's `dnsNames`" $name $commonName) }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.edgeTLS.create }}
{{- $edgeCommonName := include "platform.hostname" (dict "local" .Values.edgeTLS.commonName "context" $) }}
{{- if regexMatch $controlCharacter $edgeCommonName }}
{{- $badNames = append $badNames (printf "`edgeTLS.commonName`, or the `global.hostname` it falls back to, carries a control character (%q)" $edgeCommonName) }}
{{- end }}
{{- $edgeDnsNames := .Values.edgeTLS.dnsNames | default (list (include "platform.hostname" (dict "local" "" "context" $))) }}
{{- if not (kindIs "slice" $edgeDnsNames) }}
{{- $badNames = append $badNames (printf "`edgeTLS.dnsNames` is not a list (it is %s)" (kindOf $edgeDnsNames)) }}
{{- else }}
{{- range $index, $dnsName := $edgeDnsNames }}
{{- if not (kindIs "string" $dnsName) }}
{{- $badNames = append $badNames (printf "`edgeTLS.dnsNames` element %d is not a string (it is %s)" $index (kindOf $dnsName)) }}
{{- else if regexMatch $controlCharacter $dnsName }}
{{- $badNames = append $badNames (printf "`edgeTLS.dnsNames` element %d, or the `global.hostname` it falls back to, carries a control character (%q)" $index $dnsName) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $lines := list }}
{{- if .Values.certificates.create }}
{{- $certificates := .Values.certificates }}
{{- range $name, $leaf := $certificates.leaves }}
{{- $lines = append $lines (list (printf "the `certificates.leaves` key %q" $name) $name) }}
{{- if kindIs "map" $leaf }}
{{- $lines = append $lines (list (printf "`certificates.leaves.%s.renewBefore`" $name) (index $leaf "renewBefore")) }}
{{- end }}
{{- end }}
{{- $lines = append $lines (list "`certificates.duration`" $certificates.duration) }}
{{- range $key, $value := ($certificates.privateKey | default dict) }}
{{- $lines = append $lines (list (printf "`certificates.privateKey.%s`" $key) $value) }}
{{- end }}
{{- range $key, $value := ($certificates.issuerRef | default dict) }}
{{- $lines = append $lines (list (printf "`certificates.issuerRef.%s`" $key) $value) }}
{{- end }}
{{- end }}
{{- if .Values.edgeTLS.create }}
{{- $edge := .Values.edgeTLS }}
{{- range $key := list "name" "duration" "renewBefore" }}
{{- $lines = append $lines (list (printf "`edgeTLS.%s`" $key) (index $edge $key)) }}
{{- end }}
{{- range $key, $value := ($edge.privateKey | default dict) }}
{{- $lines = append $lines (list (printf "`edgeTLS.privateKey.%s`" $key) $value) }}
{{- end }}
{{- range $key, $value := ($edge.issuerRef | default dict) }}
{{- $lines = append $lines (list (printf "`edgeTLS.issuerRef.%s`" $key) $value) }}
{{- end }}
{{- end }}
{{- if or .Values.edgeTLS.create .Values.internalCA.create }}
{{- $ca := .Values.internalCA }}
{{- range $key := list "name" "selfSignedIssuerName" "commonName" "duration" "renewBefore" }}
{{- $lines = append $lines (list (printf "`internalCA.%s`" $key) (index $ca $key)) }}
{{- end }}
{{- range $key, $value := ($ca.privateKey | default dict) }}
{{- $lines = append $lines (list (printf "`internalCA.privateKey.%s`" $key) $value) }}
{{- end }}
{{- end }}
{{- if .Values.gatewayListener.create }}
{{- $lines = append $lines (list "`gatewayListener.hostname`, or the `global.hostname` it falls back to," (include "platform.hostname" (dict "local" .Values.gatewayListener.hostname "context" $))) }}
{{- end }}
{{- /* EVERY OTHER VALUE A TEMPLATE PRINTS WHERE `toYaml` CANNOT GO, or prints
through `int` (yaadgaar 541): into a shell script, a JSON body or a `squote`d
string, or as a number. This arm refuses only a control character in them; that
a number is a whole number in range is the next arm's question. Judged whatever the
toggles say, because a value nothing renders yet still never needs a line
break. `scripts/tests/test_raw_prints.py` holds the templates to this list. */ -}}
{{- range $path := list
      "gatewayListener.className" "gatewayListener.controllerName"
      "gatewayListener.gatewayName" "gatewayListener.certificateSecretName"
      "gatewayListener.envoyProxy.name" "gatewayListener.envoyProxy.serviceType"
      "gatewayListener.envoyProxy.replicas" "gatewayListener.envoyProxy.httpsNodePort"
      "valkey.name" "valkey.image" "valkey.port" "valkey.maxmemory" "valkey.maxmemoryPolicy"
      "valkey.passwordSecret.name" "valkey.passwordSecret.key"
      "bootstrap.serviceAccountName" "bootstrap.image" "bootstrap.backoffLimit"
      "bootstrap.adminToken.secretName"
      "preflight.serviceAccountName" "preflight.image" "preflight.probeName"
      "preflight.backoffLimit" "preflight.timeoutSeconds" "preflight.pollSeconds"
      "preflight.certManager.apiVersion" "preflight.keda.apiVersion"
      "preflight.mariadb.apiVersion" "preflight.mariadb.deniedBy"
      "preflight.mariadb.validationMessage" "preflight.mariadb.unreachableWebhook"
      "preflight.prometheus.address" "preflight.prometheus.readyMessage"
      "preflight.envoyGateway.apiVersion" "preflight.envoyGateway.programmedMessage"
      "preflight.envoyGateway.serviceAccountName" "preflight.envoyGateway.probeName"
      "preflight.envoyGateway.timeoutSeconds"
      "prometheus.forceNamespace" }}
{{- $node := $.Values }}
{{- range $key := splitList "." $path }}
{{- if kindIs "map" $node }}{{ $node = index $node $key }}{{ else }}{{ $node = "" }}{{ end }}
{{- end }}
{{- $lines = append $lines (list (printf "`%s`" $path) $node) }}
{{- end }}
{{- range $line := $lines }}
{{- $value := index $line 1 }}
{{- if and (kindIs "string" $value) (regexMatch $controlCharacter $value) }}
{{- $badNames = append $badNames (printf "%s carries a control character (%q)" (index $line 0) $value) }}
{{- end }}
{{- end }}
{{- if $badNames }}
{{- fail (printf "platform: a value this chart prints is not one line of text: %s. Each is a string with no newline or other control character in it." (join "; " $badNames)) }}
{{- end }}{{/* end of the one-line values arm */}}

{{/*
EVERY NUMBER A TEMPLATE PRINTS THROUGH `int` IS A WHOLE NUMBER IN ITS RANGE
(yaadgaar 541), in the idiom the module charts use (gateway#174, task#120).

`| int` keeps a value one scalar, and it also turns anything that is not a
number into 0, or truncates it, at rc=0: `replicas: "abc"`, `null` and `1.5`
rendered `replicas: 0`, `0` and `1`; `httpsNodePort: "x"` nodePort 0;
`valkey.port: "x"` port 0 and `--port 0`. Printed raw, the API server used to
refuse such a value loudly. This arm restores that refusal at render time.

A WHOLE NUMBER is an `int`/`int64`, a `float64` with no fraction (helm reads
every number in a values file as one), or a string of decimal digits with no
sign and no leading zero, at most eighteen of them so `int64` cannot overflow.
`true`, a list, a map and `null` are not, except `httpsNodePort: null`, the
shipped "let Kubernetes choose".

THESE EIGHT ARE EVERY VALUES PATH BEHIND AN `int` PRINT. Every other `int` print
is a literal (`platform.hookRequest.*`, `platform.hookDeadline.*`, the request
counts), a counter the template keeps (`$loops`, `$objects`, `len $probes`), or
arithmetic on these eight (`$deadline`, `$grace`, `$backoff`, `$total`, the
`add`/`mul` prints). `scripts/tests/test_raw_prints.py` owns what this arm does.
*/}}
{{- $badNumbers := list }}
{{- range $rule := list
      (list "gatewayListener.envoyProxy.replicas" 1 -1 false)
      (list "gatewayListener.envoyProxy.httpsNodePort" 30000 32767 true)
      (list "valkey.port" 1 65535 false)
      (list "bootstrap.backoffLimit" 0 -1 false)
      (list "preflight.backoffLimit" 0 -1 false)
      (list "preflight.timeoutSeconds" 1 -1 false)
      (list "preflight.pollSeconds" 1 -1 false)
      (list "preflight.envoyGateway.timeoutSeconds" 1 -1 false) }}
{{- $path := index $rule 0 }}
{{- $minimum := index $rule 1 }}
{{- $maximum := index $rule 2 }}
{{- $value := $.Values }}
{{- range $key := splitList "." $path }}
{{- if kindIs "map" $value }}{{ $value = index $value $key }}{{ else }}{{ $value = index (dict) "absent" }}{{ end }}
{{- end }}
{{- if not (and (index $rule 3) (kindIs "invalid" $value)) }}
{{- $whole := or (kindIs "int" $value) (kindIs "int64" $value)
      (and (kindIs "float64" $value) (eq (float64 (int64 $value)) $value))
      (and (kindIs "string" $value) (regexMatch `^(0|[1-9][0-9]{0,17})$` $value)) }}
{{- $range := ternary (printf "%d or more" $minimum) (printf "%d..%d" $minimum $maximum) (lt $maximum 0) }}
{{- if not $whole }}
{{- $badNumbers = append $badNumbers (printf "`%s` is %s (%s), not a whole number" $path (toJson $value) (ternary "null" (kindOf $value) (kindIs "invalid" $value))) }}
{{- else if or (lt (int64 $value) (int64 $minimum)) (and (ge $maximum 0) (gt (int64 $value) (int64 $maximum))) }}
{{- $badNumbers = append $badNumbers (printf "`%s` is %d, outside %s" $path (int64 $value) $range) }}
{{- end }}
{{- end }}
{{- end }}
{{- if $badNumbers }}
{{- fail (printf "platform: a number this chart prints is not a whole number in its range: %s. Each is printed through `int`, which would render it as 0 or truncate it rather than refuse it." (join "; " $badNumbers)) }}
{{- end }}{{/* end of the whole-number arm */}}

{{/*
THE EDGE LEAF SERVES, AND ONLY SERVES (yaadgaar 534, ADR-0852).

`edge-certificate.yaml` printed each `edgeTLS.usages` element raw, so
`"digital signature\n    - client auth"` rendered as two list items, the second
a direction nothing judged — the same hole yaadgaar 279 closed for the internal
leaves. The template now YAML-encodes the list, and this arm holds each element
to the enum above, as the leaf usages arm does.

STRICTER THAN THE LEAF RULE, ON PURPOSE. A leaf names exactly one direction,
either one. The edge leaf is the Gateway's serving certificate, so its one
direction is `server auth`: `[client auth]` names exactly one direction and is
still a client credential the internal CA signs whenever `edgeTLS.issuerRef`
falls back to it. `client auth` is refused even beside `server auth`, and `any`
for the reason it is refused on a leaf.
*/}}
{{- if .Values.edgeTLS.create }}
{{- $edgeUsages := .Values.edgeTLS.usages }}
{{- $badEdgeUsages := list }}
{{- if not (kindIs "slice" $edgeUsages) }}
{{- $kind := kindOf $edgeUsages }}
{{- if eq $kind "invalid" }}{{ $kind = "absent or null" }}{{ end }}
{{- $badEdgeUsages = append $badEdgeUsages (printf "it is not a list (it is %s)" $kind) }}
{{- else }}
{{- range $index, $usage := $edgeUsages }}
{{- if not (kindIs "string" $usage) }}
{{- $elementKind := kindOf $usage }}
{{- if eq $elementKind "invalid" }}{{ $elementKind = "null" }}{{ end }}
{{- $badEdgeUsages = append $badEdgeUsages (printf "element %d is not a string (it is %s)" $index $elementKind) }}
{{- else if not (has $usage $keyUsages) }}
{{- $badEdgeUsages = append $badEdgeUsages (printf "element %d, %q, is not a cert-manager KeyUsage" $index $usage) }}
{{- end }}
{{- end }}
{{- if has "client auth" $edgeUsages }}
{{- $badEdgeUsages = append $badEdgeUsages "it names `client auth`, which makes the edge leaf a client credential" }}
{{- end }}
{{- if has "any" $edgeUsages }}
{{- $badEdgeUsages = append $badEdgeUsages "it names `any`, which every verifier accepts in both directions" }}
{{- end }}
{{- if not (has "server auth" $edgeUsages) }}
{{- $badEdgeUsages = append $badEdgeUsages (printf "it does not name `server auth` (it is %v)" $edgeUsages) }}
{{- end }}
{{- end }}
{{- if $badEdgeUsages }}
{{- fail (printf "platform: `edgeTLS.usages` does not name the one direction an edge leaf serves: %s. Name `server auth`, and neither `client auth` nor `any` (ADR-0852)." (join "; " $badEdgeUsages)) }}
{{- end }}
{{- end }}{{/* end of the edge usages arm */}}

{{/*
EVERY CERTIFICATE THIS CHART RENDERS, PARSED BACK AND JUDGED (yaadgaar 534).

THE ARMS ABOVE JUDGE VALUES; THIS ONE JUDGES OBJECTS. It is the second wall
behind the encoding and the one-line values arm, for a template edit or a value
path neither of them anticipated. Before yaadgaar 537 every other scalar under
`spec` printed raw: `certificates.issuerRef.name` prints AFTER `usages`, so a
newline there wrote a second `usages` that won over the one the leaf usages arm
judged, and a line starting `---` in any of them started a whole new document.
So this arm renders the three named templates the Certificates come from,
splits each into documents, parses every one with `fromYaml` — last key wins
there too, as it does in helm — and judges the parsed objects.

THE SPLIT IS EVERY LINE THAT STARTS `---`, as helm's own is. `fromYaml` reads only
the first document of what it is given, so a narrower split — `---` alone on its
line — let `--- #`, `--- !!map` or `---\r` carry a second document past this arm
while helm still emitted it.

EACH SOURCE RENDERS A KNOWN NUMBER OF DOCUMENTS OF KNOWN KINDS: `internal-ca.yaml`
three (two Issuers and the CA Certificate) while `internalCA.create` is on;
`certificates.yaml` one Certificate per `certificates.leaves` entry while
`certificates.create` is on; `edge-certificate.yaml` one Certificate while
`edgeTLS.create` is on; and none while a toggle is off. Any other count, or any
other kind — a CertificateRequest carries `isCA` as well — is refused, so an
injected document is caught whatever it is.

`isCA` IS ALLOWED ON EXACTLY ONE OBJECT: the Certificate named `internalCA.name`
from `internal-ca.yaml`. The allowlist names the SOURCE as well as the name, so
a leaf keyed `yadgar-internal-ca` is still a leaf; and it counts, so a second
document by that name in `internal-ca.yaml` is refused too. That CA names
neither direction — an authority signs; it neither answers nor dials. Every
other Certificate names exactly one direction and not `any`, and the edge leaf
names `server auth`: the rules of the two arms above, held on what renders.

A DOCUMENT `fromYaml` CANNOT PARSE IS REFUSED rather than skipped, and so is a
Certificate whose `spec` is not a map: a check that skipped what it could not
read would pass having examined nothing. UNCONDITIONAL, ROOT AND SUBCHART, for
the leaf usages arm's reason; each named template renders nothing while its own
toggle is off.
*/}}
{{- $badRendered := list }}
{{- $caAllowed := 0 }}
{{- $leafCount := 0 }}
{{- if and .Values.certificates.create (kindIs "map" .Values.certificates.leaves) }}{{ $leafCount = len .Values.certificates.leaves }}{{ end }}
{{- range $source := list
      (list "templates/internal-ca.yaml" "platform.certificates.internal-ca" (ternary 3 0 (not (not .Values.internalCA.create))) (list "Issuer" "Certificate"))
      (list "templates/certificates.yaml" "platform.certificates.leaves" $leafCount (list "Certificate"))
      (list "templates/edge-certificate.yaml" "platform.certificates.edge" (ternary 1 0 (not (not .Values.edgeTLS.create))) (list "Certificate")) }}
{{- $file := index $source 0 }}
{{- $documents := 0 }}
{{- range $index, $text := regexSplit `(?m)^---` (include (index $source 1) $) -1 }}
{{- $document := fromYaml $text }}
{{- if hasKey $document "Error" }}
{{- $documents = add1 $documents }}
{{- $badRendered = append $badRendered (printf "document %d from `%s` does not parse (%s)" $index $file (index $document "Error")) }}
{{- else if $document }}
{{- $documents = add1 $documents }}
{{- $kind := toString (index $document "kind") }}
{{- if not (has $kind (index $source 3)) }}
{{- $badRendered = append $badRendered (printf "document %d from `%s` is a %q, and that template renders only %v" $index $file $kind (index $source 3)) }}
{{- else if eq $kind "Certificate" }}
{{- $metadata := index $document "metadata" | default dict }}
{{- $name := "" }}
{{- if kindIs "map" $metadata }}{{ $name = toString (index $metadata "name") }}{{ end }}
{{- $spec := index $document "spec" }}
{{- if not (kindIs "map" $spec) }}
{{- $badRendered = append $badRendered (printf "`%s` from `%s` has no `spec` map" $name $file) }}
{{- else }}
{{- $usages := index $spec "usages" }}
{{- if not (kindIs "slice" $usages) }}{{ $usages = list }}{{ end }}
{{- $serves := has "server auth" $usages }}
{{- $dials := has "client auth" $usages }}
{{- $isCA := and (hasKey $spec "isCA") (not (and (kindIs "bool" (index $spec "isCA")) (not (index $spec "isCA")))) }}
{{- if $isCA }}
{{- if and (eq $file "templates/internal-ca.yaml") (eq $name $.Values.internalCA.name) (eq $caAllowed 0) }}
{{- $caAllowed = 1 }}
{{- if or $serves $dials (has "any" $usages) }}
{{- $badRendered = append $badRendered (printf "`%s` from `%s` is the internal CA and names a direction (%v)" $name $file $usages) }}
{{- end }}
{{- else }}
{{- $badRendered = append $badRendered (printf "`%s` from `%s` sets `isCA`, and only the one Certificate named `internalCA.name` in `templates/internal-ca.yaml` may" $name $file) }}
{{- end }}
{{- else }}
{{- if has "any" $usages }}
{{- $badRendered = append $badRendered (printf "`%s` from `%s` names `any`" $name $file) }}
{{- end }}
{{- if and $serves $dials }}
{{- $badRendered = append $badRendered (printf "`%s` from `%s` names both `server auth` and `client auth`" $name $file) }}
{{- else if not (or $serves $dials) }}
{{- $badRendered = append $badRendered (printf "`%s` from `%s` names neither `server auth` nor `client auth` (%v)" $name $file $usages) }}
{{- else if and (eq $file "templates/edge-certificate.yaml") (not $serves) }}
{{- $badRendered = append $badRendered (printf "`%s` from `%s` is the edge leaf and does not name `server auth`" $name $file) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if ne $documents (int (index $source 2)) }}
{{- $badRendered = append $badRendered (printf "`%s` renders %d documents where %d are declared" $file $documents (int (index $source 2))) }}
{{- end }}
{{- end }}
{{- if $badRendered }}
{{- fail (printf "platform: a Certificate this chart renders breaks the trust rules once it is parsed back: %s. A value or a template edit carried a key or a document of its own into what this chart renders (yaadgaar 534, 537)." (join "; " $badRendered)) }}
{{- end }}{{/* end of the rendered certificates arm */}}
{{- if or .Values.internalCA.create .Values.certificates.create .Values.edgeTLS.create }}
{{- include "platform.require-api" (dict
      "context" $
      "apiVersion" "cert-manager.io/v1"
      "operator" "cert-manager"
      "toggle" "internalCA.create, certificates.create or edgeTLS.create") }}
{{- end }}

{{/*
ENVOY GATEWAY, AND THE GROUP IS THE WHOLE DECISION.

`gatewayListener.create` renders three kinds from TWO API groups: a GatewayClass
and a Gateway on `gateway.networking.k8s.io/v1`, and an EnvoyProxy on
`gateway.envoyproxy.io/v1alpha1`. Only the second is checked, and the first is
deliberately NOT.

THE GATEWAY API IS A SPECIFICATION, NOT AN OPERATOR.
`.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1"` is satisfied by the
Gateway API CRDs ALONE. Istio registers them, and so does every other
implementation, so a check on that group is green on a cluster with no Envoy
Gateway anywhere — it names a specification and can never be the refusal that
names Envoy Gateway. The same cluster also serves
`gateway.networking.x-k8s.io/v1alpha1`, the upstream experimental channel, which
is wrong for the same reason. Three plausible strings, one correct: the EnvoyProxy
below is the object whose group no other implementation registers.

Adding a Gateway API check beside this one would be LEGAL under the default-false
rule and is still not added: it names no operator, so it adds a refusal nobody can
attribute. One check per operator is the count this chart asserts.

THE STRING IS A LITERAL HERE AND IS RECORDED IN `values.yaml` UNDER
`gatewayListener.envoyGateway.apiVersion`, read off the operator at the version
the estate pins. It has to be a literal because
`scripts/tests/test_render_checks.py` reads these arguments off the template to
count and exercise the checks; the gate that keeps the two in step is
`test_the_render_check_names_the_group_the_values_file_records`.

THE TOGGLE IS OPT-IN, which is what makes this check legal at all. A render check
may only ever sit behind a default-false toggle: `Has` is false for every
CRD-backed group with no cluster, so a check reachable at the defaults would
refuse every offline render in the estate.
*/}}
{{- if .Values.gatewayListener.create }}
{{- include "platform.require-api" (dict
      "context" $
      "apiVersion" "gateway.envoyproxy.io/v1alpha1"
      "operator" "Envoy Gateway"
      "toggle" "gatewayListener.create") }}
{{- end }}
