# THE VALUES FILE AN ORGANISATION COMMITS BESIDE ITS OWN Application, in its OWN
# GitOps repository. Copy it there and point the Application at it.
#
# THIS FILE IS THE WHOLE PLATFORM LAYER TURNED ON. The chart's own defaults render
# NOTHING — every `create` toggle is false — so an install that copies nothing gets
# no Certificate, no Issuer and needs no CRD. This file is the other end of that:
# it is what an adopter with cert-manager installed actually sets.
#
# IT IS ALSO A TEST INPUT. `scripts/tests/test_ladder.py`,
# `scripts/tests/test_render_checks.py` and `scripts/tests/test_bootstrap.py`
# render the chart with this exact file, because a values file nobody renders is
# a values file nobody has checked.
#
# ─── what you must change ────────────────────────────────────────────────────
#
# `edgeTLS.issuerRef` — BOTH KEYS. There is no default for an authority this
# chart does not own, and the render refuses without them, naming the key. (An
# empty `edgeTLS.issuerRef` falls back to this chart's own internal CA, but only
# when `internalCA.create` is true and the map is left completely empty — not a
# fallback this file uses, since the edge here is signed by an authority this
# chart does not own: this organisation's is a hand-minted ClusterIssuer whose
# key is held outside the cluster, and yours is yours.)
#
# `global.hostname` — the host your edge answers on, stated once (ADR-0808).
# `edgeTLS.commonName`, `edgeTLS.dnsNames` and `gatewayListener.hostname` all
# fall back to it when left empty, and to `gateway.yadgar.internal` when it is
# empty too. Under the parent chart you set it there, not here. A per-key value
# still wins if you need one to differ.
#
# ─── what you should not change without reading first ────────────────────────
#
# The `renewBefore` values under `certificates.leaves` in the chart's own
# `values.yaml`. They are one invariant across the whole set, not ten settings.
# This file does not restate them, deliberately — it turns the set on and inherits
# the ladder, which is what keeps one source for it.
#
# ─── what you must do AFTER the first install ────────────────────────────────
#
# EXPORT THE FOUR SECRETS THE BOOTSTRAP JOBS MINT. Nothing tracks them, so nothing
# backs them up either, and a cluster deleted without an export loses the values
# for good. `README.md` carries the command beside the install command.

internalCA:
  create: true

certificates:
  create: true

edgeTLS:
  create: true
  issuerRef:
    name: yadgar-dev-ca
    kind: ClusterIssuer

# ── THE EDGE LISTENER ────────────────────────────────────────────────────────
# THREE OBJECTS AND ONE TOGGLE: the GatewayClass Envoy Gateway watches, the
# Gateway that terminates TLS on it, and the EnvoyProxy that says how the data
# plane it provisions is placed and exposed.
#
# `gatewayListener.hostname` AND `edgeTLS.dnsNames` MUST AGREE, and the chart's
# gate says so rather than the render failing later: verification fails after
# signing succeeds when they do not, which is a confusing place to find a typo.
# Left empty, both derive from `global.hostname`, so they agree by construction.
#
# `envoyProxy.serviceType` DEFAULTS TO `LoadBalancer` AND IS NOT RESTATED HERE.
# That is the right answer on a cluster with a load-balancer controller, which is
# the adopter this file is written for. Without one — kind, bare metal — set it to
# `NodePort`, pin `envoyProxy.httpsNodePort`, and on kind place the pods with
# `envoyProxy.pod.{nodeSelector,tolerations}`. The README shows the values this
# organisation's kind cluster runs (ADR-0809).
gatewayListener:
  create: true

# ── THE ONE SHARED CACHE ─────────────────────────────────────────────────────
# A Deployment, a Service and an ingress NetworkPolicy. The password comes from
# the bootstrap Job below; nothing here survives a restart and nothing here needs
# to.
valkey:
  create: true

# ── THE BROKER, AS AN UPSTREAM CHART DEPENDENCY ──────────────────────────────
# `nats.create` IS READ BY HELM ITSELF, not by a template: it is the `condition`
# on the dependency `Chart.yaml` declares, so setting it false removes the whole
# NATS release from the render rather than one object. The ingress
# NetworkPolicy that guards the broker is this chart's own and follows the same
# key.
#
# THE BROKER'S OWN VALUES ARE NOT RESTATED HERE, deliberately — the two accounts,
# their subject permissions and the `<< >>` escape live in the chart's
# `values.yaml` and this file inherits them, which is what keeps one source for
# them. Both passwords are minted by the bootstrap Job below.
#
# `tls` IS REQUIRED WHILE `create` IS TRUE, with no default (ADR-0845, ADR-0854):
# this is the plaintext broker. To serve TLS, set `tls.enabled: true` AND the
# upstream keys beside it — `config.nats.tls.enabled: true`,
# `config.nats.tls.secretName: nats-tls` — and the render check refuses the two
# disagreeing. `clientAuth: "required"` adds `config.nats.tls.merge.verify: true`
# and `config.nats.tls.merge.ca_file: /etc/nats-certs/nats/ca.crt`. Quote "off".
nats:
  create: true
  tls:
    enabled: false
    clientAuth: "off"

# THE BOOTSTRAP JOBS. Two pre-install hooks mint the four credentials nothing
# outside the installation can supply, and neither Helm nor Argo tracks the
# Secrets they create — so an uninstall or a prune leaves them standing (ADR-0750).
# Turn this OFF if your own secret manager populates those four names instead;
# every consumer takes a file path and does not care how the file arrived.
#
# EXPORT WHAT THEY MINT. A generated credential nobody exported is a credential
# lost with the cluster. README.md carries the command beside the install command.
bootstrap:
  create: true

  adminToken:
    # NAMED HERE RATHER THAN INHERITED, although the value equals the chart's own
    # default. The parent chart refuses an install where this and the gateway's
    # `gateway.adminBootstrap.tokenSecret` disagree, so the name is a thing an
    # adopter decides rather than a thing that happens to them (ADR-0569's "a
    # value someone can see").
    secretName: admin-bootstrap-token

# ── THE PREFLIGHT: NOTHING TO SET, AND THAT IS THE DECISION ──────────────────
# NO `preflight` BLOCK APPEARS BELOW, AND ITS ABSENCE IS DELIBERATE RATHER THAN AN
# OMISSION. Every `preflight.probes.*` key is left UNSET so the tie in
# `chart/templates/_preflight.tpl` resolves it: `probes.certManager` follows the
# three `create` toggles above and `probes.envoyGateway` follows
# `gatewayListener.create`, all true here, so this file renders ONE probe in each of
# the two Jobs. Writing either key out would replace a tie that tracks the toggles
# with a constant that does not.
#
# THE TWO JOBS ARE SEPARATED BY PHASE, NOT BY TOGGLE. The pre-install preflight
# refuses before anything else acts; the post-install probe creates a Gateway the
# Envoy Gateway controller has never seen and waits for it to be programmed, which
# is only possible once the install has made the GatewayClass it binds to.
#
# AND THE INSTALL THAT APPLIES THIS FILE MUST BE GIVEN `--timeout 25m`. Helm's
# `--timeout` defaults to `5m0s` and covers each hook Job, measured on both pins.
# The post-install probe bounds itself at `preflight.envoyGateway.timeoutSeconds`,
# 300 seconds, and composes three of those loops — it waits for any EnvoyProxy and
# any Gateway of its fixed name to be GONE before it creates its own, then for the
# Gateway to be programmed — so its worst case is 900 seconds. Helm's clock
# starts at hook CREATION, so scheduling and image pull come out of the same
# budget. At the default helm aborts first every time and the
# operator reads `timed out waiting for the condition` instead of the probe naming
# Envoy Gateway. The cleanup survives either way; the diagnostic does not. The
# preflight with every probe on needs more still: eight loops of 120 seconds,
# 960 seconds, which with the 300-second margin is what sets 25 minutes. Each
# hook Job also carries its own `activeDeadlineSeconds` (ledger 1224), computed
# from these bounds, and each one ends inside the 25 minutes.
#
# `probes.keda` AND `probes.mariadb` RESOLVE FALSE HERE, AND THAT IS CORRECT. This
# chart renders no ScaledObject and no MariaDB CR, so a probe for either would test
# an operator nothing in this install needs. They are enabled ONE LEVEL UP, in the
# parent chart's own adopter values, where `autoscaling.enabled` and
# `database.create` are visible — a subchart cannot read a sibling's key, so an
# explicit `true` there is the only place the truth can come from.
#
# TO DROP THE DIAGNOSTIC ENTIRELY, set `preflight.enabled: false` — it drops both
# Jobs. An explicit `preflight.probes.certManager: false` or
# `preflight.probes.envoyGateway: false` drops one of them and is honoured. What is
# REFUSED is either of those keys set TRUE beside its own `create` toggle set false —
# a probe for an operator this install renders nothing for proves nothing and can
# only fail for the wrong reason, and the refusal names both keys.
