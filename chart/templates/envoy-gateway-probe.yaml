{{/*
THE POST-INSTALL PROBE: A FRESH GATEWAY, AND THE CONTROLLER HAS TO PROGRAM IT.

WHY THIS ONE IS NOT IN THE PREFLIGHT. A PRE-INSTALL Envoy Gateway probe cannot go
red, and two independent defects say so. `Accepted=True` on a GatewayClass is a
condition ALREADY PERSISTED IN ETCD — it was written when the controller last
reconciled the object and it stays there with the controller at zero replicas, so
the scaled-to-zero case reads green. And `gatewayListener.create` renders the
GatewayClass itself, so on a fresh install — the only install a preflight matters
on — the class does not exist when a pre-install hook runs, and the probe fails for
the wrong reason on a healthy cluster. A POST-INSTALL hook runs once the release's
objects exist, which is what makes probing a real Gateway possible at all.

SO THE PROBE CREATES AN OBJECT THE CONTROLLER HAS NEVER SEEN. A fresh Gateway has
no status, and nothing but a running controller can give it one. That is the whole
red case: with Envoy Gateway scaled to zero the Gateway is admitted, no condition is
ever written, and the probe fails at its bound naming Envoy Gateway.

`Programmed`, NOT `Accepted`, AND THE DIFFERENCE IS THE WHOLE PROBE. `Accepted=True`
means the controller validated the Gateway's spec against its GatewayClass;
`Programmed=True` means the data plane for it exists. A controller that accepts and
never programs is the half-dead case this probe is for, so the probe takes the
stronger condition. The weaker one is NOT a fallback: if `Programmed` turned out not
to be set at the pinned Envoy Gateway version, that is a measurement that changes
this probe, recorded with its reason, and never a silent downgrade — which is why
`Programmed` is a literal here rather than a values key, and why
`test_the_probe_waits_for_programmed_and_never_for_accepted` refuses the swap.

A GATEWAY CARRIES TWO CONDITIONS NAMED `Programmed`, AND THEY ARE DIFFERENT FACTS.
The OBJECT's means an address was assigned and the proxy replicas are available;
each LISTENER's means its configuration was translated and sent to the data plane.
Measured on kind-yadgar: `Programmed` appears FOUR times in one Gateway's status.
The matcher searches the whole response, so `Programmed=True` on its own is
satisfied by EITHER — and the two come apart on exactly the cluster this probe is
installed for. `gatewayListener.envoyProxy.serviceType` defaults to `LoadBalancer`
and the adopter values do not restate it, so with no load-balancer controller no
address is ever assigned and the OBJECT's `Programmed` goes False; the listener
still translates, and a probe keyed on the condition alone would report SUCCESS
while the real `edge` Gateway stalls.

SO THE PROBE REQUIRES THE OPERATOR'S OWN MESSAGE TOO, and that is the rule
`mariadb.validationMessage` already set: a probe keys on wording the operator
writes, so an upgrade that rewords it turns the probe RED rather than silently
weakening it. `preflight.envoyGateway.programmedMessage` records the STABLE PREFIX
and never the `2/2 replicas` tail, which varies. This is NOT a narrowing of the
search to `status.conditions`: cutting the body at a key position depends on the
order the API server marshals the status struct in, and a probe that reds on a
HEALTHY cluster because a field moved is the fail-for-the-wrong-reason class this
chart refuses. Requiring a substring is order-independent and stays `grep`-only.

IT IS ITS OWN JOB WITH ITS OWN DENOMINATOR, and the denominator half is the
separate one. `PROBES` is the list of probes the rendered script carries and
`EXPECTED_PROBES` is the count the values resolve — both scoped to the POST-INSTALL
set, so the pre-install Job's denominator counts none of this. The two are NOT
independent derivations of the list: both come from `$probes`, and the per-probe
blocks are GATED on that same list. What the equality catches is a `PROBES` line
edited away from the count beside it — which is the failure this Job's own red case
exercises — and it is checked AT THE TOP LEVEL, because inside a function reached
through `$( )` the exit status is discarded and `set -e` never sees it, and a
pipeline reports only its last element's status.

THE PROBE RUNS ON ITS OWN ENVOYPROXY, NEVER ON `edge` (ledger 1189). It used to
name `edge` as its infrastructure, and so inherited `edge`'s pinned HTTPS nodePort.
MEASURED on a from-scratch kind install on 2026-09-30: the edge Service already
held that port, the API server refused the probe's Service ("provided port is
already allocated"), and the probe failed at its bound on every sync of a healthy
cluster. So the probe creates an EnvoyProxy that is `edge`'s spec WITHOUT the
`envoyService.patch`: the same replicas, the same scheduling, the same Service
type. The type matters for the LoadBalancer case. In Envoy Gateway v1.9.1 an
object-level `Programmed=True` needs an address AND at least one available Envoy
replica. A `ClusterIP` Service always has an address (its cluster IPs), and so
does a `NodePort` one (the node addresses) — on those types the probe goes red
only on replicas. A `LoadBalancer` Service has an address only where a
load-balancer controller assigns one. So a probe that swapped the edge's
`LoadBalancer` for `ClusterIP` would read green on a cluster with no
load-balancer controller while the real edge Gateway stalls; copying the type
keeps the probe asking the edge's own question.

THE PROBE GATEWAY AND ITS ENVOYPROXY ARE CLEANED UP ON EVERY EXIT PATH, AND
`hook-delete-policy` DOES NOT DO IT. `before-hook-creation` deletes the JOB before the next hook run; it never
touches objects that Job created. A Gateway left standing is not inert — it is
provisioned proxy infrastructure. So there are two guarantees, because one of them
has to survive the Job dying outright: a `trap` that deletes on EVERY exit, success
and failure alike, before the failure is reported; and a FIXED name, deleted and
waited for BEFORE this run creates its own, so a Job killed between create and
cleanup leaks at most one Gateway and the next run removes it rather than colliding
with it. The cleanup deletes NEWEST FIRST — the Gateway, then its EnvoyProxy —
because an EnvoyProxy deleted under a live Gateway makes Envoy Gateway re-provision
that Gateway from the controller's defaults.
*/}}
{{- $preflight := .Values.preflight }}
{{- $probe := $preflight.envoyGateway }}
{{- $listener := .Values.gatewayListener }}
{{- $probes := without (splitList " " (include "platform.preflight.postInstallProbes" (dict "context" $))) "" }}
{{- /*
THE PROBE'S ENVOYPROXY SPEC: `edge`'s, read from the same keys
`gateway-listener.yaml` reads, with no `envoyService.patch`. Built here rather than
shared with that template so the edge object renders exactly as it did;
`test_preflight.py`'s `probe_infrastructure_failures` asserts the two agree field
by field, minus the pin.
*/}}
{{- $envoyProxy := $listener.envoyProxy }}
{{- $probePod := dict }}
{{- with (dig "pod" "nodeSelector" dict $envoyProxy) }}{{ $_ := set $probePod "nodeSelector" . }}{{ end }}
{{- with (dig "pod" "tolerations" list $envoyProxy) }}{{ $_ := set $probePod "tolerations" . }}{{ end }}
{{- $probeDeployment := dict "replicas" $envoyProxy.replicas }}
{{- if $probePod }}{{ $_ := set $probeDeployment "pod" $probePod }}{{ end }}
{{- $probeProxySpec := dict "provider" (dict
      "type" "Kubernetes"
      "kubernetes" (dict
        "envoyDeployment" $probeDeployment
        "envoyService" (dict "type" $envoyProxy.serviceType))) }}
{{- if and $preflight.enabled $probes }}
{{- /*
WHAT EACH PROBE COSTS THE DEADLINE: [bounded loops, objects left for the cleanup].
  envoy-gateway  3 loops (Gateway and EnvoyProxy removals — the Gateway's second
                 `remove`, inside its `create`, answers 404 at once — and the
                 Gateway await), 2 objects (Gateway, EnvoyProxy)
`test_hook_deadlines.py` recounts both numbers off the RENDERED script.
*/}}
{{- $shape := dict "envoy-gateway" (list 3 2) }}
{{- $loops := 0 }}
{{- $objects := 0 }}
{{- range $probes }}
{{- if not (hasKey $shape .) }}{{ fail (printf "platform: the post-install probe carries no deadline shape for probe %s" .) }}{{ end }}
{{- $loops = add $loops (index (get $shape .) 0) }}
{{- $objects = add $objects (index (get $shape .) 1) }}
{{- end }}
{{- $margin := include "platform.hookDeadline.probeMargin" . | int }}
{{- $deadline := add (mul $loops $probe.timeoutSeconds) $margin }}
{{- $requestMaxTime := include "platform.hookRequest.maxTime" . | int }}
{{- $cleanupMaxTime := include "platform.hookRequest.cleanupMaxTime" . | int }}
{{- $grace := add $requestMaxTime (mul $objects $cleanupMaxTime) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: envoy-gateway-probe
  annotations:
    # ORDERED BY PHASE RATHER THAN BY WEIGHT. This is the only Job on the other
    # side of the install: it runs once the release's objects — the GatewayClass
    # among them — already exist, which is the thing a weight cannot express.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-7"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  # ZERO RETRIES, as the preflight's. A retry is worth taking when the failure is
  # transient; here the failure is "Envoy Gateway is not running", which does not
  # become "it is running" on the second attempt. More attempts would only multiply
  # the bound before the release is allowed to fail.
  backoffLimit: {{ $preflight.backoffLimit }}
  # THE JOB ENDS ON ITS OWN CLOCK (ledger 1224), AS A BACKSTOP BEHIND THE ONE THE
  # SCRIPT KEEPS ITSELF — for everything the script cannot see: a pod that never
  # schedules, an image that never pulls. The script reads the WALL CLOCK (ledger
  # 1235): every loop ends by its own `TIMEOUT_SECONDS` or by the script's
  # `SCRIPT_BUDGET_SECONDS` of {{ $loops }} bounded loops x {{ $probe.timeoutSeconds }}s, whichever comes first, so
  # on a slow API server the script names Envoy Gateway and deletes its Gateway
  # before this fires. The margin covers scheduling, the image pull, the worst
  # overrun past the budget — max(poll + 2 requests, 3 requests), 105s at the 35s
  # request bound — and the cleanup (`test_hook_deadlines.py` checks it). It still ends inside the documented helm budget, so helm reports a
  # failure rather than its own timeout: {{ $loops }} bounded loops x {{ $probe.timeoutSeconds }}s + {{ $margin }}s margin = {{ $deadline }}s.
  activeDeadlineSeconds: {{ $deadline }}
  template:
    metadata:
      labels: { app.kubernetes.io/name: envoy-gateway-probe }
    spec:
      serviceAccountName: {{ $probe.serviceAccountName }}
      automountServiceAccountToken: true
      restartPolicy: Never
      # TIME FOR THE TRAP TO DELETE THE GATEWAY AFTER A KILL. `sh` runs its TERM
      # trap only once the foreground command returns: {{ $requestMaxTime }}s for the request
      # in flight + {{ $objects }} objects x {{ $cleanupMaxTime }}s per cleanup DELETE = {{ $grace }}s.
      terminationGracePeriodSeconds: {{ $grace }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        seccompProfile: { type: RuntimeDefault }
      # `readOnlyRootFilesystem` below leaves nowhere to put a response body, and
      # a Gateway's status is one long line until it is split.
      volumes:
        - name: scratch
          emptyDir: {}
      containers:
        - name: envoy-gateway-probe
          # THE PREFLIGHT'S OWN IMAGE KEY, NOT A SECOND ONE. Both Jobs need the
          # same four things of it — a POSIX shell, `curl`, `grep` and `sed`, and a
          # nonroot user at UID/GID 100 — so a second key would be two sources for
          # one decision, and the digest pin would have to be moved twice.
          image: {{ $preflight.image }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: scratch
              mountPath: /tmp
          command: ["sh", "-c"]
          args:
            # `$(...)` BELOW IS THE SHELL'S, NOT KUBERNETES'. Kubernetes expands
            # `$(VAR)` inside `args` only where VAR names an environment variable
            # of this container, and an unresolvable reference is documented to be
            # left unchanged. This container declares no environment at all.
            - |
              set -eu

              api="https://kubernetes.default.svc"
              sa="/var/run/secrets/kubernetes.io/serviceaccount"
              ns="$(cat "$sa/namespace")"
              token="$(cat "$sa/token")"
              body=/tmp/answer

              # ── THE LIST, AND THE DENOMINATOR IT IS ASSERTED AGAINST ──────
              # BOTH ARE THE POST-INSTALL SET'S, and both resolve from `$probes` —
              # so this is one source read twice rather than two derivations that
              # agree. `PROBES` is the list the rendered script carries;
              # `EXPECTED_PROBES` is its count. What the equality catches is a
              # `PROBES` line edited away from the count beside it: a probe added to
              # this Job that no key enables moves the first and not the second.
              PROBES="{{ join " " $probes }}"
              EXPECTED_PROBES={{ len $probes }}

              TIMEOUT_SECONDS={{ $probe.timeoutSeconds }}
              POLL_SECONDS={{ $preflight.pollSeconds }}
              # THE SCRIPT'S OWN WALL-CLOCK BUDGET (ledger 1235): every bounded
              # loop it can run, each at `TIMEOUT_SECONDS`. Read off `date`, never
              # off a counter of sleeps — a counter charged only the sleep let a
              # loop against an API server answering each poll in 34s run 3700s
              # of a 300s bound, and the Job deadline ended it with Envoy Gateway
              # never named. The deadline above is this budget + the margin.
              SCRIPT_BUDGET_SECONDS={{ mul $loops $probe.timeoutSeconds }}
              SCRIPT_DEADLINE=$(( $(date +%s) + SCRIPT_BUDGET_SECONDS ))
              PROBE_NAME={{ $probe.probeName }}
              # EVERY REQUEST ENDS. `_preflight.tpl` records why each number is
              # what it is; the cleanup swaps in the shorter one.
              REQUEST_MAX_TIME={{ $requestMaxTime }}
              CLEANUP_MAX_TIME={{ $cleanupMaxTime }}
              CONNECT_TIMEOUT={{ include "platform.hookRequest.connectTimeout" . }}

              # THE OPERATOR'S OWN WORDING, REQUIRED ALONGSIDE `Programmed=True`.
              # `squote` rather than bare, as the preflight's three strings are: the
              # value carries spaces and is a message read off the operator.
              PROGRAMMED_MESSAGE={{ $probe.programmedMessage | squote }}

              # THE PATHS THE CLEANUP WALKS. PREPENDED as each object is created, so
              # a probe that dies half-way still leaves its cleanup a complete list
              # of what it made, and the cleanup deletes NEWEST FIRST: the Gateway
              # before the EnvoyProxy it names.
              CREATED=""

              # ── THE RESPONSE HAS TO BE COMPACT JSON, AND THIS REQUEST DECIDES IT ─
              # THE API SERVER PRETTY-PRINTS FOR ANY CLIENT WHOSE `User-Agent`
              # BEGINS WITH `curl`, and `preflight.image` is `curlimages/curl`.
              # MEASURED in-cluster against kind-yadgar (Kubernetes v1.36.1), one
              # pod, three requests to one URL: the default agent answered 12
              # lines, `?pretty=false` answered 1, a non-curl agent answered 1.
              #
              # `condition_matches` BELOW IS A LINE MATCHER, and a pretty body
              # defeats it TWICE OVER with no grep fix for either half.
              # `"type": "Ready"` carries a space after the colon, so the needle
              # matches nothing; and `type` and `status` land on SEPARATE LINES,
              # so no single line the pipeline sees can carry both. So the
              # RESPONSE is made deterministic here rather than the matcher made
              # cleverer.
              #
              # WHAT THIS COST BEFORE IT WAS FIXED: cert-manager issued the probe
              # Certificate in about one second — `Ready=True` at t=1s, Secret
              # created — and this Job still failed at its bound reporting that
              # cert-manager's CONTROLLER was not running. The post-install probe
              # failed the same way beside an `edge` Gateway reading
              # `Programmed=True`. Both Jobs reported the one thing that was not
              # wrong, and `preflight.enabled` defaults TRUE into a PreSync hook
              # whose Application self-heals.
              #
              # BOTH MECHANISMS, BECAUSE THEY FAIL DIFFERENTLY. `?pretty=false` is
              # the explicit parameter and the API server honours it whatever the
              # agent is; the agent is what stops the DEFAULT from being pretty at
              # all, including on any request a later reader adds without the
              # parameter. Either alone would do today, on a probe that gates a
              # sync.
              #
              # THE AGENT IS A LITERAL AND NOT A VALUES KEY. Its whole job is to
              # NOT begin with `curl` and to NOT contain `mozilla`, which are the
              # two strings the API server reads; a key would be a weakening
              # direction nothing else in this chart needs.
              USER_AGENT='yadgar-platform-envoy-gateway-probe'

              # ── THE API, AND THE ONE PLACE A REQUEST IS MADE ──────────────
              # The status lands in `STATUS` and the answer in `$body`. NOTHING
              # HERE EXITS: a caller decides what a status means, because a 404 is
              # a failure to a probe and a success to the cleanup.
              STATUS=""
              request() {
                method="$1"
                path="$2"
                payload="$3"
                # `?` OR `&`, AND THE GLOB IS ESCAPED. `*\?*` asks whether the
                # path already carries a query — the mariadb arm's
                # `?dryRun=All` does. UNESCAPED, `*?*` is the shell's glob for
                # "at least one character", EVERY path takes the `&` branch, and
                # this probe requests `/apis/...&pretty=false`: one path, no
                # query at all. A grep for `pretty=false` in this template
                # passes that, which is why the gate runs the rendered shell.
                #
                # THE QUERY GOES IN ITS OWN VARIABLE AND `path` IS NEVER APPENDED
                # TO. POSIX `sh` has no locals: `await` sets `path="$1"` and
                # re-calls `request` with it on EVERY poll, so appending would
                # grow the query by one `&pretty=false` per second until the
                # bound.
                case "$path" in
                  *\?*) query="&pretty=false" ;;
                  *) query="?pretty=false" ;;
                esac
                if [ -n "$payload" ]; then
                  STATUS="$(printf '%s' "$payload" | curl --silent --show-error \
                    --connect-timeout "$CONNECT_TIMEOUT" --max-time "$REQUEST_MAX_TIME" \
                    --user-agent "$USER_AGENT" \
                    --cacert "$sa/ca.crt" \
                    --header "Authorization: Bearer $token" \
                    --header "Content-Type: application/json" \
                    --request "$method" --data-binary @- \
                    --output "$body" --write-out '%{http_code}' \
                    "$api$path$query")"
                else
                  STATUS="$(curl --silent --show-error \
                    --connect-timeout "$CONNECT_TIMEOUT" --max-time "$REQUEST_MAX_TIME" \
                    --user-agent "$USER_AGENT" \
                    --cacert "$sa/ca.crt" \
                    --header "Authorization: Bearer $token" \
                    --request "$method" \
                    --output "$body" --write-out '%{http_code}' \
                    "$api$path$query")"
                fi
              }

              # ── CLEANUP ON EVERY EXIT PATH, SUCCESS AND FAILURE ALIKE ─────
              # A GATEWAY IS NOT INERT. Envoy Gateway provisions a Deployment and a
              # Service for each one, so a probe that times out and exits 1 without
              # this would leave real proxy infrastructure standing under a name
              # nobody recognises. The trap runs on EXIT, and it runs BEFORE the
              # failure is reported.
              cleanup() {
                REQUEST_MAX_TIME="$CLEANUP_MAX_TIME"
                for path in $CREATED; do
                  request DELETE "$path" "" || true
                done
              }
              trap cleanup EXIT
              # `sh` AS PID 1 IGNORES SIGTERM UNLESS IT HAS A HANDLER, and a shell
              # killed by a signal skips its EXIT trap. So a pod deleted mid-probe
              # would die on SIGKILL with every probe object standing. This turns
              # the signal into an ordinary exit, and the EXIT trap then cleans up.
              trap 'exit 143' TERM INT

              # ── THE WALL CLOCK EVERY BOUNDED LOOP READS ───────────────────
              # The preflight Job's three helpers, taken rather than re-derived.
              # `bound` starts a loop: it ends at the EARLIER of its own
              # `TIMEOUT_SECONDS` and the script's `SCRIPT_DEADLINE`. `in_time`
              # reads the clock after each poll — the poll's own request counts —
              # and a loop entered with no budget left makes no request at all.
              # `clamped` says the budget, not the loop's own bound, ended it.
              bound() {
                started="$(date +%s)"
                ends=$((started + TIMEOUT_SECONDS))
                if [ "$ends" -gt "$SCRIPT_DEADLINE" ]; then
                  ends="$SCRIPT_DEADLINE"
                fi
              }
              in_time() {
                now="$(date +%s)"
                [ "$now" -lt "$ends" ]
              }
              clamped() {
                [ "$ends" -lt "$((started + TIMEOUT_SECONDS))" ]
              }

              # DELETE ANY OBJECT OF THIS NAME AND WAIT FOR IT TO BE GONE BEFORE
              # CREATING OURS. This is what keeps the probe FRESH as well as what
              # bounds a leak: a Gateway left by a killed Job carries a status a
              # previous reconcile wrote, and reading that back would be the
              # already-persisted-condition defect the pre-install probe was
              # dropped for.
              remove() {
                bound
                if ! in_time; then
                  echo "envoy-gateway-probe: the script's ${SCRIPT_BUDGET_SECONDS}s budget was spent before $1 could be removed." >&2
                  return 1
                fi
                request DELETE "$1" "" || true
                while :; do
                  # A POLL THAT TIMES OUT IS A SLOW ANSWER, NOT THE END (ledger
                  # 1235). Under `set -e` a request past `--max-time` would end
                  # the script with only curl's own `(28)`; here it leaves
                  # `STATUS` at `000` and the loop polls again inside its bound.
                  request GET "$1" "" || true
                  if [ "$STATUS" = "404" ]; then
                    return 0
                  fi
                  in_time || break
                  sleep "$POLL_SECONDS"
                done
                if [ "$STATUS" = "000" ]; then
                  echo "envoy-gateway-probe: $1 could not be read for $((now - started))s after a delete: the last request got no answer within ${REQUEST_MAX_TIME}s, so the API server is the slow part." >&2
                else
                  echo "envoy-gateway-probe: $1 was still present $((now - started))s after a delete" >&2
                fi
                if clamped; then
                  echo "envoy-gateway-probe: the script's ${SCRIPT_BUDGET_SECONDS}s budget ended this wait before its own ${TIMEOUT_SECONDS}s bound." >&2
                fi
                return 1
              }

              create() {
                remove "$1"
                # A timed-out POST answers `000` and is named by the check below.
                request POST "$2" "$3" || true
                if [ "$STATUS" != "201" ]; then
                  echo "envoy-gateway-probe: creating $1 answered HTTP $STATUS" >&2
                  cat "$body" >&2
                  return 1
                fi
                CREATED="$1 $CREATED"
              }

              # WHETHER A CONDITION OF TYPE $1 CARRIES A STATUS MATCHING $2 AND A
              # MESSAGE CONTAINING $3. The split and the first two stages are the
              # preflight Job's matcher, taken rather than re-derived (ADR-0679):
              # the answer is one long line, so it is split on the boundary BETWEEN
              # condition objects first, because `grep` is a line matcher.
              #
              # THE THIRD STAGE IS THIS PROBE'S OWN, AND IT IS WHY THE TWO MATCHERS
              # DIFFER. A Gateway carries two conditions named `Programmed` — the
              # object's and each listener's — so the first two stages alone are
              # satisfied by EITHER, and the one that matters here is the object's.
              # The preflight's bodies are `metav1.Status`, which carries no such
              # pair, so the stage is added here rather than in both.
              #
              # WHAT THE SPLIT ACTUALLY GUARANTEES, stated to the letter because
              # overclaiming it is how the wider reading survived review once. `sed`
              # splits on `},{` and on nothing else, so at an array boundary — the
              # text `}],"listeners":[{` — there is no split at all: the object's
              # LAST condition shares a segment with the listener array's FIRST. So
              # the three stages are not three readings of one condition object.
              # WHAT DISCRIMINATES IS THE MESSAGE: at the pinned version the prefix
              # `preflight.envoyGateway.programmedMessage` records is written by the
              # object's `Programmed` and by no other condition, so a segment
              # carrying it carries that condition. A version that wrote the same
              # prefix on a second condition would weaken this; one that reworded it
              # turns the probe RED, which is the direction step 0(e) asks for.
              condition_matches() {
                sed 's/},{/}\n{/g' "$body" \
                  | grep '"type":"'"$1"'"' \
                  | grep -E '"status":"('"$2"')"' \
                  | grep -qF "$3"
              }

              # WAIT FOR $1 TO CARRY CONDITION $2 MATCHING $3 WITH MESSAGE $4, OR
              # FAIL AT THE BOUND NAMING THE OPERATOR. The bound is what makes this
              # a probe rather than a hang: a controller that is absent produces an
              # object that simply never gains a condition, which is
              # indistinguishable from a slow one until the clock says otherwise.
              await() {
                path="$1"
                kind="$2"
                wanted="$3"
                message="$4"
                operator="$5"
                bound
                if ! in_time; then
                  echo "envoy-gateway-probe: the script's ${SCRIPT_BUDGET_SECONDS}s budget was spent before $operator's $kind on $path could be read; the removals before it were slow, so $operator is not shown to be down." >&2
                  return 1
                fi
                while :; do
                  # A timed-out poll leaves `STATUS` at `000` and is polled again.
                  request GET "$path" "" || true
                  if [ "$STATUS" = "200" ] && condition_matches "$kind" "$wanted" "$message"; then
                    return 0
                  fi
                  in_time || break
                  sleep "$POLL_SECONDS"
                done
                echo "envoy-gateway-probe: $operator did not set $kind on $path within $((now - started))s, or set it without the message it writes when the Gateway is programmed." >&2
                echo "envoy-gateway-probe: expected a $kind condition with status $wanted whose message contains: $message" >&2
                cat "$body" >&2
                if clamped; then
                  echo "envoy-gateway-probe: the script's ${SCRIPT_BUDGET_SECONDS}s budget ended this wait before its own ${TIMEOUT_SECONDS}s bound; the removals before it were slow, so $operator is not shown to be down." >&2
                elif [ "$STATUS" = "000" ]; then
                  echo "envoy-gateway-probe: the last poll of $path got no answer within ${REQUEST_MAX_TIME}s, so the API server is the slow part and $operator is not shown to be down." >&2
                else
                  echo "envoy-gateway-probe: this Gateway was created by this run, so it carried no condition any earlier reconcile could have written — $operator's CONTROLLER is not running, or it is running and could not program this Gateway." >&2
                fi
                return 1
              }
{{- if has "envoy-gateway" $probes }}

              # ── Envoy Gateway ─────────────────────────────────────────────
              # A FRESH GATEWAY ON THE CLASS THIS CHART RENDERS, and the class is
              # what makes this Envoy Gateway's probe rather than the Gateway API's.
              # `gatewayListener.className` is served by
              # `gatewayListener.controllerName`, which is Envoy Gateway's own
              # controller and no other implementation's — the API group below names
              # a SPECIFICATION and discriminates nothing.
              #
              # A PLAIN HTTP LISTENER, NO TLS. The probe depends on no Secret and
              # therefore on no ReferenceGrant and no cert-manager: a red here is
              # Envoy Gateway and never a certificate that has not been issued yet.
              #
              # AND IT RUNS ON ITS OWN ENVOYPROXY, WHICH IS `edge`'s WITHOUT THE PIN.
              # The data plane is placed and exposed as the estate's own edge is —
              # same replicas, same scheduling, same Service type — so whether a
              # Gateway can be programmed on this cluster is still one question
              # rather than two. What it does NOT inherit is the pinned nodePort:
              # the edge Service holds that port, and a second Service asking for
              # it is refused (ledger 1189). A probe provisioned from the
              # controller's defaults instead could fail where the real Gateway
              # succeeds, which would be a probe reporting on a Gateway nobody
              # installed.
              #
              # THE GROUP IS A LITERAL, as it is on `edge` in
              # `gateway-listener.yaml`: an EnvoyProxy is Envoy Gateway's own kind.
              probe_envoy_gateway() {
                gateways="/apis/{{ $probe.apiVersion }}/namespaces/$ns/gateways"
                envoyproxies="/apis/gateway.envoyproxy.io/v1alpha1/namespaces/$ns/envoyproxies"

                # A GATEWAY A KILLED JOB LEFT BEHIND GOES FIRST, before the
                # EnvoyProxy it names is replaced under it — otherwise Envoy Gateway
                # re-provisions that Gateway from the controller's defaults in
                # between. Then the EnvoyProxy, so the new Gateway names an object
                # that already exists. The Gateway's own `create` removes the same
                # path again and finds it gone on its first read, so the documented
                # install budget counts removals by distinct path.
                remove "$gateways/$PROBE_NAME"

                envoyproxy_body=$(cat <<JSON
              {"apiVersion":"gateway.envoyproxy.io/v1alpha1","kind":"EnvoyProxy",
               "metadata":{"name":"$PROBE_NAME"},
               "spec":{{ toJson $probeProxySpec }}}
              JSON
              )
                create "$envoyproxies/$PROBE_NAME" "$envoyproxies" "$envoyproxy_body"

                gateway_body=$(cat <<JSON
              {"apiVersion":"{{ $probe.apiVersion }}","kind":"Gateway",
               "metadata":{"name":"$PROBE_NAME"},
               "spec":{"gatewayClassName":"{{ $listener.className }}",
                       "infrastructure":{"parametersRef":{"group":"gateway.envoyproxy.io",
                                                          "kind":"EnvoyProxy",
                                                          "name":"$PROBE_NAME"}},
                       "listeners":[{"name":"probe","protocol":"HTTP","port":80,
                                     "allowedRoutes":{"namespaces":{"from":"Same"}}}]}}
              JSON
              )
                create "$gateways/$PROBE_NAME" "$gateways" "$gateway_body"

                await "$gateways/$PROBE_NAME" Programmed True "$PROGRAMMED_MESSAGE" "Envoy Gateway"
              }
{{- end }}

              # ── THE DENOMINATOR, CHECKED BEFORE ANYTHING IS PROBED ────────
              # AT THE TOP LEVEL, and that is not a style choice. Inside a function
              # reached through `$( )` the status is discarded and `set -e` never
              # sees it; inside a pipeline only the last element's status is
              # reported. Both are ways this check could exist and never fire.
              declared=0
              for probe in $PROBES; do
                declared=$((declared + 1))
              done

              [ "$declared" -eq "$EXPECTED_PROBES" ] || {
                echo "envoy-gateway-probe: the render declares $declared probes ($PROBES) against a denominator of $EXPECTED_PROBES." >&2
                echo "envoy-gateway-probe: a probe runs that no preflight.probes.* key asked for, or a key asks for a probe this Job does not carry." >&2
                exit 1
              }

              probed=0
              for probe in $PROBES; do
                case "$probe" in
{{- if has "envoy-gateway" $probes }}
                  envoy-gateway) probe_envoy_gateway ;;
{{- end }}
                  *)
                    echo "envoy-gateway-probe: $probe is in the probe list and this Job carries no probe for it." >&2
                    exit 1
                    ;;
                esac
                echo "envoy-gateway-probe: $probe answered"
                probed=$((probed + 1))
              done

              [ "$probed" -eq "$EXPECTED_PROBES" ] || {
                echo "envoy-gateway-probe: probed $probed operators against a denominator of $EXPECTED_PROBES." >&2
                exit 1
              }

              echo "envoy-gateway-probe: probed $probed operators"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
{{- end }}
