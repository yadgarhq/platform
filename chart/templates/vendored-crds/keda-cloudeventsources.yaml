{{/*
VENDORED CustomResourceDefinition, EXTRACTED from `keda` 2.20.2 and re-emitted as
this chart's own template. Upstream source: `keda/templates/crds/crd-cloudeventsources.yaml`.

WHY THIS COPY EXISTS (ADR-0787, ADR-0792 condition 1). KEDA 2.20.2 ships its six
CRDs with NO uninstall protection: `grep -rn 'resource-policy'` over the upstream
chart returns no match, and it offers no `crds.keep` key. So `helm uninstall` of a
KEDA release deletes this CRD, and the API server garbage-collects every object of
its kind in the cluster along with it. The `helm.sh/resource-policy: keep`
annotation below is that protection.

IT CANNOT BE ADDED AT RELEASE TIME, which is what makes the copy permissible
rather than merely convenient. Resolution copies the upstream bytes faithfully —
that is the whole point of it — so no dependency resolution the release pipeline
performs can attach an annotation to another chart's object. `keda.crds.install`
is false in `chart/values.yaml` for the same reason: `platform` owns these six,
and the upstream copies would collide with them.

WHAT WOULD DELETE THIS FILE (ADR-0792 condition 4, the revisit trigger). KEDA
shipping uninstall protection for its own CRDs — a `crds.keep` key, or the
annotation in the upstream document. At that point the extraction has no subject
and these copies should be DELETED rather than re-vendored. Do not renew them out
of habit.

`scripts/tests/test_vendored_crds.py` is the drift gate ADR-0792 condition 3
requires, and it is the condition of this commit rather than a companion to it. It
renders the pin `chart/Chart.yaml` declares, strips the fields that legitimately
differ, and reddens when this document and that render disagree.

THE GUARD BELOW IS THIS FILE'S OWN, AND IT GOES THROUGH THE SHARED HELPER. It
mirrors the `condition:` of the dependency this CRD belongs to; it is NOT
`operators.create` over the directory. `templates/_operators.tpl` holds the one
expression every site reading `operators` calls, and its header carries the whole
argument: `dig` with `operators.create` as the fallback reproduces helm's own
resolution of a comma-separated `condition:`, `or` does not, and the
`kindIs "map"` arm inside it is what stops an adopter's `operators: true` raising
a Go stack trace out of THIS file before the refusal that names the key can run
(ADR-0794).
*/}}
{{- if (include "platform.operator-create" (dict "context" $ "operator" "keda")) }}
