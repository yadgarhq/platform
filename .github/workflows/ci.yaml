name: ci

# CI is defined once in yadgarhq/actions (D62). This file is the whole of this
# repository's CI configuration: the shared workflow detects what the repository
# is and runs what applies. Here that means a `chart/` — so `precommit` installs
# helm and runs this repository's hooks, including the pytest hook that carries
# the ladder gate and the render-check harness, and `portability` renders the
# chart with every `enabled` key false.
#
# NO WORKFLOW-LEVEL `permissions:` BLOCK, deliberately. A job cannot ask for more
# than the workflow grants, so a top-level `contents: read` makes the release
# job's `packages: write` invalid — and the failure is a run with ZERO JOBS and
# no logs, which says nothing about permissions. Each job states its own instead.
#
# Push to main runs the version report only. Validating there would re-run what
# the pull request just passed, on code already merged, with nobody watching.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  # THE PULL REQUEST GATE, AND IT CARRIES NO CREDENTIAL. `ci-pr.yaml` serves both
  # events, so one job calling it for both would hand the release App's private
  # key to every pull-request run — a run that builds and tests the branch's own
  # code. These are branch pull requests rather than fork ones, so GitHub does
  # pass secrets to them.
  #
  # The pull request has no use for it either: `version` is the only job that
  # reads those secrets, and its own condition is `push` to `refs/heads/main`.
  # So the split costs nothing and removes the whole exposure.
  #
  # THE NAME `ci` IS LOAD-BEARING. A ruleset requiring the check `ci / passed`
  # names `<caller job id> / <called job id>`, so renaming this job breaks the
  # merge gate rather than reporting anything.
  ci:
    if: github.event_name == 'pull_request'
    uses: yadgarhq/actions/.github/workflows/ci-pr.yaml@main
    permissions:
      contents: read
      checks: read

  # THE SAME SHARED WORKFLOW ON THE PUSH PATH, where the credential is needed and
  # where nothing unreviewed runs. A push to `main` here is a merge that has
  # already passed `ci / passed`.
  #
  # NAMED RATHER THAN `secrets: inherit`, and that is the estate's own tooling
  # deciding rather than a preference: zizmor's `secrets-inherit` audit fails
  # `inherit` at High confidence and would redden the `ci / workflows` job of this
  # very workflow. The audit is right about why — `inherit` passes every
  # organisation and repository secret the caller can see, not the two the callee
  # declares, and it GROWS SILENTLY as secrets are added to the organisation.
  main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: yadgarhq/actions/.github/workflows/ci-pr.yaml@main
    permissions:
      contents: read
      checks: read
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # THE TAG PATH, AND THE CREDENTIAL HERE IS NOT FOR THE `deployment` JOB.
  # `platform` ships no `Containerfile` — it is a chart with no binary, as
  # ADR-0752 authorised it — so `ci-release.yaml`'s `image` job skips and
  # `deployment` skips with it (its condition is `needs.image.result ==
  # 'success'`). No pod is ever pinned to a `platform` image.
  #
  # The credential is for whichever job in `ci-release.yaml` needs to act with the
  # release App's identity once a chart is released. The shared workflow gains and
  # loses jobs over time, and ADR-0560 asks that the secret reach every job that
  # reads it, not only the ones that exist in it today.
  #
  # THE FAILURE WOULD BE GREEN, which is why it is stated rather than assumed.
  # Both secrets are declared `required: false` in the callee, so a caller that
  # passes none hands over two empty strings and the job reports SUCCESS rather
  # than refusing.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    uses: yadgarhq/actions/.github/workflows/ci-release.yaml@main
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
