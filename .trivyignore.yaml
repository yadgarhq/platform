# Reviewed ignore list for the render-what-it-scans trivy gate (ledger 1150,
# D-A1, ADR-0847). trivy 0.74.0 does not auto-detect this file, and D-A1
# does not pass it to trivy: D-A1 scans unfiltered and `scripts/trivy_gate.py`
# (yadgarhq/actions) applies it, so an entry that matches no finding is
# detectable as stale. An entry ignores a finding only when `id` matches AND
# the finding's `Target` matches one of `paths` AND `expired_at` is still in
# the future; a `paths` glob outside this repo's upstream scope (ADR-0847;
# upstream glob per plan D-A1), an entry matching no finding, an entry with
# no `paths`, or an expired entry all fail the gate as stale.
#
# D-A1's own gate (`scripts/trivy_gate.py`, `yadgarhq/actions`#111) merged to
# `actions@main` while this PR was in flight, and it already runs on this PR
# as `ci / vulnerabilities`. Checks DB state changes what trivy reports: with
# no cached checks bundle (this measurement; CI runners start the same way)
# `--skip-check-update` falls back to trivy's EMBEDDED checks, one ID richer
# than a primed cache's downloaded bundle at the same trivy version — this
# repo's actual CI run surfaced `KSV-0050` that a cache-primed local run did
# not. Everything below is measured against the embedded fallback, the state
# that matters.
#
# Measured 2026-10-08 on this repo's `origin/main`, after
# `helm dependency update chart`, trivy 0.74.0, with an empty
# `TRIVY_CACHE_DIR` (forcing the embedded-checks fallback CI also hits):
#   trivy config --skip-check-update --skip-version-check --config /dev/null \
#     --ignorefile /dev/null --format json --severity HIGH,CRITICAL \
#     --helm-values chart/ci/values.yaml \
#     --helm-api-versions "$(paste -sd, chart/ci/api-versions.txt)" .
# reports exactly 45 findings (8 unique IDs, 32 unique ID+path pairs), every
# one under `chart/charts/**` — this repo's upstream glob (ADR-0847; upstream
# glob per plan D-A1) — and none in `chart/templates/vendored-crds/` or any
# other estate-authored template. Re-running the same scan with
# `--ignorefile .trivyignore.yaml`: 0 findings remain. Re-running again with
# every `expired_at` moved to the past: all 45 findings reappear, confirming
# trivy does not apply expired entries. Running `scripts/trivy_gate.py`
# itself (copied from `actions@main` 14d9b83, the merged D-A1 gate) against
# this worktree, same empty cache: `clean: every upstream finding is
# covered, no stale entries.`
#
# Each entry is scoped to the exact template file(s) of the one upstream
# chart it covers, not to `chart/charts/**` as a whole, so a future finding
# in any other operator subchart is not silently ignored. An entry naming
# more than one path covers only the one upstream chart's own templates that
# share the same root cause, verified per path above.
misconfigurations:
  # ── KSV-0014: root filesystem not read-only ──────────────────────────────
  - id: KSV-0014
    paths:
      - "chart/charts/mariadb-operator/templates/cert-controller/deployment.yaml"
      - "chart/charts/mariadb-operator/templates/operator/deployment.yaml"
      - "chart/charts/mariadb-operator/templates/webhook/deployment.yaml"
    statement: >-
      Upstream mariadb-operator (chart 26.6.0) ships no
      `securityContext.readOnlyRootFilesystem: true` on the
      cert-controller, controller or webhook container. The chart exposes a
      top-level `securityContext: {}` value per component; platform has not
      yet set it. Not an estate-authored template (ADR-0847; upstream glob
      per plan D-A1).
    expired_at: 2027-01-08
  - id: KSV-0014
    paths:
      - "chart/charts/prometheus/templates/deploy.yaml"
    statement: >-
      Upstream prometheus-community `prometheus` chart (29.27.0) ships no
      `readOnlyRootFilesystem: true` on the prometheus-server or
      configmap-reload containers of its `Deployment`. Not an
      estate-authored template (ADR-0847; upstream glob per plan D-A1).
    expired_at: 2027-01-08

  # ── KSV-0041: ClusterRole manages secrets ────────────────────────────────
  - id: KSV-0041
    paths:
      - "chart/charts/argo-cd/templates/argocd-notifications/clusterrole.yaml"
    statement: >-
      Upstream argo-cd (chart 8.6.1) grants ClusterRole
      `argocd-notifications-controller` access to manage `secrets`, which
      the notifications controller reads to resolve its own in-cluster
      credential secrets. Not an estate-authored template (ADR-0847;
      upstream glob per plan D-A1).
    expired_at: 2027-01-08
  - id: KSV-0041
    paths:
      - "chart/charts/cert-manager/templates/cainjector-rbac.yaml"
      - "chart/charts/cert-manager/templates/rbac.yaml"
    statement: >-
      Upstream cert-manager (chart v1.21.1) grants its cainjector and
      controller ClusterRoles access to manage `secrets`, which cert-manager
      needs to write the Certificate/CA/ACME key material it issues. Not an
      estate-authored template (ADR-0847; upstream glob per plan D-A1).
    expired_at: 2027-01-08
  - id: KSV-0041
    paths:
      - "chart/charts/gateway-helm/templates/envoy-gateway-rbac.yaml"
    statement: >-
      Upstream Envoy Gateway (chart v1.9.1) grants ClusterRole
      `envoy-gateway-role` access to manage `secrets`, which it reads to
      serve TLS certificates referenced by Gateway listeners. Not an
      estate-authored template (ADR-0847; upstream glob per plan D-A1).
    expired_at: 2027-01-08
  - id: KSV-0041
    paths:
      - "chart/charts/keda/templates/manager/clusterrole.yaml"
    statement: >-
      Upstream KEDA (chart 2.20.2) grants ClusterRole `keda-operator` access
      to manage `secrets`, which it reads to resolve TriggerAuthentication
      secret references. Not an estate-authored template (ADR-0847;
      upstream glob per plan D-A1).
    expired_at: 2027-01-08
  - id: KSV-0041
    paths:
      - "chart/charts/mariadb-operator/templates/cert-controller/rbac.yaml"
      - "chart/charts/mariadb-operator/templates/operator/rbac.yaml"
    statement: >-
      Upstream mariadb-operator (chart 26.6.0) grants its cert-controller
      and operator ClusterRoles access to manage `secrets`, which it writes
      TLS and database credential secrets into. Not an estate-authored
      template (ADR-0847; upstream glob per plan D-A1).
    expired_at: 2027-01-08

  # ── KSV-0044: wildcard verb on wildcard resource ─────────────────────────
  - id: KSV-0044
    paths:
      - "chart/charts/argo-cd/templates/argocd-application-controller/clusterrole.yaml"
    statement: >-
      Upstream argo-cd (chart 8.6.1) grants ClusterRole
      `argocd-application-controller` `*` verbs on `*` resources, which is
      how the controller reconciles arbitrary application-managed resources
      across the cluster. Not an estate-authored template (ADR-0847;
      upstream glob per plan D-A1).
    expired_at: 2027-01-08

  # ── KSV-0046: ClusterRole manages all resources ──────────────────────────
  - id: KSV-0046
    paths:
      - "chart/charts/argo-cd/templates/argocd-application-controller/clusterrole.yaml"
      - "chart/charts/argo-cd/templates/argocd-server/clusterrole.yaml"
    statement: >-
      Upstream argo-cd (chart 8.6.1) grants the application-controller and
      server ClusterRoles access to all resources, which is the same
      cluster-wide reconciliation surface KSV-0044 names for the
      application-controller. Not an estate-authored template (ADR-0847;
      upstream glob per plan D-A1).
    expired_at: 2027-01-08
  - id: KSV-0046
    paths:
      - "chart/charts/keda/templates/manager/clusterrole.yaml"
    statement: >-
      Upstream KEDA (chart 2.20.2) grants ClusterRole `keda-operator` access
      to all resources, which the operator needs to read the arbitrary
      Kubernetes objects its ScaledObject metrics sources reference. Not an
      estate-authored template (ADR-0847; upstream glob per plan D-A1).
    expired_at: 2027-01-08
  - id: KSV-0046
    paths:
      - "chart/charts/mariadb-operator/templates/operator/rbac-user.yaml"
    statement: >-
      Upstream mariadb-operator (chart 26.6.0) ships `edit` and `view`
      aggregated ClusterRoles that grant access to all resources, for
      cluster administrators to aggregate into their own RBAC rather than
      for the operator's own service account. Not an estate-authored
      template (ADR-0847; upstream glob per plan D-A1).
    expired_at: 2027-01-08

  # ── KSV-0056: ClusterRole manages Kubernetes networking ──────────────────
  - id: KSV-0056
    paths:
      - "chart/charts/cert-manager/templates/rbac.yaml"
    statement: >-
      Upstream cert-manager (chart v1.21.1) grants ClusterRole
      `cert-manager-controller-challenges` create/update/patch/delete on
      services, endpoints, endpointslices, networkpolicies and ingresses,
      which its ACME HTTP-01 solver needs to stand up and tear down its own
      temporary routing objects. Not an estate-authored template
      (ADR-0847; upstream glob per plan D-A1).
    expired_at: 2027-01-08
  - id: KSV-0056
    paths:
      - "chart/charts/gateway-helm/templates/infra-manager-rbac.yaml"
    statement: >-
      Upstream Envoy Gateway (chart v1.9.1) grants Role
      `gateway-helm-infra-manager` the same networking-object verbs, which
      it needs to manage the Services and endpoints it provisions for each
      Gateway listener. Not an estate-authored template (ADR-0847; upstream
      glob per plan D-A1).
    expired_at: 2027-01-08
  - id: KSV-0056
    paths:
      - "chart/charts/mariadb-operator/templates/operator/rbac.yaml"
    statement: >-
      Upstream mariadb-operator (chart 26.6.0) grants ClusterRole
      `mariadb-operator` the same networking-object verbs, which it needs to
      manage the Services it creates in front of each MariaDB and MaxScale
      instance. Not an estate-authored template (ADR-0847; upstream glob
      per plan D-A1).
    expired_at: 2027-01-08

  # ── KSV-0050: ClusterRole manages Kubernetes RBAC resources ──────────────
  - id: KSV-0050
    paths:
      - "chart/charts/mariadb-operator/templates/operator/rbac.yaml"
    statement: >-
      Upstream mariadb-operator (chart 26.6.0) grants ClusterRole
      `mariadb-operator` create/update/delete/deletecollection/impersonate/*
      on `roles` and `rolebindings`, which it needs to create the
      per-MariaDB RBAC objects some of its own CRDs reference. Not an
      estate-authored template (ADR-0847; upstream glob per plan D-A1).
    expired_at: 2027-01-08

  # ── KSV-0114: ClusterRole manages webhookconfigurations ──────────────────
  - id: KSV-0114
    paths:
      - "chart/charts/cert-manager/templates/cainjector-rbac.yaml"
    statement: >-
      Upstream cert-manager (chart v1.21.1) grants ClusterRole
      `cert-manager-cainjector` create/update/patch/delete on
      mutating/validatingwebhookconfigurations, which it needs to inject its
      own CA bundle into cert-manager's webhook registrations. Not an
      estate-authored template (ADR-0847; upstream glob per plan D-A1).
    expired_at: 2027-01-08
  - id: KSV-0114
    paths:
      - "chart/charts/keda/templates/manager/minimal-rbac.yaml"
    statement: >-
      Upstream KEDA (chart 2.20.2) grants ClusterRole
      `keda-operator-minimal-cluster-role` the same webhookconfiguration
      verbs, which it needs to manage its own validating webhook
      registration. Not an estate-authored template (ADR-0847; upstream
      glob per plan D-A1).
    expired_at: 2027-01-08
  - id: KSV-0114
    paths:
      - "chart/charts/mariadb-operator/templates/cert-controller/rbac.yaml"
    statement: >-
      Upstream mariadb-operator (chart 26.6.0) grants ClusterRole
      `mariadb-operator-cert-controller` the same webhookconfiguration
      verbs, which it needs to keep its webhook's CA bundle current. Not an
      estate-authored template (ADR-0847; upstream glob per plan D-A1).
    expired_at: 2027-01-08

  # ── KSV-0118: default security context (root-capable) ───────────────────
  - id: KSV-0118
    paths:
      - "chart/charts/argo-cd/templates/argocd-application-controller/statefulset.yaml"
      - "chart/charts/argo-cd/templates/argocd-applicationset/deployment.yaml"
      - "chart/charts/argo-cd/templates/argocd-notifications/deployment.yaml"
      - "chart/charts/argo-cd/templates/argocd-repo-server/deployment.yaml"
      - "chart/charts/argo-cd/templates/argocd-server/deployment.yaml"
      - "chart/charts/argo-cd/templates/dex/deployment.yaml"
    statement: >-
      Upstream argo-cd (chart 8.6.1) sets no pod or container
      `securityContext` on its application-controller, applicationset,
      notifications, repo-server, server or dex workloads, so each runs with
      the Kubernetes default, which allows root. Settable through argo-cd's
      per-component `containerSecurityContext` values; not yet done. Not an
      estate-authored template (ADR-0847; upstream glob per plan D-A1).
    expired_at: 2027-01-08
  - id: KSV-0118
    paths:
      - "chart/charts/mariadb-operator/templates/cert-controller/deployment.yaml"
      - "chart/charts/mariadb-operator/templates/operator/deployment.yaml"
      - "chart/charts/mariadb-operator/templates/webhook/deployment.yaml"
    statement: >-
      Upstream mariadb-operator (chart 26.6.0) sets no pod or container
      `securityContext` on its cert-controller, operator or webhook
      Deployments, so each runs with the Kubernetes default, which allows
      root. Settable through the chart's top-level `securityContext` value;
      not yet done. Not an estate-authored template (ADR-0847; upstream glob
      per plan D-A1).
    expired_at: 2027-01-08
