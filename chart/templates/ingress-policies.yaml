{{/*
THE TWO SHARED INGRESS POLICIES: who may dial the cache, and who may dial the
broker. Each follows the toggle that renders what it protects, so a policy never
outlives its workload and never arrives before it.

THESE ARE THE SECOND LAYER, NOT THE FIRST. `requirepass` on the cache and the
`authorization` block on the broker are enforced by those servers, so they hold on
every CNI and every platform. These policies hold only where the cluster's CNI
evaluates NetworkPolicy. The server-side control leads and the policy follows;
neither file depends on the other existing.

A podSelector THAT MATCHES NOTHING IS ACCEPTED, LISTED AND DESCRIBABLE, AND
PROTECTS NOTHING, and this estate has no control that refuses one (ADR-0685). Nor
does a passing kubelet probe carry any information about whether a policy is in
force (ADR-0592) — probe traffic comes from the node, not from a pod, so a
pod-selector ingress rule never applies to it. The only instrument is
`scripts/tests/test_shared_infrastructure.py`, which compares each selector with
the pod template labels the SAME RENDER produces.

NO `clients` VALUES LIST ON EITHER, AND SO NO ADR-0664 GUARD. ADR-0664 exists for
an ingress allow-list that arrives EMPTY from values and renders an allow-all
wearing a control's name — helm parses `--set clients={}` into a list holding one
empty string, so even a `not` guard passes. A selector written here cannot arrive
empty, so that hazard has no way in, and a `fail` beside it would be a refusal
with nothing to refuse. The `gateway` chart's own policy is the one that takes the
list and the guard, because its clients are an assertion about somebody else's
topology; these two name consumers inside this estate.

EGRESS IS NOT RESTRICTED AT ALL, only ingress. Egress rules need DNS carve-outs to
be usable, and a half-written egress policy breaks name resolution for everything
it selects. Ingress is the half that answers the question.
*/}}
{{- if .Values.valkey.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-ingress
spec:
  # The labels `valkey.yaml` stamps on the cache's pods, from the same key.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.valkey.name }}
  policyTypes: [Ingress]
  ingress:
    # THE ONE CONSUMER IS `gateway`, and that is the module chart's pod label
    # rather than anything this chart renders — no render can resolve it, so
    # the suite asserts it BY VALUE and says so. Each new consumer of the cache
    # is a line added here; the header of the cache's own file describes more
    # that will arrive.
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: {{ .Values.valkey.port }}
{{- end }}
{{- if .Values.nats.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-ingress
spec:
  # ── THE LABEL AND THE PORTS BELOW ARE LITERALS, AND THAT IS THE DESIGN ────
  # They describe the UPSTREAM chart's rendered output, which this chart does not
  # own. Reading them from the upstream chart's own values keys would make the
  # policy follow the broker automatically — and would make the gate over it
  # compare one source with itself, so a drift between the two could never be
  # caught. Written as literals, an adopter who sets `nats.nameOverride` or moves
  # `nats.config.nats.port` reddens
  # `test_a_moved_subchart_label_reddens_the_nats_policy_gate` and its port twin
  # instead of getting a policy that silently protects nothing.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
  policyTypes: [Ingress]
  ingress:
    # THE CLIENT PORT. The whole point of the file. Two consumers today: `iam`
    # publishes the cache-invalidation events and `gateway` subscribes to them.
    - from:
        - podSelector:
            matchLabels:
              app: iam
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 4222
    # THE MONITORING PORT, FROM ANYWHERE IN THE NAMESPACE, and deliberately not
    # narrowed. A NetworkPolicy with any ingress rule DENIES every port it does
    # not name, so a policy naming only 4222 would cut the endpoint the upstream
    # chart's own startup, readiness and liveness probes use — restarting a
    # healthy broker on the first CNI that enforces this. It is HTTP with no
    # authorization and no secrets on it, and kubelet probes do not come from a
    # pod this selector could name at all.
    - ports:
        - protocol: TCP
          port: 8222
    # THE CLUSTER PORT, from the broker's own pods. Clustering is off in the
    # values this chart ships, so this matches nothing today — it is here so that
    # turning clustering on does not silently produce a broker whose members
    # cannot route to each other, which presents as JetStream never becoming
    # ready.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 6222
{{- end }}
