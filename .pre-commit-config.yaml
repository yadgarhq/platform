# Every yadgarhq repo carries pre-commit (D59). Hook failure is signal, not
# obstacle: fix the cause and re-stage. Never --no-verify.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        # Helm templates are Go templates that HAPPEN to look like YAML, so a
        # real parser rejects them. `helm lint` and `helm template` below are the
        # checks that actually apply to those.
        #
        # `chart/values.yaml` and `example/values.yaml` are DELIBERATELY NOT
        # EXCLUDED. Nothing templates them, so a parse failure there is exactly
        # the fault this hook exists to catch — one commit before a render fails
        # on it.
        exclude: ^chart/templates/
      - id: check-json

  # Shared, from yadgarhq/actions (D62). IMMUTABLE rev: pre-commit caches a rev
  # at first install and never re-resolves it, so a moving tag would silently
  # freeze each machine at whatever it meant the day it first ran.
  - repo: https://github.com/yadgarhq/actions
    rev: v1.20.1
    hooks:
      - id: gitleaks
      - id: prettier
        exclude: ^chart/templates/
      # No Containerfile here and there never will be one — this repository ships
      # a chart with no binary (ADR-0752). The hook is a no-op and costs nothing,
      # and is kept so the config matches every other repository's rather than
      # being the one that has to be explained.
      - id: hadolint
      # A CONSUMER IS NOT LINTED UNTIL IT REFERENCES THE HOOK, which is why this
      # line exists rather than being inherited. This repository has a
      # `.github/workflows/`, and publication makes a check AVAILABLE rather than
      # switching it on (ledger 620, ADR-0577).
      #
      # The hook REFUSES rather than passes when actionlint's shellcheck rule
      # class is not running: actionlint silently disables that whole class when
      # the binary is absent, and "Passed, having checked nothing" is the defect
      # the guard closes rather than a state this check may report.
      - id: actionlint
      - id: helm-lint
      - id: no-test-skips

  # LOCAL, because it is this repository's own content assertion rather than a
  # rule the estate shares. ADR-0752 requires `platform` to carry one FROM ITS
  # FIRST COMMIT: it holds the ladder gate and the render-check harness, and it
  # must not inherit the six module charts' condition of being covered only by
  # `helm lint --strict`.
  #
  # `language: python` rather than `system`, so pre-commit provisions the
  # interpreter, pytest and PyYAML. PYYAML IS FOR THE SUBJECT AS WELL AS THE
  # SUITE: every case here parses a `helm template` render. Both pins match
  # `yadgarhq/actions`' own `pytest-scripts` hook and `yadgarhq/config`'s copy.
  #
  # HELM IS NOT PROVISIONED BY THIS HOOK and the suite does not skip without it —
  # it fails, naming helm (ADR-0650). `ci-pr.yaml`'s `precommit` job installs helm
  # v3.18.4 before it runs pre-commit, which is the version this suite is measured
  # against.
  #
  # `always_run` with `pass_filenames: false`, and `files:` is omitted rather than
  # written as documentation: a hook filtered on `^scripts/` reports `Skipped`,
  # exit 0, on a pull request that changes only `chart/values.yaml` — which is
  # exactly the pull request whose ladder this suite exists to check.
  - repo: local
    hooks:
      - id: pytest-scripts
        name: pytest scripts/tests
        language: python
        additional_dependencies: ["pytest==9.1.1", "pyyaml==6.0.3"]
        entry: pytest scripts/tests/ -q
        pass_filenames: false
        always_run: true
