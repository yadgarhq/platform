                description: Port of the external MariaDB.
                format: int32
                type: integer
              tls:
                description: TLS defines the PKI to be used with the external MariaDB.
                properties:
                  clientCASecretRef:
                    description: 'ClientCASecretRef is a reference to a Secret containing the client certificate authority keypair. It is used to establish trust and issue client certificates.

                      One of:

                      - Secret containing both the ''ca.crt'' and ''ca.key'' keys. This allows you to bring your own CA to Kubernetes to issue certificates.

                      - Secret containing only the ''ca.crt'' in order to establish trust. In this case, either clientCertSecretRef or clientCertIssuerRef fields must be provided.

                      If not provided, a self-signed CA will be provisioned to issue the client certificate.'
                    properties:
                      name:
                        default: ''
                        type: string
                    type: object
                  clientCertIssuerRef:
                    description: 'ClientCertIssuerRef is a reference to a cert-manager issuer object used to issue the client certificate. cert-manager must be installed previously in the cluster.

                      It is mutually exclusive with clientCertSecretRef.

                      By default, the Secret field ''ca.crt'' provisioned by cert-manager will be added to the trust chain. A custom trust bundle may be specified via clientCASecretRef.'
                    properties:
                      group:
                        description: 'Group of the issuer being referred to.

                          Defaults to ''cert-manager.io''.'
                        type: string
                      kind:
                        description: 'Kind of the issuer being referred to.

                          Defaults to ''Issuer''.'
                        type: string
                      name:
                        description: Name of the issuer being referred to.
                        type: string
                    required:
                    - name
                    type: object
                  clientCertSecretRef:
                    description: 'ClientCertSecretRef is a reference to a TLS Secret containing the client certificate.

                      It is mutually exclusive with clientCertIssuerRef.'
                    properties:
                      name:
                        default: ''
                        type: string
                    type: object
                  enabled:
                    description: 'Enabled indicates whether TLS is enabled, determining if certificates should be issued and mounted to the MariaDB instance.

                      It is enabled by default.'
                    type: boolean
                  galeraSSTEnabled:
                    description: 'GaleraSSTEnabled determines whether Galera SST connections should use TLS.

                      It disabled by default.'
                    type: boolean
                  mutual:
                    description: 'Mutual specifies whether TLS must be mutual between server and client for external connections.

                      When set to false, the client certificate will not be sent during the TLS handshake.

                      It is enabled by default.'
                    type: boolean
                  required:
                    description: 'Required specifies whether TLS must be enforced for all connections.

                      User TLS requirements take precedence over this.

                      It disabled by default.'
                    type: boolean
                  serverCASecretRef:
                    description: 'ServerCASecretRef is a reference to a Secret containing the server certificate authority keypair. It is used to establish trust and issue server certificates.

                      One of:

                      - Secret containing both the ''ca.crt'' and ''ca.key'' keys. This allows you to bring your own CA to Kubernetes to issue certificates.

                      - Secret containing only the ''ca.crt'' in order to establish trust. In this case, either serverCertSecretRef or serverCertIssuerRef must be provided.

                      If not provided, a self-signed CA will be provisioned to issue the server certificate.'
                    properties:
                      name:
                        default: ''
                        type: string
                    type: object
                  serverCertAdditionalNames:
                    description: ServerCertAdditionalNames is a list of additional certificate common names
                    items:
                      type: string
                    type: array
                  serverCertIssuerRef:
                    description: 'ServerCertIssuerRef is a reference to a cert-manager issuer object used to issue the server certificate. cert-manager must be installed previously in the cluster.

                      It is mutually exclusive with serverCertSecretRef.

                      By default, the Secret field ''ca.crt'' provisioned by cert-manager will be added to the trust chain. A custom trust bundle may be specified via serverCASecretRef.'
                    properties:
                      group:
                        description: 'Group of the issuer being referred to.

                          Defaults to ''cert-manager.io''.'
                        type: string
                      kind:
                        description: 'Kind of the issuer being referred to.

                          Defaults to ''Issuer''.'
                        type: string
                      name:
                        description: Name of the issuer being referred to.
                        type: string
                    required:
                    - name
                    type: object
                  serverCertSecretRef:
                    description: 'ServerCertSecretRef is a reference to a TLS Secret containing the server certificate.

                      It is mutually exclusive with serverCertIssuerRef.'
                    properties:
                      name:
                        default: ''
                        type: string
                    type: object
                type: object
              username:
                description: Username is the username to connect to the external MariaDB.
                type: string
            required:
            - host
            - username
            type: object
          status:
            description: ExternalMariaDBStatus defines the observed state of MariaDB
            properties:
              conditions:
                description: Conditions for the ExternalMariadb object.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: 'lastTransitionTime is the last time the condition transitioned from one status to another.

                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.'
                      format: date-time
                      type: string
                    message:
                      description: 'message is a human readable message indicating details about the transition.

                        This may be an empty string.'
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: 'observedGeneration represents the .metadata.generation that the condition was set based upon.

                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date

                        with respect to the current state of the instance.'
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: 'reason contains a programmatic identifier indicating the reason for the condition''s last transition.

                        Producers of specific condition types may define expected values and meanings for this field,

                        and whether the values are considered a guaranteed API.

                        The value should be a CamelCase string.

                        This field may not be empty.'
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
