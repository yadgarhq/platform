{{/*
THE TWO SHARED INGRESS POLICIES: who may dial the cache, and who may dial the
broker. Each follows the toggle that renders what it protects, so a policy never
outlives its workload and never arrives before it.

THESE ARE THE SECOND LAYER, NOT THE FIRST. `requirepass` on the cache and the
`authorization` block on the broker are enforced by those servers, so they hold on
every CNI and every platform. These policies hold only where the cluster's CNI
evaluates NetworkPolicy. The server-side control leads and the policy follows;
neither file depends on the other existing.

A podSelector THAT MATCHES NOTHING IS ACCEPTED, LISTED AND DESCRIBABLE, AND
PROTECTS NOTHING, and this estate has no control that refuses one (ADR-0685). Nor
does a passing kubelet probe carry any information about whether a policy is in
force (ADR-0592) — probe traffic comes from the node, not from a pod, so a
pod-selector ingress rule never applies to it. The only instrument is
`scripts/tests/test_shared_infrastructure.py`, which compares each selector with
the pod template labels the SAME RENDER produces.

NO `clients` VALUES LIST ON EITHER, AND SO NO ADR-0664 GUARD. ADR-0664 exists for
an ingress allow-list that arrives EMPTY from values and renders an allow-all
wearing a control's name — helm parses `--set clients={}` into a list holding one
empty string, so even a `not` guard passes. A selector written here cannot arrive
empty, so that hazard has no way in, and a `fail` beside it would be a refusal
with nothing to refuse. The `gateway` chart's own policy is the one that takes the
list and the guard, because its clients are an assertion about somebody else's
topology; these two name consumers inside this estate.

EGRESS IS NOT RESTRICTED AT ALL, only ingress. Egress rules need DNS carve-outs to
be usable, and a half-written egress policy breaks name resolution for everything
it selects. Ingress is the half that answers the question.
*/}}
{{- if .Values.valkey.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-ingress
spec:
  # The labels `valkey.yaml` stamps on the cache's pods, from the same key.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.valkey.name }}
  policyTypes: [Ingress]
  ingress:
    # THE ONE CONSUMER IS `gateway`, and that is the module chart's pod label
    # rather than anything this chart renders — no render can resolve it, so
    # the suite asserts it BY VALUE and says so. Each new consumer of the cache
    # is a line added here; the header of the cache's own file describes more
    # that will arrive.
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: {{ .Values.valkey.port }}
{{- end }}
{{- if .Values.nats.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-ingress
spec:
  # ── THE LABEL AND THE PORTS BELOW ARE LITERALS, AND THAT IS THE DESIGN ────
  # They describe the UPSTREAM chart's rendered output, which this chart does not
  # own. Reading them from the upstream chart's own values keys would make the
  # policy follow the broker automatically — and would make the gate over it
  # compare one source with itself, so a drift between the two could never be
  # caught. Written as literals, an adopter who sets `nats.nameOverride` or moves
  # `nats.config.nats.port` reddens
  # `test_a_moved_subchart_label_reddens_the_nats_policy_gate` and its port twin
  # instead of getting a policy that silently protects nothing.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
  policyTypes: [Ingress]
  ingress:
    # THE CLIENT PORT. The whole point of the file. Two consumers today: `iam`
    # publishes the cache-invalidation events and `gateway` subscribes to them.
    - from:
        - podSelector:
            matchLabels:
              app: iam
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 4222
    # THE MONITORING PORT, NARROWED TO THIS RELEASE'S OWN NAMESPACE.
    #
    # WHAT IT USED TO BE. This rule carried NO `from` at all, which is not a
    # narrower scope — it is the widest one there is. An ingress rule whose `from`
    # is absent or empty matches ALL SOURCES (ADR-0664, read off the OpenAPI
    # description compiled into the kubectl binary: "If this field is empty or
    # missing, this rule matches all sources"). Not "from anywhere in the
    # namespace": every namespace, and whatever else the cluster's CNI presents to
    # this pod. Any workload anywhere could GET `http://<nats-pod-ip>:8222/varz`,
    # `/connz` or `/subsz` and read back subject names, connected clients and the
    # server's configuration. 8222 is plain HTTP with no authorization on it, so
    # the network layer is the only thing that scopes it.
    #
    # THE RISK THE NARROWING HAD TO CLEAR, AND HOW IT WAS CLEARED. A NetworkPolicy
    # with any ingress rule DENIES every source it does not name, and all THREE of
    # the upstream chart's probes — startup, readiness and liveness — are `httpGet`
    # against the `monitor` port, which is this one. Kubelet probes originate from
    # the NODE, and a `namespaceSelector` matches PODS, so if node-sourced traffic
    # were subject to this rule the narrowing would restart a healthy broker in a
    # loop. It is not, and that was MEASURED rather than reasoned:
    #
    #   * kindnetd v20260528-9350166c runs the `kube-network-policies` controller,
    #     and its enforcement is proven by SIX DEMANDED REFUSALS, each against an
    #     unpoliced control that connected at 0s. ADR-0688's "twelve times" is those
    #     six refusals PLUS their six controls, not twelve refusals — the arithmetic
    #     is stated here because the shorter reading over-attributes. Enforcement is
    #     an established premise, not an assumption, and that is what makes the next
    #     two bullets evidence at all.
    #   * THE CONTROLLED COMPARISON, and it is the strongest evidence here because
    #     both halves land on ONE policy object and ONE port. `project-ingress`
    #     names 50052 with a single rule, `from: [podSelector{app: gateway}]`.
    #     Ledger 511 (via ADR-0688) measured a probe pod's connection to
    #     `project:50052` TIMING OUT at the 4s deadline, while two unpoliced
    #     controls connected at 0s. On that same rule and that same port, the
    #     kubelet's `tcpSocket` probe SUCCEEDS continuously: `periodSeconds: 2`,
    #     `timeoutSeconds: 1`, `failureThreshold: 2`, and both `project` pods read
    #     1/1 Ready — so the kubelet completed a TCP connect to 50052 within the
    #     last ~4 seconds. The policy is `generation: 1`, created
    #     2026-09-12T21:16:07Z, so it has not been edited since that measurement:
    #     the rule the POD peer was dropped by is the rule the NODE peer is
    #     admitted by. The pod peer is dropped and the node peer is admitted, on
    #     one object. That is a comparison, not an absence — which is what the
    #     estate's standing rule asks for, and it is strictly stronger than the
    #     generic "probes pass under a policy" below.
    #   * Given enforcement, EIGHT WORKLOADS in the live estate — 15 pods — carry a
    #     kubelet probe on a port whose only ingress rule names selectors a node
    #     cannot match, and every one of them is Ready. The closest case is
    #     `gateway`: its 8080 rule is a `namespaceSelector` on
    #     `envoy-gateway-system`, the same construct written below, and its
    #     readiness probe succeeds against it continuously.
    #
    # ADR-0592 IS THE RULE, AND THIS FILE USED TO CITE IT BACKWARDS. Its title is
    # "Kubelet probe traffic is EXEMPT from ingress NetworkPolicy"; what it forbids
    # is inferring that a policy is ABSENT because a probe passes. That is the
    # opposite direction from this one. The comment that stood here read its
    # one-way caution as a claim that probe behaviour under a narrower rule is
    # unknowable, and so argued for allow-all from a reference that says probes are
    # exempt.
    #
    # THE LIVE PROBES ARE `tcpSocket` AND `exec`, THESE ARE `httpGet`, AND THE
    # EVIDENCE STILL TRANSFERS. Of the eight workloads counted above, seven probe
    # with `tcpSocket` and `valkey` carries a `tcpSocket` liveness probe beside an
    # `exec` readiness probe. NetworkPolicy is an L3/L4 control. An `httpGet` probe
    # is a TCP connection from the kubelet to the pod IP on this port, with a
    # request written into it once the connection is up; the difference between the
    # probe kinds is entirely above the layer this rule acts on. (An `exec` probe
    # runs inside the container and crosses no network at all, so it is the weakest
    # of the three as evidence and is not what the argument rests on.)
    #
    # NOTHING OUTSIDE THIS NAMESPACE WAS READING IT. Measured across the live
    # estate before narrowing: no `PodMonitor` or `ServiceMonitor` CRD exists and
    # scraping is annotation-based, the broker's pod carries NO `prometheus.io/*`
    # annotation, all seven KEDA ScaledObjects trigger on `prometheus` and none on
    # `nats-jetstream`, `natsBox` is off, and NO OBJECT OUTSIDE THE BROKER'S OWN
    # NAMES 8222 AT ALL.
    #
    # THE COUNT, WITH THE SCOPE THAT MAKES IT TRUE — because a count shipped
    # without its scope is the exact defect this rule's previous comment carried.
    # Matching the literal `8222` across ALL 112 listable API resource kinds in the
    # cluster returns NINE objects, and every one of them is the broker's own or the
    # machinery that deploys it. Five are authored: StatefulSet `yadgar/nats`,
    # ConfigMap `yadgar/nats-config`, Service `yadgar/nats-headless`, NetworkPolicy
    # `yadgar/nats-ingress` (this file's live counterpart) and Pod `yadgar/nats-0`.
    # Three are CONTROLLER-DERIVED from those five: ControllerRevision
    # `yadgar/nats-5f6d5f5996`, and the `Endpoints` and `EndpointSlice` for
    # `nats-headless`. The ninth is Argo `Application argocd/nats`, where 8222
    # appears only in PROSE inside `spec.source.helm.values` rather than as a port.
    # NARROWED TO THE FOUR KINDS a consumer would be written as — Deployment,
    # StatefulSet, DaemonSet and ConfigMap — the count is TWO: the broker's own
    # StatefulSet and ConfigMap. Two is true only with that qualifier attached, and
    # an earlier draft of this comment stated it without one.
    #
    # HOW IT WAS MEASURED, AND WHAT THE MEASUREMENT CANNOT SEE (ADR-0591). Every
    # one of the 112 kinds listed SUCCESSFULLY — none was skipped on an error — so
    # the census is not vacuous, which is the failure class this estate has hit
    # before. It is a literal string match, so a consumer dialling the headless
    # Service's NAMED `monitor` port would carry no `8222` for it to find; that
    # Service is itself in the census and nothing but the broker selects it, so
    # there is no gap in practice, but the census proves "no object names the
    # number" rather than "no code could reach the port". Measured 2026-09-24
    # against the `kind-yadgar` cluster.
    #
    # NAMESPACE SCOPE IS LOOSER THAN THAT CENSUS LICENSES, and one sentence here
    # saves the next reviewer from re-deriving it. Since nothing reads this port,
    # DELETING this rule outright would deny 8222 to every pod — a policy denies
    # what it does not name — and all three probes would still pass, because the
    # exemption above is what carries them. The operator ruled namespace scope, so
    # namespace scope is what is written; the evidence simply reaches further than
    # the ruling went, and this rule is not the tightest the measurement allows.
    #
    # THE ALTERNATIVE THAT WAS NOT TAKEN. An `ipBlock` for the node CIDR would
    # admit the kubelet explicitly rather than relying on the exemption. It is not
    # written here because the node CIDR is not derivable from a chart — it would
    # have to arrive as a values key every adopter supplies correctly, which is a
    # knob that breaks the estate rather than one that adapts it — and `ipBlock`
    # cannot say "the node this pod runs on" in any case, only "every node".
    #
    # THE CAVEAT THAT SURVIVES THE NARROWING, and it is the one true sentence the
    # old comment had: this leaves the probes to the CNI'S TREATMENT OF HOST
    # TRAFFIC, which is the thing that varies between CNIs. Exemption is measured
    # on kindnet here and is the behaviour Kubernetes intends, but an adopter whose
    # CNI subjects node-sourced traffic to pod-selector rules gets probes that fail
    # against this rule. D80: the measurement is from this estate's cluster, and
    # the chart ships further than the cluster does.
    #
    # THAT CAVEAT IS A NAMED DISAGREEMENT WITH ADR-0592, made openly rather than
    # quietly, which is this estate's convention for declining a binding ADR's
    # supporting sentence. ADR-0592's consequences say of the exemption: "It holds
    # on any CNI, so it survives the ledger 614 CNI decision whichever way that
    # goes." This file declines that generality. The exemption is what Kubernetes
    # INTENDS, and it is measured here on kindnet — but some CNIs do subject
    # host-sourced traffic to pod-selector ingress rules, so "any CNI" over-claims,
    # and a chart that ships to adopters cannot rest on it. ADR-0592's DECISION is
    # untouched and is relied on above: a passing probe is no evidence that a
    # policy is absent. It is one sentence of its consequences that is declined,
    # not the ruling.
    #
    # `deploy/infra/network-policies/shared-infrastructure.yaml` STILL ALLOWS ALL
    # on this port — it is the copy running today, and it does not change because
    # this one did. The two diverge until that copy is narrowed to match.
    - from:
        # `kubernetes.io/metadata.name` is set by kube-apiserver on every Namespace
        # (verified across all 14 in the live cluster), so this needs no labelling
        # from any chart. `.Release.Namespace` rather than a values key: the release
        # namespace is this chart's OWN render context, the same reason the valkey
        # rule below templates its port from this chart's values while the broker's
        # labels stay literals.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - protocol: TCP
          port: 8222
    # THE CLUSTER PORT, from the broker's own pods. Clustering is off in the
    # values this chart ships, so this matches nothing today — it is here so that
    # turning clustering on does not silently produce a broker whose members
    # cannot route to each other, which presents as JetStream never becoming
    # ready.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 6222
{{- end }}
