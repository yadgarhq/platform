{{/*
EVERY RENDER CHECK THIS CHART DECLARES, IN ONE FILE, AND THE FILE RENDERS NOTHING.

TWO KINDS OF CHECK LIVE HERE. A CAPABILITY check reads
`.Capabilities.APIVersions.Has` through `platform.require-api` and refuses when the
target does not carry an API group this render needs. A VALUES check reads the
release's own values and nothing else. THREE of the second kind live below — the
two arms of the `operators` shape refusal and then the mixed-release refusal —
and everything that makes a capability check awkward — `--api-versions`, the
offline-render rule, the default-false rule — does not apply to any of them.
Their red and green cases are BARE renders, and that is the design rather than an
omission. `scripts/tests/test_render_checks.py` owns the mixed-release pair and
the count of all three; `scripts/tests/test_operators_shape.py` owns what the two
shape arms do.

ONE CHECK PER OPERATOR, NOT ONE PER KIND. The self-signed Issuer, the CA
Certificate, the CA Issuer, the ten internal leaves and the edge leaf all come from
`cert-manager.io/v1`, and one operator provides that whole group — so they share a
check. The Gateway listener is the same shape one level along: it renders three
kinds from TWO groups behind ONE toggle, and carries ONE check.
`scripts/tests/test_render_checks.py` counts the checks DECLARED here and asserts
that number, so a check deleted from this file reddens the suite on the count
rather than letting it quietly exercise one fewer.

THE FILENAME DOES NOT BEGIN WITH AN UNDERSCORE, AND THAT IS LOAD-BEARING. helm
treats `templates/_*` as partials and never renders them, so a `fail` that lived
only in `_require_api.tpl` would never fire. The definition is a partial; the
CALL has to sit in a rendered template. Do not tidy the two into one file.

THE CONDITION IS THE OR OF EVERY TOGGLE THAT RENDERS A `cert-manager.io/v1`
OBJECT. Each of the three defaults false, so a render that asks for nothing is
never refused for a cluster it was never going to touch.
*/}}

{{/*
AN `operators` KEY NOTHING CAN READ, REFUSED BY NAME — IN TWO ARMS, BECAUSE THE
TWO CASES ARE VISIBLE FROM DIFFERENT PLACES (ADR-0794).

WHAT AN ADOPTER WRITES. `operators: true` is what somebody writes who thinks the
toggle IS the block rather than a key inside it; `operators: false` is what
somebody writes who read "default false" and wanted to be explicit; and a bare
`operators:` with nothing under it is YAML `null`. Before this refusal existed
the first two got a Go stack trace out of whichever of the nineteen sites
reading the key helm reached first — `templates/vendored-crds/` renders before
this file, because helm executes the deepest template path first.

AND NONE OF THESE SHAPES IS MERELY UNREADABLE. THEY ARE DANGEROUS, and in the
one direction nobody expects. Each of the five operators is declared
`condition: operators.<op>.create,operators.create`, and HELM LEAVES A DEPENDENCY
ENABLED WHEN NO PATH OF A MULTI-PATH `condition:` RESOLVES — measured, not read.
So a value in any of these shapes does NOT turn the operators off: it installs
all five, while `templates/_operators.tpl` correctly skips every CRD this chart
vendored for them and `keda.crds.install` is false. That is KEDA installed with
none of its own CRDs, at exit 0. Going quiet here would convert a loud failure
into the silent one ADR-0794 exists to forbid.

THE TEST IS `kindIs "map"` ON THE RAW VALUE, NEVER ON THE RESULT OF A `default`.
Sprig's `default` substitutes only on an EMPTY value, so `default dict false` is
`dict` and a kind test after it permits `false`, `0`, `""`, `[]` and an absent
key — five of the eight shapes, and the five most likely to be written.

── ARM ONE: AN ABSENT KEY, REFUSED WHEREVER THIS CHART RUNS ────────────────────

`hasKey` COMES FIRST AND DRIVES THE BRANCH, because `kindOf` answers `invalid`
for an absent key and for an explicit `null` alike and cannot tell them apart.
ADR-0794 prefers `hasKey` for that reason; here it is load-bearing for a case
that ADR did not anticipate.

AN ABSENT `operators` IS UNAMBIGUOUS HERE, and that is what makes this arm
unconditional. `chart/values.yaml` SHIPS `operators.create: false`, so the key is
present in every render this chart was given as written. Helm deletes a key whose
value is null — and it deletes it WITHOUT putting the chart's own default back —
so the key can only be missing because somebody wrote `operators: null`, or wrote
`operators:` with nothing under it.

AND THIS ARM IS THE ONLY THING IN THE ESTATE THAT CAN SEE THAT CASE. Measured
2026-09-26 on helm v4.3.0, `platform.operators: null` against `yadgarhq/chart`:

  platform.operators omitted   -> 32 objects, 0 from the operator subcharts
  platform.operators {create: false} -> 32 objects, 0 from the operator subcharts
  platform.operators null      -> 197 objects, 165 FROM THE OPERATOR SUBCHARTS,
                                  0 vendored CRDs, EXIT 0
  platform.operators {create: true}  -> exit 1, the parent refuses the path

The parent cannot refuse the third row. Helm resolves a dependency's `condition:`
against the RAW user values, where the key is null, so the five operators go in;
by the time any template runs the key has been deleted, and the parent measures
`hasKey` FALSE — indistinguishable from an adopter who never wrote the key at
all, which is every other adopter. The information exists only here, in the one
chart whose own defaults guarantee the key. So this arm refuses regardless of
whether this chart is the root or a subchart: deferring it defers to nobody.

── ARM TWO: A PRESENT NON-MAP, REFUSED ONLY WHEN THIS CHART IS THE ROOT ────────

`yadgarhq/chart` pins this chart and carries its own refusal for this case, in
`chart/templates/_validate.tpl`, naming the path the adopter actually typed:
`platform.operators`. It CAN see a present non-map — `true`, `false`, `0`, `""`,
`[]` and `[a]` all survive coalescing — so the diagnosis belongs there.

AND THE SUBCHART'S MESSAGE ALWAYS WINS, which is why this arm must stand down —
measured on helm v3.20.2 and v4.3.0, 2026-09-26: when a subchart and its parent
both abort, helm executes the deepest template path first, so a parent `fail` can
never pre-empt a child's. Refusing here unconditionally would make that parent
clause dead code AND make its own test pass against THIS message, which is a gate
that would stay green with the thing it tests deleted. ADR-0794's own rejected
alternatives put it directly: the child's guard "puts the diagnosis in the wrong
chart".

A STANDALONE `helm install platform` STILL GETS A KEY NAME rather than a stack
trace, which is what this arm is for.

`.Template.BasePath` IS THE DISCRIMINATOR AND IT IS MEASURED ON BOTH PINS. As
the root chart it is `platform/templates`; under a parent it is
`<parent>/charts/platform/templates`. `contains "/charts/"` separates the two,
identically on helm v3.20.2 and v4.3.0.

THE RESIDUAL, STATED RATHER THAN HIDDEN: a parent that pins this chart and
carries NO refusal of its own gets the silent fail-open for the six present
non-map shapes. `yadgarhq/chart` is the only parent this estate ships and it
carries one. `test_a_parent_with_no_refusal_is_the_residual_this_chart_documents`
measures that hole rather than asserting it away.

BOTH ARMS ARE DECLARED FIRST, BEFORE THE MIXED-RELEASE REFUSAL AND BEFORE THE
CAPABILITY CHECKS, and the order is load-bearing for the same reason theirs is:
`fail` aborts at the FIRST failing check, and a shape these arms name also
reaches the ones below them.
*/}}
{{- if not (hasKey .Values "operators") }}
{{- fail (join "" (list
      "platform: the operators key has been deleted from this release's values, and this chart ships it. "
      "`operators: null` — or a bare `operators:` with nothing under it — makes helm REMOVE the key rather than "
      "read it, and the chart's own `operators.create: false` goes with it. "
      "Each of the five operators is a dependency declared `condition: operators.<name>.create,operators.create`, "
      "and helm leaves a dependency ENABLED when no path of a multi-path condition resolves — so this does not "
      "turn the operators off, it installs all five while this chart skips every CustomResourceDefinition it "
      "vendored for them. "
      "Write `operators:` as a mapping: `create: false` to leave the operators out, `create: true` to install them "
      "in a release of their own (ADR-0787). To accept the chart's default, omit the key entirely.")) }}
{{- else if not (contains "/charts/" .Template.BasePath) }}
{{- if not (kindIs "map" .Values.operators) }}
{{- fail (printf (join "" (list
      "platform: operators is a %s rather than a mapping, so no operator key can be read out of it. "
      "Each of the five operators is a dependency declared `condition: operators.<name>.create,operators.create`, "
      "and helm leaves a dependency ENABLED when no path of a multi-path condition resolves — "
      "so a value in this shape does not turn the operators off, it installs all five while this chart "
      "skips every CustomResourceDefinition it vendored for them. "
      "Write `operators:` as a mapping: `create: false` to leave the operators out, `create: true` to install them "
      "in a release of their own (ADR-0787)."))
      (kindOf .Values.operators)) }}
{{- end }}
{{- end }}{{/* end of the two operators-shape arms */}}

{{/*
THE MIXED RELEASE, REFUSED HERE RATHER THAN HALF-WAY THROUGH AN APPLY (ADR-0787,
`plans/the-operators-toggle.md`).

`operators.create: true` names a release that installs the five operators and
NOTHING ELSE. A release that installs an operator AND renders an object of a kind
that operator provides cannot work, and the reason needs no cluster to check:
`.Capabilities.APIVersions.Has` is answered from discovery before any template
renders, so it can never see a CRD the same release is about to create. helm is
also understood to resolve the kind of every object in a release before it applies
anything, which would fail such a release mid-apply — that second mechanism is READ
rather than measured, and nothing here rests on it.

SO THE ADOPTER GETS TWO RELEASES: the operators in one, the estate in the next.
Without this check the mixed shape is refused anyway, by the cert-manager check
below, with a message telling the adopter to install cert-manager while cert-manager
sits in the same release. This check exists to say what is actually wrong.

IT IS DECLARED FIRST, AND THE ORDER IS LOAD-BEARING. `fail` aborts the whole render
at the FIRST failing check, and every mixed shape trips a capability check too. Move
this check below them and its refusal never reaches the adopter — the capability
refusal does, and the diagnosis is lost.
`test_the_values_check_is_declared_BEFORE_the_capability_checks` is the gate.

IT REFUSES A CASE THAT IS SOMETIMES LEGAL, AND THAT IS ACCEPTED. On a cluster that
already carries the CRDs, a mixed release would apply fine. Refusing it anyway is
what makes one values file behave the same on every cluster.

THE FIRST CONJUNCT IS NOT `operators.create`, AND THE DIFFERENCE IS A HOLE. Each
dependency's `condition:` is `operators.<op>.create,operators.create`, and helm
reads the FIRST VALID path and stops — so an adopter who sets
`operators.certManager.create: true` alone installs cert-manager with the register
key still false. `dig` with the register key as the FALLBACK is that same
resolution, which is why the guard below uses it. `or .Values.operators.keda.create
.Values.operators.create` does NOT reproduce it, and reading `operators.create`
alone misses the sub-key shape entirely.
`test_a_guard_reading_only_the_register_key_misses_the_sub_key_case` constructs that
wrong guard and watches the sub-key shape stop being refused.

THAT RESOLUTION NOW LIVES IN `templates/_operators.tpl`, AND SO DOES THE KEY NAME
THIS REFUSAL PRINTS. The helper is the shared one the plan asked for: the same
expression the eighteen vendored CRDs guard on, returning the key that turned the
operator on rather than a bare boolean, so the name below is derived where the
resolution is rather than beside it. It carries the type arm too, which is why
nothing here dereferences `operators` before its shape is known.

THE SECOND CONJUNCT IS EVERY OTHER `create` TOGGLE THIS CHART CARRIES, not only the
ones that render a CRD-backed kind. The rule being enforced is the release SHAPE —
operators alone, then everything else — and a rule stated over a subset is a rule an
adopter has to learn the exceptions to. `bootstrap.iamKeys.create` is absent because
it is nested: `templates/bootstrap-secrets.yaml` renders its block only inside the
`bootstrap.create` guard that opens the file, so the OR below already covers it.

BOTH LISTS ARE GATED AGAINST THEIR SOURCES rather than kept in step by attention —
against `Chart.yaml`'s dependencies and against `values.yaml`'s own keys. The plan's
shared helper NOW EXISTS — `templates/_operators.tpl`, called from here and from
all eighteen vendored-CRD guards of its step 2 — so the resolution is stated once;
these two gates keep the LISTS in step, which the helper says nothing about.
*/}}
{{- $operatorKeysOn := list }}
{{- range $operator := (list "argoCd" "certManager" "envoyGateway" "keda" "mariadbOperator") }}
{{- $key := (include "platform.operator-create" (dict "context" $ "operator" $operator)) }}
{{- if $key }}
{{- $operatorKeysOn = append $operatorKeysOn $key }}
{{- end }}
{{- end }}
{{- $otherKeysOn := list }}
{{/*
`index` AND NOT `dig` ON THIS SIDE, and it is not a style choice: `dig` takes a
`map[string]interface{}` and the ROOT `.Values` is helm's own `chartutil.Values`
type, so `dig <key> "create" false $.Values` dies with `interface conversion:
interface {} is common.Values` — measured on helm v4.3.0, 2026-09-25. The operator
side above passes `.Values.operators`, an ordinary map, which is why `dig` is
correct there and its fallback semantics are available there.
*/}}
{{- range $toggle := (list "bootstrap" "certificates" "edgeTLS" "gatewayListener" "internalCA" "nats" "valkey") }}
{{- if (index ((index $.Values $toggle) | default dict) "create") }}
{{- $otherKeysOn = append $otherKeysOn (printf "%s.create" $toggle) }}
{{- end }}
{{- end }}
{{- if and $operatorKeysOn $otherKeysOn }}
{{- fail (printf (join "" (list
      "platform: this release installs operators AND renders the estate's own objects, and one release cannot do both. "
      "%s asked for the operators; %s asked for the objects. "
      "An object's CustomResourceDefinition has to be registered on the target before the release that needs it renders, "
      "and a CRD this very release is installing is not — so this would fail part-way through the apply, with the operators in and the objects not. "
      "Install the operators in a release of their own, with every other create toggle false, then install the estate against the cluster that release leaves behind."))
      (join ", " (uniq $operatorKeysOn)) (join ", " $otherKeysOn)) }}
{{- end }}

{{- if or .Values.internalCA.create .Values.certificates.create .Values.edgeTLS.create }}
{{- include "platform.require-api" (dict
      "context" $
      "apiVersion" "cert-manager.io/v1"
      "operator" "cert-manager"
      "toggle" "internalCA.create, certificates.create or edgeTLS.create") }}
{{- end }}

{{/*
ENVOY GATEWAY, AND THE GROUP IS THE WHOLE DECISION.

`gatewayListener.create` renders three kinds from TWO API groups: a GatewayClass
and a Gateway on `gateway.networking.k8s.io/v1`, and an EnvoyProxy on
`gateway.envoyproxy.io/v1alpha1`. Only the second is checked, and the first is
deliberately NOT.

THE GATEWAY API IS A SPECIFICATION, NOT AN OPERATOR.
`.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1"` is satisfied by the
Gateway API CRDs ALONE. Istio registers them, and so does every other
implementation, so a check on that group is green on a cluster with no Envoy
Gateway anywhere — it names a specification and can never be the refusal that
names Envoy Gateway. The same cluster also serves
`gateway.networking.x-k8s.io/v1alpha1`, the upstream experimental channel, which
is wrong for the same reason. Three plausible strings, one correct: the EnvoyProxy
below is the object whose group no other implementation registers.

Adding a Gateway API check beside this one would be LEGAL under the default-false
rule and is still not added: it names no operator, so it adds a refusal nobody can
attribute. One check per operator is the count this chart asserts.

THE STRING IS A LITERAL HERE AND IS RECORDED IN `values.yaml` UNDER
`gatewayListener.envoyGateway.apiVersion`, read off the operator at the version
the estate pins. It has to be a literal because
`scripts/tests/test_render_checks.py` reads these arguments off the template to
count and exercise the checks; the gate that keeps the two in step is
`test_the_render_check_names_the_group_the_values_file_records`.

THE TOGGLE IS OPT-IN, which is what makes this check legal at all. A render check
may only ever sit behind a default-false toggle: `Has` is false for every
CRD-backed group with no cluster, so a check reachable at the defaults would
refuse every offline render in the estate.
*/}}
{{- if .Values.gatewayListener.create }}
{{- include "platform.require-api" (dict
      "context" $
      "apiVersion" "gateway.envoyproxy.io/v1alpha1"
      "operator" "Envoy Gateway"
      "toggle" "gatewayListener.create") }}
{{- end }}
