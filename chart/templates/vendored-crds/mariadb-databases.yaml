{{/*
VENDORED CustomResourceDefinition, EXTRACTED from `mariadb-operator-crds` 26.6.0 —
the subchart `mariadb-operator` 26.6.0 pulls in behind its own `crds.enabled` — and
re-emitted as this chart's own template. Upstream source: `mariadb-operator/charts/mariadb-operator-crds/templates/crds.yaml`.

WHY THIS COPY EXISTS (ADR-0787, ADR-0792 condition 1). `mariadb-operator-crds`
26.6.0 ships its twelve CRDs with NO uninstall protection: `grep -rn
'resource-policy'` over the upstream chart returns no match, and its `values.yaml`
is a 0-byte file offering no key at all. The upstream README states the
consequence against `crds.enabled`: "This should only be set to true during the
initial deployment. If this chart manages the CRDs and is later uninstalled, all
MariaDB instances will be DELETED." The `helm.sh/resource-policy: keep` annotation
below is the protection that warning asks for.

IT CANNOT BE ADDED AT RELEASE TIME, which is what makes the copy permissible
rather than merely convenient. Resolution copies the upstream bytes faithfully —
that is the whole point of it — so no dependency resolution the release pipeline
performs can attach an annotation to another chart's object.
`mariadb-operator.crds.enabled` is false in `chart/values.yaml` for the same
reason: `platform` owns these twelve, and the upstream copies would collide.

WHAT WOULD DELETE THIS FILE (ADR-0792 condition 4, the revisit trigger).
`mariadb-operator` shipping uninstall protection for its own CRDs — a `crds.keep`
key, or the annotation in the upstream document. At that point the extraction has
no subject and these copies should be DELETED rather than re-vendored. Do not
renew them out of habit.

`scripts/tests/test_vendored_crds.py` is the drift gate ADR-0792 condition 3
requires, and it is the condition of this commit rather than a companion to it. It
renders the pin `chart/Chart.yaml` declares, strips the fields that legitimately
differ, and reddens when this document and that render disagree.

THE GUARD BELOW IS THIS FILE'S OWN. It mirrors the `condition:` of the dependency
this CRD belongs to; it is NOT `operators.create` over the directory. `dig` with
`operators.create` as the fallback reproduces helm's own semantics — helm reads
the FIRST valid path of a comma-separated `condition:` and ignores the rest — so
an unset `operators.mariadbOperator.create` defers to the register key and a set
one wins. `or` does NOT reproduce it: it is true where the dependency's condition
is false, which applies mariadb's CRDs to a cluster running no operator at all.
*/}}
{{- if (dig "mariadbOperator" "create" .Values.operators.create .Values.operators) }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    helm.sh/resource-policy: keep
  name: databases.k8s.mariadb.com
spec:
  group: k8s.mariadb.com
  names:
    kind: Database
    listKind: DatabaseList
    plural: databases
    shortNames:
    - dmdb
    singular: database
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Status
      type: string
    - jsonPath: .spec.characterSet
      name: CharSet
      type: string
    - jsonPath: .spec.collate
      name: Collate
      type: string
    - jsonPath: .spec.mariaDbRef.name
      name: MariaDB
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.name
      name: Name
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Database is the Schema for the databases API. It is used to define a logical database as if you were running a 'CREATE DATABASE' statement.
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation of an object.

              Servers should convert recognized schemas to the latest internal value, and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this object represents.

              Servers may infer this from the endpoint the client submits requests to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: DatabaseSpec defines the desired state of Database
            properties:
              characterSet:
                default: utf8
                description: CharacterSet to use in the Database.
                type: string
              cleanupPolicy:
                description: CleanupPolicy defines the behavior for cleaning up a SQL resource.
                enum:
                - Skip
                - Delete
                type: string
              collate:
                default: utf8_general_ci
                description: Collate to use in the Database.
                type: string
              mariaDbRef:
                description: MariaDBRef is a reference to a MariaDB object.
                properties:
                  kind:
                    description: Kind of the referent.
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                  waitForIt:
                    default: true
                    description: WaitForIt indicates whether the controller using this reference should wait for MariaDB to be ready.
                    type: boolean
                type: object
              name:
                description: Name overrides the default Database name provided by metadata.name.
                maxLength: 80
                type: string
              requeueInterval:
                description: RequeueInterval is used to perform requeue reconciliations.
                type: string
              retryInterval:
                description: RetryInterval is the interval used to perform retries.
                type: string
            required:
            - mariaDbRef
            type: object
          status:
            description: DatabaseStatus defines the observed state of Database
            properties:
              conditions:
                description: Conditions for the Database object.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: 'lastTransitionTime is the last time the condition transitioned from one status to another.

                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.'
                      format: date-time
                      type: string
                    message:
                      description: 'message is a human readable message indicating details about the transition.

                        This may be an empty string.'
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: 'observedGeneration represents the .metadata.generation that the condition was set based upon.

                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date

                        with respect to the current state of the instance.'
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: 'reason contains a programmatic identifier indicating the reason for the condition''s last transition.

                        Producers of specific condition types may define expected values and meanings for this field,

                        and whether the values are considered a guaranteed API.

                        The value should be a CamelCase string.

                        This field may not be empty.'
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
